window.AH_GRAPHICS["canning-preserving-tomatoes-california-guide-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Acid Goes in Every Jar, Every Method</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The non-negotiable step for whole, crushed, or juiced tomatoes</p>\n  </div>\n<div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 620px; background-color: #ffffff !important;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Acid option</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Per quart</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Per pint</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Note</th></tr></thead><tbody><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Bottled lemon juice</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">2 tablespoons</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">1 tablespoon</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Bottled, not fresh; bottled acidity is standardized</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Citric acid</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">1/2 teaspoon</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">1/4 teaspoon</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">No flavor change; add before filling the jar</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">5 percent vinegar</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">4 tablespoons</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">2 tablespoons</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">NCHFP notes possible undesirable flavor changes</td></tr></tbody></table></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>The acid is required even when you pressure can. NCHFP's pressure processes were not developed for tomatoes without added acid. Sugar may be added to offset taste; the acid may not be left out.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: National Center for Home Food Preservation, Canning Tomatoes Introduction.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["canning-preserving-tomatoes-california-guide-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Water Bath or Pressure Canner?</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">For properly acidified tomatoes, both are tested and both are safe</p>\n  </div>\n<div style=\"padding: 22px; background-color: #f8f9f0 !important;\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\"><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Boiling water bath</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">A tall stockpot with a rack; cheap and forgiving</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Processes tomatoes in 35 to 45 minutes at Santa Cruz County elevations</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">All you need for 20 to 30 jars a season</span></div></div><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Pressure canner</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cuts processing time roughly in half for some tomato products</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Required anyway for low-acid foods: plain vegetables, beans, meat sauces</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Use NCHFP's tomato-specific pressure times, never a guess</span></div></div></div></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>Not tested, not safe: open-kettle canning, oven canning, dishwasher canning, and adding untested ingredients (extra onions, peppers, oil) to a plain tomato recipe. Salsa must come from a tested recipe.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: National Center for Home Food Preservation; UC Master Food Preservers of Inyo and Mono Counties.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

tical-align: top;\">Pints 40 min<br>Quarts 45 min</td></tr></tbody></table></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>The clock starts when the water returns to a full rolling boil after the jars go in. If the boil stops, bring it back and restart timing from zero. Keep at least 1 inch of water over the jar tops. Pressure options exist for all three products; read the full NCHFP table for your canner type.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: National Center for Home Food Preservation tested procedures for whole or halved tomatoes packed in water, crushed tomatoes with no added liquid, and standard tomato sauce.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["building-fall-winter-garden-coastal-california-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">The Fall Planting Calendar for Santa Cruz County</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Built backward from the November 18 daylight deadline</p>\n  </div>\n<div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\"><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">August: start the engine</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Start brassica and lettuce seed in trays, about six weeks before a mid-September transplant. Direct-sow carrots and beets in any bed that is already open.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">September: the anchor month</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Transplant brassicas and greens, keep direct-sowing roots, and sow peas late in the month. Hand-water through the warm, dry establishment weeks.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">October: last comfortable call</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Transplanted greens and lettuce still make it. Plant garlic, sow fava beans, and put cover crops on any bed you will not plant.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; \"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">November: garlic and favas only</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Both perform normally planted now. Everything else becomes a February project, which is a legitimate choice as long as you know you are making it.</div></div></div></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>After November 18 there are fewer than 10 hours of daylight and growth nearly stops. A plant near full size by mid-November feeds you all winter; a tiny one idles until February.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Master Gardeners of Sonoma County (daylight threshold); UC Marin Master Gardeners; UC Master Gardeners of Santa Clara County.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["building-fall-winter-garden-coastal-california-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">What to Grow, Family by Family</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The cool-season roster for a coastal fall and winter garden</p>\n  </div>\n<div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 720px; background-color: #ffffff !important;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Family</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Crops</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Seed or transplant</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Window</th></tr></thead><tbody><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Brassicas</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Kale, collards, broccoli, cauliflower, cabbage, Brussels sprouts, bok choy, turnips</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Transplant (start in trays six weeks ahead)</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Seed August, transplant September</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Greens and herbs</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Lettuce, spinach, arugula, chard, parsley, cilantro</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Either: direct-sow in September, transplants in October</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">September and October</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Roots</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Carrots, beets, radishes, turnips</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Direct-sow always; transplanting damages the roots</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">August through October</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Peas</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Sugar snap and snow peas</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Direct-sow</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Late September into October</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Alliums</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Garlic, bulb and green onions (intermediate-day varieties for our latitude)</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Cloves and sets</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">October and November</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Open beds</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Cover crops: fava, vetch, clover</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Direct-sow</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">October and November</td></tr></tbody></table></div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Master Gardeners of Alameda County; UC Marin Master Gardeners; UC Master Gardeners of Sonoma County.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["building-fall-winter-garden-coastal-california-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Flipping a Summer Bed to Winter</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">One bed, two weekends: clear and amend, then plant and protect</p>\n  </div>\n<div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\"><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Clear with judgment, not sentiment</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">A trickle of late tomatoes does not outrank a broccoli deadline. Pull diseased plants outright; powdery-mildew squash and rusted beans go to green waste, not a cool compost pile.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Rebuild the soil</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Fork 2 to 3 inches of compost into the top few inches while the soil is moist but not wet. Heavy-feeding brassicas after heavy-feeding tomatoes will use all of it.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Rotate the families</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">No nightshades after nightshades, no brassicas where brassicas grew last winter. Even a one-bed shuffle interrupts soil-borne disease cycles.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Transplant and water in</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Set out six-week-old seedlings, water deeply, and keep moisture steady until the rains take over.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">5</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Mulch, with a gap</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Straw or leaf mulch holds September moisture and stops rain crusting, but keep it pulled back a few inches from seedlings. Winter mulch is also slug housing.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; \"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">6</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Budget for mollusks</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Bait, barriers, and evening patrols for the first two weeks after transplanting are not optional in a coastal garden.</div></div></div></div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Marin Master Gardeners (soil amendment); UC Master Gardeners of Sonoma County.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["start-broccoli-cauliflower-seeds-fall-harvest-c1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Seed to Harvest: the Fall Brassica Timeline</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Warm start, cool finish: the schedule that fits Santa Cruz County</p>\n  </div>\n<div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\"><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Mid-July to mid-August: sow in trays</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Two seeds per cell, 1/2 inch deep. Sow cauliflower at the early end of the window; it punishes lateness harder than broccoli. Two rounds two weeks apart spreads the harvest.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Six weeks later: transplant</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Mid-August through September, at 4 to 6 true leaves, stocky and wider than tall. Bury the stem to the first true leaves.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">October: last realistic call</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Best with purchased starts, and expect later heads.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; \"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Late October into winter: heads</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Heads form in cool weather, which is the point. Broccoli keeps paying in side shoots after the central head; cauliflower gives one curd.</div></div></div></div><div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">UC IPM: germination is best near 70 degrees, growth strongest at average temperatures of 60 to 65. A late-summer sowing rides exactly that trajectory.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Master Gardeners of Santa Clara County planting chart; UC IPM cultural tips; UC Master Gardeners of Alameda County.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["start-broccoli-cauliflower-seeds-fall-harvest-c2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Transplant Day Checklist</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Mid-September is often the hottest stretch of the year; plant accordingly</p>\n  </div>\n<div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\"><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Prep the bed first</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Raised beds with generous compost worked in. Both crops are heavy feeders following heavy summer feeders.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Plant deep</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Bury the stem up to the first true leaves. Brassicas root along the buried stem, and deep planting fixes a leggy seedling.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Space for the mature plant</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Broccoli 9 to 12 inches apart; cauliflower a full 24 inches. Cramming cauliflower yields golf-ball curds.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Water in hard, then keep it even</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Deep watering pushes roots down. Deep and less frequent beats a daily sprinkle.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">5</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Shade the first week</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">50 percent shade cloth or two layers of floating row cover until about 6 leaves, plus midday shade in any heat spell.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; \"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">6</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Defend from day one</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">A six-week-old brassica seedling is the most-eaten object in a fall garden. Bait or barriers against slugs and birds at transplant time.</div></div></div></div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: UC IPM cultural tips for growing broccoli and cauliflower.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["start-broccoli-cauliflower-seeds-fall-harvest-c3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">The Three Classic Failures</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Buttoning, bolting, and bad curds, and what prevents each</p>\n  </div>\n<div style=\"padding: 22px; background-color: #f8f9f0 !important;\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\"><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Buttoning: tiny premature heads</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cause: stress while young. Transplants held too long, drought or hunger checks, prolonged cold below 50 on small plants</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Prevention: on-time six-week transplants, steady water, light nitrogen every 3 to 4 weeks</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">A buttoned head will not enlarge. Harvest it and eat it</span></div></div><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Bolting and open heads</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cause: heat above the 77 to 86 degree band, or heads left standing past maturity</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Prevention: the fall schedule itself, plus prompt harvest as soon as heads mature</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">With broccoli, cut the central head and the plant pays you back in side shoots</span></div></div><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Loose, ricey, or off-color curds</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cause: uneven water in a fussier plant, plus sun exposure on classic white varieties</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Prevention: even moisture, self-blanching or colored varieties, harvest while the curd is still tight</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cauliflower remembers a rough week and shows you in the curd</span></div></div></div></div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: UC IPM cultural tips for growing broccoli and cauliflower.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["protect-seedlings-from-slugs-and-snails-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Before the Seedlings Go In</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Start ten days to two weeks ahead of transplant day</p>\n  </div>\n<div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\"><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Clear the housing</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Remove boards, pots, brush piles, and leaf litter within a few feet of the bed. Clear weedy strips and dense ground covers; UC IPM specifically flags ivy as prime snail shelter.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Hunt the survivors</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Water the area in late afternoon, return after dark with a flashlight, and drop everything you find into soapy water. Two nights of this removes the resident adults.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Set board traps</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">A 12 by 15 inch board raised an inch off the soil. Slugs and snails shelter under it at dawn; scrape and destroy the catch each morning.</div></div></div><div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; \"><span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span><div><div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Fix the water schedule</div><div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Switch to drip or morning watering so surfaces dry by evening. An overhead sprinkler at dusk is a slug dinner bell.</div></div></div></div><div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">Not worth your time: crushed eggshells as a barrier. Controlled tests show slugs cross them without hesitation.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: UC IPM Pest Notes: Snails and Slugs, UC ANR Publication 7427.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["protect-seedlings-from-slugs-and-snails-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Choosing and Timing Slug Bait</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The third layer of defense, not the first</p>\n  </div>\n<div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 680px; background-color: #ffffff !important;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Bait</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Speed</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Safety</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Verdict</th></tr></thead><tbody><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Iron phosphate (Sluggo and similar)</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Stops feeding fast; death within about a week</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Safe around children, pets, and wildlife per UC IPM</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">The default choice, and the only bait to use near a flock</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Ferric sodium EDTA</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Faster, roughly three days</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Follow the label</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">A reasonable alternative when speed matters</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Metaldehyde</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Fast</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Particularly poisonous to dogs and cats; do not use where pets or children are present, per UC IPM</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Leave it on the shelf</td></tr></tbody></table></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>Timing: lightly irrigate before an evening application to get mollusks moving, scatter pellets thinly at dusk rather than piling them, avoid heavy watering afterward, and refresh after significant rain.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Source: UC IPM Pest Notes: Snails and Slugs, UC ANR Publication 7427.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["plants-repel-garden-pests-california-m1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">The Marigold Fact-Check</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The most famous claim in companion planting, audited</p>\n  </div>\n<div style=\"padding: 22px; background-color: #f8f9f0 !important;\"><div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;\"><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Repels insects above ground: unproven</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">UC Fresno Master Gardeners: marigold compounds \"may (or may not) repel insects\" and remain poorly studied</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Contra Costa Master Gardeners report cabbage butterflies finding cabbage and broccoli despite marigold borders</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Interplanted marigolds still earn space by feeding hoverflies, a different mechanism than repellency</span></div></div><div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\"><div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Suppresses root knot nematodes: documented, with conditions</div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Grow a solid planting for an entire season; interplanted among vegetables, control usually is not very good</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">French cultivars only: Nemagold, Petite Blanc, Queen Sophia, Tangerine. Avoid signet marigolds, which nematodes feed and reproduce on</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Works poorly against the northern root knot nematode (<em>Meloidogyne hapla</em>)</span></div><div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\"><span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span><span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">The benefit is temporary; populations rebound when susceptible crops return</span></div></div></div></div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Master Gardeners of Fresno and Contra Costa Counties; UC IPM Pest Notes: Nematodes, UC ANR Publication 7489.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["plants-repel-garden-pests-california-m2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">The Insectary Shortlist</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Flowers that feed the insects that hunt your pests</p>\n  </div>\n<div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 680px; background-color: #ffffff !important;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Plant</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Feeds</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Notes for the coast</th></tr></thead><tbody><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Sweet alyssum</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Hoverflies, parasitic wasps</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">The standard California insectary edging; blooms nearly year-round near the coast</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Cosmos, calendula, zinnias, sunflowers</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Lady beetles, hoverflies, and other open-bloom feeders</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Open landing-pad flowers; stagger shapes so something is always in bloom</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Borage, yarrow, phacelia</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Broad beneficial food; borage pulls bumblebees</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Bumblebee buzz pollination also improves fruit set</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Flowering herbs: dill, cilantro, parsley, chives, thyme, oregano, basil, arugula</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Parasitic wasps and other small-mouthed beneficials</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">The habit change is the point: let a portion of the herb bed bolt</td></tr></tbody></table></div><div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">Plant as generous patches and season-long edging near the vegetables, not as a defensive ring, and have blooms open before pest season peaks. Skip all spraying in the insectary strip, organic products included.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Master Gardeners of Marin, Contra Costa, and Fresno Counties.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["plants-repel-garden-pests-california-m3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n    <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Trap Crops That Earn Their Space</h2>\n    <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Run them like equipment, not decor</p>\n  </div>\n<div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 640px; background-color: #ffffff !important;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Trap plant</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Pulls</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Placement</th></tr></thead><tbody><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Nasturtium</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Squash bugs on zucchini; black aphids off beans and brassicas</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Spilling from the bed end, near the crop it protects</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Dill</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Tomato hornworms, where they are easy to spot and pick</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">By the tomatoes, never in the carrot bed (dill and carrots share pests)</td></tr><tr><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8; vertical-align: top; font-weight: 700;\">Ornamental tobacco (nicotiana)</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Aphids, mites, whiteflies</td><td style=\"padding: 10px 12px; font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important; border-bottom: 1px solid #dde2d8; vertical-align: top;\">Sticky-leaved collector near susceptible crops</td></tr></tbody></table></div><div style=\"background-color: #f8f9f0 !important; border-left: 5px solid #c9a84c; padding: 14px 18px; font-size: 0.82rem; line-height: 1.6; color: #1c3c2c !important;\"><strong style=\"color: #1a3b2a !important;\">Warning: </strong>The service rule: inspect twice a week, hand-crush or hose off what accumulates, and pull and bag any trap plant that has tipped from collector to breeder. An unserviced trap is a pest nursery.</div>\n  <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #657665 !important; text-align: center;\">Sources: UC Marin Master Gardeners; UC Master Gardener Program of Contra Costa County.</div>\n  <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

</script>
