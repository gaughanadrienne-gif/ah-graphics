<!-- Ambitious Harvest Co — Garden Events (Squarespace Code Block) -->
<!-- Data: https://gaughanadrienne-gif.github.io/ah-graphics/garden-events-data.json -->
<style>
.ge-wrap,.ge-wrap *{box-sizing:border-box}.ge-wrap{--forest:#1c3c2c;--leaf:#47734f;--cream:#f8f9f0;--sage:#dde2d8;--muted:#65756a;--white:#fff;color:var(--forest)!important;font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1050px;margin:0 auto;padding:22px 16px 48px}.ge-intro{color:#3a5446!important;line-height:1.55;margin:0 auto 18px;max-width:720px;text-align:center}.ge-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px}.ge-filter,.ge-more{appearance:none;background:var(--white);border:1px solid #c5ccc0;border-radius:999px;color:var(--forest)!important;cursor:pointer;font:600 .84rem/1.2 inherit;padding:8px 14px}.ge-filter:hover,.ge-more:hover{background:var(--cream)}.ge-filter.active{background:var(--forest)!important;border-color:var(--forest);color:#fff!important}.ge-list{display:grid;gap:13px}.ge-card{background:var(--white);border:1px solid var(--sage);border-radius:15px;box-shadow:0 2px 7px rgba(28,60,44,.06);display:grid;gap:17px;grid-template-columns:78px 1fr;padding:17px}.ge-date{color:var(--leaf)!important;text-align:center;text-transform:uppercase}.ge-date .ge-dow,.ge-date .ge-month{display:block;font-size:.69rem;font-weight:700;letter-spacing:.07em}.ge-date .ge-day{display:block;font-family:Georgia,serif;font-size:2rem;line-height:1.05;margin:2px 0}.ge-card h3{color:var(--forest)!important;font-size:1.12rem;line-height:1.25;margin:0 0 5px}.ge-meta,.ge-series,.ge-source{color:var(--muted)!important;font-size:.82rem;line-height:1.4}.ge-desc{color:#3a5446!important;font-size:.9rem;line-height:1.5;margin:8px 0 0}.ge-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.ge-tag{background:#edf3ed;border-radius:999px;color:var(--leaf)!important;font-size:.7rem;font-weight:600;padding:3px 8px;text-transform:capitalize}.ge-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}.ge-actions a,.ge-actions button{background:none;border:0;color:var(--leaf)!important;cursor:pointer;font:700 .82rem/1.3 inherit;padding:0;text-decoration:none}.ge-actions a:hover,.ge-actions button:hover{text-decoration:underline}.ge-status{background:var(--cream);border-radius:12px;color:var(--muted)!important;padding:18px;text-align:center}.ge-footer{color:var(--muted)!important;font-size:.75rem;line-height:1.5;margin-top:18px;text-align:center}.ge-more{display:block;margin:18px auto 0}.ge-hidden{display:none!important}@media(max-width:520px){.ge-wrap{padding-left:8px;padding-right:8px}.ge-card{gap:12px;grid-template-columns:58px 1fr;padding:14px}.ge-date .ge-day{font-size:1.65rem}.ge-card h3{font-size:1rem}}
</style>
<div class="ge-wrap" id="garden-events-tool">
  <p class="ge-intro">Plant sales, workshops, volunteer days, garden tours, farmers markets and seasonal farm experiences around Santa Cruz County.</p>
  <div class="ge-controls" aria-label="Filter garden events">
    <button class="ge-filter active" data-filter="all" aria-pressed="true">All upcoming</button>
    <button class="ge-filter" data-filter="learn" aria-pressed="false">Learn</button>
    <button class="ge-filter" data-filter="volunteer" aria-pressed="false">Volunteer</button>
    <button class="ge-filter" data-filter="market" aria-pressed="false">Markets</button>
    <button class="ge-filter" data-filter="swap" aria-pressed="false">Swaps & meetups</button>
    <button class="ge-filter" data-filter="outing" aria-pressed="false">Tours & U-pick</button>
  </div>
  <div class="ge-list" id="ge-list" aria-live="polite"><div class="ge-status">Loading upcoming events…</div></div>
  <button class="ge-more ge-hidden" id="ge-more">Show more events</button>
  <div class="ge-footer" id="ge-footer"></div>
</div>
<script>
(function(){
  var DATA_URL='https://gaughanadrienne-gif.github.io/ah-graphics/garden-events-data.json';
  var root=document.getElementById('garden-events-tool'),list=document.getElementById('ge-list'),more=document.getElementById('ge-more');
  var state={filter:'all',limit:12,events:[]};
  var labels={'plant-sale':'Plant sale','u-pick':'U-pick','meetup':'Meetup','community':'Community','compost':'Compost','experience':'Experience','market':'Market','learn':'Learn','volunteer':'Volunteer','tour':'Tour','swap':'Swap'};
  function esc(v){var d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML}
  function safeUrl(v){try{var u=new URL(v,location.href);return /^(https?:|mailto:)/.test(u.protocol)?u.href:'#'}catch(e){return '#'}}
  function includesFilter(e){var c=e.categories||[];if(state.filter==='all')return true;if(state.filter==='outing')return c.indexOf('tour')>-1||c.indexOf('u-pick')>-1||c.indexOf('experience')>-1;return c.indexOf(state.filter)>-1}
  function dateParts(e){var d=new Date(e.start),dow=d.toLocaleDateString('en-US',{weekday:'short',timeZone:'America/Los_Angeles'}),month=d.toLocaleDateString('en-US',{month:'short',timeZone:'America/Los_Angeles'}),day=d.toLocaleDateString('en-US',{day:'numeric',timeZone:'America/Los_Angeles'});return{d:d,dow:dow,month:month,day:day}}
  function timeLine(e){if(e.all_day)return e.recurrence||'Seasonal availability — confirm before visiting';var a=new Date(e.start),b=e.end?new Date(e.end):null,opt={hour:'numeric',minute:'2-digit',timeZone:'America/Los_Angeles'};return a.toLocaleTimeString('en-US',opt)+(b?'–'+b.toLocaleTimeString('en-US',opt):'')}
  function googleUrl(e){var start=new Date(e.start),end=new Date(e.end||e.start),stamp=function(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};var p=new URLSearchParams({action:'TEMPLATE',text:e.title||'',dates:stamp(start)+'/'+stamp(end),details:(e.description||'')+'\n\nSource: '+(e.source_url||''),location:[e.venue,e.address,e.city].filter(Boolean).join(', ')});return'https://calendar.google.com/calendar/render?'+p.toString()}
  function downloadIcs(e){var fmt=function(d){return new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')},clean=function(v){return String(v||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')};var body=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Ambitious Harvest//Garden Events//EN','BEGIN:VEVENT','UID:'+clean(e.id)+'@ambitiousharvest.com','DTSTAMP:'+fmt(new Date()),'DTSTART:'+fmt(e.start),'DTEND:'+fmt(e.end||e.start),'SUMMARY:'+clean(e.title),'DESCRIPTION:'+clean(e.description),'LOCATION:'+clean([e.venue,e.address,e.city].filter(Boolean).join(', ')),'URL:'+clean(e.source_url),'END:VEVENT','END:VCALENDAR'].join('\r\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/calendar'}));a.download=(e.title||'garden-event').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.ics';document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},0)}
  function card(e){var p=dateParts(e),tags=(e.categories||[]).slice(0,4).map(function(c){return'<span class="ge-tag">'+esc(labels[c]||c.replace(/-/g,' '))+'</span>'}).join('');var place=[e.venue,e.city].filter(Boolean).join(' · ');return'<article class="ge-card"><div class="ge-date"><span class="ge-dow">'+esc(p.dow)+'</span><span class="ge-day">'+esc(p.day)+'</span><span class="ge-month">'+esc(p.month)+'</span></div><div><h3>'+esc(e.title)+'</h3><div class="ge-meta">'+esc(timeLine(e))+(place?' · '+esc(place):'')+'</div>'+(e.recurrence?'<div class="ge-series">'+esc(e.recurrence)+'</div>':'')+(e.description?'<p class="ge-desc">'+esc(e.description)+'</p>':'')+'<div class="ge-tags">'+tags+'</div><div class="ge-actions"><a href="'+esc(safeUrl(e.source_url))+'" target="_blank" rel="noopener">Event details ↗</a>'+(e.registration_url?'<a href="'+esc(safeUrl(e.registration_url))+'">RSVP</a>':'')+'<a href="'+esc(googleUrl(e))+'" target="_blank" rel="noopener">Google Calendar</a><button type="button" data-ics="'+esc(e.id)+'">Download .ics</button></div><div class="ge-source">'+esc(e.organizer||'')+'</div></div></article>'}
  function render(){var now=new Date(),filtered=state.events.filter(function(e){return new Date(e.end||e.start)>=now&&e.status!=='cancelled'&&includesFilter(e)}),shown=filtered.slice(0,state.limit);list.innerHTML=shown.length?shown.map(card).join(''):'<div class="ge-status">No upcoming events match this filter.</div>';more.classList.toggle('ge-hidden',shown.length>=filtered.length);Array.prototype.forEach.call(list.querySelectorAll('[data-ics]'),function(b){b.addEventListener('click',function(){var id=b.getAttribute('data-ics'),event=state.events.find(function(e){return e.id===id});if(event)downloadIcs(event)})})}
  Array.prototype.forEach.call(root.querySelectorAll('.ge-filter'),function(b){b.addEventListener('click',function(){state.filter=b.getAttribute('data-filter');state.limit=12;Array.prototype.forEach.call(root.querySelectorAll('.ge-filter'),function(x){var on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-pressed',on)});render()})});more.addEventListener('click',function(){state.limit+=12;render()});
  fetch(DATA_URL,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('feed');return r.json()}).then(function(data){state.events=(data.events||[]).sort(function(a,b){return new Date(a.start)-new Date(b.start)});render();var updated=new Date(data.updated_at);document.getElementById('ge-footer').textContent='Events are gathered from official organizers and reviewed community sources. Details can change; confirm with the organizer before attending.'+(isNaN(updated)?'':' Last refreshed '+updated.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+'.')}).catch(function(){list.innerHTML='<div class="ge-status">The events calendar is being refreshed. Please check back shortly.</div>'})
})();
</script>
