window.AH_GRAPHICS = window.AH_GRAPHICS || {};

window.AH_GRAPHICS["beekeeping-in-california-for-beginners-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:22px;border-radius:12px;font-family:Montserrat,Arial,sans-serif;margin:24px 0\"><h3 style=\"color:#1a3b2a;margin-top:0\">A first year guided by the colony</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Before spring</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Find a mentor, confirm legal siting and registration, price equipment, and prepare before the bees arrive.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Spring</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Install with guidance and inspect regularly as the colony builds. Adjust the interval to conditions and swarm risk.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Summer</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Keep monitoring mites, brood, space and food. Flowers in the garden do not guarantee adequate nectar for the colony.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Fall and winter</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Assess stores and health, verify treatment results, and avoid unnecessary disturbance in poor weather. Take honey only when there is a real surplus.</p></div><p style=\"color:#1a3b2a;font-size:12px\">ambitiousharvest.com</p></section>";
window.AH_GRAPHICS["beekeeping-in-california-for-beginners-g2"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:22px;border-radius:12px;font-family:Montserrat,Arial,sans-serif;margin:24px 0\"><h3 style=\"color:#1a3b2a;margin-top:0\">Make mite monitoring part of ordinary care</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Learn the method</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Work with a mentor on a recognized sampling method. Protect the queen; some methods kill the sampled bees.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Record and interpret</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Write down the result, method, date and colony conditions. Do not use one threshold for every season and hive.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Treat within the label</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Use a product registered for the intended use in California. Follow temperature, honey-super and all other restrictions.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Check the result</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Sample again as the guidance and label direct. Mild winters do not guarantee either a broodless period or freedom from mites.</p></div><p style=\"color:#1a3b2a;font-size:12px\">ambitiousharvest.com</p></section>";
window.AH_GRAPHICS["beekeeping-laws-california-registration-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:22px;border-radius:12px;font-family:Montserrat,Arial,sans-serif;margin:24px 0\"><h3 style=\"color:#1a3b2a;margin-top:0\">Registration and permission are separate jobs</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Check the site first</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Confirm local zoning, placement, water and property restrictions before ordering bees.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Register through BeeWhere</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Record actual colony numbers and locations with the county agricultural commissioner. Registration includes a single hobby colony.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Plan for January 1</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">CDFA directs annual registration on January 1. An apiary acquired after that date must be registered within 30 days under FAC 29042. Movement updates also apply.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Confirm fees and notifications</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Check current fee instructions and any approved county waiver. January 31 fee payment is separate from registration timing. Location confidentiality has authorized exceptions; registration does not guarantee pesticide protection.</p></div><p style=\"color:#1a3b2a;font-size:12px\">ambitiousharvest.com</p></section>";
window.AH_GRAPHICS["beekeeping-laws-california-registration-g2"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:22px;border-radius:12px;font-family:Montserrat,Arial,sans-serif;margin:24px 0\"><h3 style=\"color:#1a3b2a;margin-top:0\">Read the rules for the actual parcel</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Unincorporated county</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Santa Cruz County 13.10.645 permits beekeeping on specified RA/PF and RR parcels of at least one-half acre, with 25-foot setbacks from property lines and streets. Agricultural districts have separate standards.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">City of Santa Cruz</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Section 24.12.650 requires permanent water and dispersal practices. Adjacent to a pedestrian right-of-way, use the 10-foot setback or qualifying 6-foot barrier. City apiary registration or permit is not required.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Shared and nonresidential sites</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">City rules add written consent, notice and other placement provisions for certain sites. Read the full section; the summary is not a complete site plan.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Other jurisdictions</h4><p style=\"color:#1a3b2a;line-height:1.6;margin:0\">Ask the relevant planning office. A Santa Cruz mailing address does not establish city jurisdiction, and neighboring counties have different rules.</p></div><p style=\"color:#1a3b2a;font-size:12px\">ambitiousharvest.com</p></section>";
window.AH_GRAPHICS["best-bee-friendly-plants-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>A California Bee Garden by Season</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Fill every season so bees never face a food gap</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.82rem; min-width:600px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Season</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Standout plants</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Native?</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Who it feeds</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Winter to early spring</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Manzanita, early ceanothus, willows, rosemary</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Mostly native</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Emerging bumble bee queens, early honey bees</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Spring</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Salvias, California lilac, poppies, lupines, phacelia, milkweed</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Native and garden</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Peak honey bee and native bee activity</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Summer (the dearth)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>California buckwheat, lavender, late salvias, sunflowers, borage</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Native and garden</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Honey bees and native bees through the driest weeks</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Fall</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Coyote brush, late buckwheat, goldenrod, California asters, toyon</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Mostly native</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Colonies building final winter stores, late native bees</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:12px 0 0; color:#8f4f45 !important;'>Two leanest windows to plan around first: winter (manzanita) and the summer dearth (buckwheat).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-bee-friendly-plants-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Designing a Garden That Actually Helps Bees</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Plant choice is only half of it</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:16px;'>\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 10px; color:#2e6b46 !important;'>Do</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Plant in clumps.</strong> Group at least 3 to 5 of the same plant so bees forage efficiently.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Choose single, open flowers.</strong> Simple blooms let bees reach the nectar and pollen.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Aim for continuous bloom.</strong> Keep something flowering in every season, especially winter and the summer dearth.</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Provide water.</strong> A shallow dish with pebbles gives bees a safe place to land and drink.</p>\n      </div>\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8f4f45; padding:16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 10px; color:#8f4f45 !important;'>Do not</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Scatter single plants.</strong> One flower here and there draws far fewer bees than a patch.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Rely on double-bred flowers.</strong> Many showy doubles hide or lack accessible nectar and pollen.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Spray blooming plants.</strong> Even organic products can kill bees; avoid systemic insecticides that move into nectar.</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Leave forage gaps.</strong> A big spring flush and nothing else leaves bees hungry the rest of the year.</p>\n      </div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["california-beekeeping-calendar-g1"] = "<section aria-label=\"A Year of Checks for a Central Coast Hive\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">A Year of Checks for a Central Coast Hive</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">January and February</h4><p style=\"color:#1a3b2a;margin:0\">Review stores without unnecessary cold-weather disturbance. Arrange feeding before a shortage becomes critical. Prepare equipment, mentoring, and annual registration.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">March and April</h4><p style=\"color:#1a3b2a;margin:0\">Follow brood, food, available space, and swarm preparations. New colonies and established colonies need different care. Keep mite monitoring in the routine.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">May and June</h4><p style=\"color:#1a3b2a;margin:0\">Watch actual incoming nectar and use of comb. Add space when needed. Assess colony reserves before considering a harvest.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">July and August</h4><p style=\"color:#1a3b2a;margin:0\">Watch for forage gaps, robbing, and water needs. Follow mite results and current guidance; use only appropriate registered products according to their labels.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">September through November</h4><p style=\"color:#1a3b2a;margin:0\">Check treatment results, food, queen status, and weather protection. Diagnose weak colonies before moving frames or combining colonies.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">December</h4><p style=\"color:#1a3b2a;margin:0\">Continue suitable food and condition checks. Review records and arrange support when needed; winter is not a reason to ignore a light hive.</p></div><p style=\"color:#1a3b2a\">Months organize reminders, not treatment or harvest appointments. Sources: UC Davis beekeeping timelines and USDA varroa-monitoring guidance.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["california-beekeeping-calendar-g2"] = "<section aria-label=\"Keep Bloom Notes Beside Your Hive Records\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Keep Bloom Notes Beside Your Hive Records</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Notice the flowering sequence</h4><p style=\"color:#1a3b2a;margin:0\">Manzanita can provide winter flowers; ceanothus, blackberry, sages, and buckwheats flower at different times by species and site.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Check whether food is arriving</h4><p style=\"color:#1a3b2a;margin:0\">Flowers nearby do not prove a nectar flow. Weather, colony strength, and access affect what bees can collect.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Follow stored food</h4><p style=\"color:#1a3b2a;margin:0\">Compare bloom observations with food reserves and the hive\u2019s weight trend. A dry spell or unsuitable flying weather can leave a colony using its stores.</p></div><p style=\"color:#1a3b2a\">Avoid a statewide bloom chart as a feeding decision. Sources: UC Sonoma manzanita guidance and UC Davis beekeeping timelines.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["california-beekeeping-calendar-g3"] = "<section aria-label=\"Adjust the Plan to the Colony and Site\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Adjust the Plan to the Colony and Site</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Coastal yards</h4><p style=\"color:#1a3b2a;margin:0\">Check shade, wind, drainage, and actual forage. A foggy location does not guarantee a mild food shortage or an easy winter.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Inland slopes and valleys</h4><p style=\"color:#1a3b2a;margin:0\">Monitor heat and cold-air pockets. Nearby apiaries can differ; do not shift every task by a fixed number of weeks.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Higher or exposed sites</h4><p style=\"color:#1a3b2a;margin:0\">Use local weather and experienced advice to plan inspections, reserves, and protection. Learn the condition of this hive rather than borrowing another apiary\u2019s winter allowance.</p></div><p style=\"color:#1a3b2a\">At every suitable inspection, record brood and strength, food and space, mite results, and the next action.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["cost-to-start-beekeeping-california-g1"] = "<section aria-label=\"An Illustrative One-Hive Budget: $1,100\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">An Illustrative One-Hive Budget: $1,100</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Housing and bees: $560</h4><p style=\"color:#1a3b2a;margin:0\">Hive, frames, and expansion allowance: $300. Nuc benchmark: $260, based on the dated supplier listing discussed in the article; availability requires confirmation.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Protection and basic tools: $225</h4><p style=\"color:#1a3b2a;margin:0\">Protective clothing allowance: $150. Basic tools and feeder allowance: $75. Check what a kit already includes.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Care and registration: $135</h4><p style=\"color:#1a3b2a;margin:0\">Feed allowance: $50. Mite monitoring and management allowance: $75. Registration allowance: $10 for the small-hobbyist example, subject to applicable fee or approved waiver.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Tax, travel, and contingency: $180</h4><p style=\"color:#1a3b2a;margin:0\">Replace this allowance with actual checkout and pickup costs. It is not a full replacement-colony reserve.</p></div><p style=\"color:#1a3b2a\">This is a hypothetical worksheet, not a California average or minimum. It excludes an extractor, paid classes, major site work, vaporizer, and replacement bees. Get current quotes before ordering.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["cost-to-start-beekeeping-california-g2"] = "<section aria-label=\"Price the Whole First Season\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Price the Whole First Season</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Before bees arrive</h4><p style=\"color:#1a3b2a;margin:0\">Complete compatible housing, bees, protective clothing, tools, feeder, water arrangements, and monitoring supplies. Confirm training and local siting requirements.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">After installation</h4><p style=\"color:#1a3b2a;margin:0\">Keep funds for feed, needed mite management, worn equipment, and replacement queens or bees. A fixed treatment budget does not determine treatment choice.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Harvest equipment can wait</h4><p style=\"color:#1a3b2a;margin:0\">First establish whether there is surplus honey. Ask about borrowing or renting equipment and confirm access and cleaning requirements before relying on it.</p></div><p style=\"color:#1a3b2a\">Begin a hobby budget with zero honey-sale income. Prices and kit contents vary; the article separates examples from supplier benchmarks.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["first-year-beekeeping-california-timeline-g1"] = "<section aria-label=\"Before the Bees Arrive\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Before the Bees Arrive</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Arrange teaching and supply</h4><p style=\"color:#1a3b2a;margin:0\">Find a class or mentor. Ask the supplier about colony type, queen status, frame compatibility, health information, and current pickup availability.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Check registration and siting</h4><p style=\"color:#1a3b2a;margin:0\">Plan annual registration for January 1 under current CDFA guidance. For a new acquisition, arrange registration with the county within the required 30-day period. State registration does not replace local siting rules.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Prepare the site and equipment</h4><p style=\"color:#1a3b2a;margin:0\">Have stable housing, water, protective clothing, tools, feeding and monitoring supplies ready. Keep flight paths away from busy human areas and leave safe inspection access.</p></div><p style=\"color:#1a3b2a\">Source: current CDFA guidance and UC California Master Beekeeper Program. Do not assume a universal supplier sellout date or fee waiver.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["first-year-beekeeping-california-timeline-g2"] = "<section aria-label=\"Your First Year: Follow the Colony\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Your First Year: Follow the Colony</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Installation</h4><p style=\"color:#1a3b2a;margin:0\">Use supplier instructions and local conditions. Packages and nucs have different starting resources and queen-management needs.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Buildup</h4><p style=\"color:#1a3b2a;margin:0\">Assess feed, comb, food, and usable space. Keep syrup-fed stores out of honey for harvest. Begin consistent mite monitoring rather than waiting until late summer.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Summer</h4><p style=\"color:#1a3b2a;margin:0\">Watch forage, water, robbing, queen status, and mites. Harvest only a demonstrated surplus that the colony can spare.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Fall and winter</h4><p style=\"color:#1a3b2a;margin:0\">Check mite-control results and food needs before trouble becomes urgent. Diagnose weak colonies before combining them. Arrange feeding when needed.</p></div><p style=\"color:#1a3b2a\">No fixed mite threshold, honey-weight allowance, or treatment date applies to every California hive. Follow current regional guidance and the exact registered product label.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["harvesting-honey-first-time-g1"] = "<section aria-label=\"Before Taking a Honey Frame\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Before Taking a Honey Frame</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Can the colony spare it?</h4><p style=\"color:#1a3b2a;margin:0\">Assess the colony\u2019s coming food needs with experienced local help. A capped super alone is not proof of surplus.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Is the honey suitable?</h4><p style=\"color:#1a3b2a;margin:0\">Check treatment history, clean handling, and moisture with a calibrated honey refractometer. Cappings are a clue, not a moisture certificate.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Is the work area ready?</h4><p style=\"color:#1a3b2a;margin:0\">Use clean, dry food-contact equipment and a space protected from bees, debris, fuels, pesticides, and animals.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">If a check is uncertain</h4><p style=\"color:#1a3b2a;margin:0\">Leave the harvest for another day and get help. A first-year colony may need all its stores.</p></div><p style=\"color:#1a3b2a\">A conservative home-bottling target below 18% moisture reduces fermentation risk; it does not sterilize honey. Never give honey to infants under one year old.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["harvesting-honey-first-time-g2"] = "<section aria-label=\"Decide What to Leave Before You Harvest\" style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;margin-top:0\">Decide What to Leave Before You Harvest</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Assess this colony</h4><p style=\"color:#1a3b2a;margin:0\">Colony size, brood rearing, equipment, local forage, and flying weather change food requirements. There is no single statewide winter reserve.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Learn what hive weight means</h4><p style=\"color:#1a3b2a;margin:0\">Wood, comb, bees, and food all contribute. Use experienced help and actual frames to assess reserves; hefting is useful for following a learned weight trend.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:16px;margin:12px 0;border-radius:8px\"><h4 style=\"color:#1a3b2a;margin:0 0 8px\">Keep checking after harvest</h4><p style=\"color:#1a3b2a;margin:0\">Monitor stores through forage gaps and winter. Plan suitable feeding before reserves become critically low. Mild weather does not guarantee enough incoming food.</p></div><p style=\"color:#1a3b2a\">Take only a surplus you can justify. Source: UC Davis backyard-beekeeping timeline; the article explains food assessment and clean harvest handling.</p><p style=\"color:#1a3b2a;font-size:0.85rem\">Ambitious Harvest \u00b7 Santa Cruz County</p></section>";
window.AH_GRAPHICS["how-to-get-your-first-bees-california-g1"] = "<section aria-label=\"Choose bees with a support plan\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Choose bees with a support plan</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Package</h4><p style=\"color:#1a3b2a!important;margin:0\">Loose bees arrive with a caged queen. They must establish comb and a working colony. Confirm installation help and queen-introduction instructions before collection.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Nucleus colony</h4><p style=\"color:#1a3b2a!important;margin:0\">A nuc includes occupied comb, brood, food stores and a queen. Confirm frame size, queen status, health records and compatibility with your hive.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Swarm</h4><p style=\"color:#1a3b2a!important;margin:0\">Its history and temperament are unknown. Arrange help from an experienced local beekeeper; a free swarm is not automatically a suitable first colony.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Ask each seller about recent mite counts, treatments, pickup arrangements and follow-up support. Purchased bees still need monitoring.</p></section>";
window.AH_GRAPHICS["how-to-get-your-first-bees-california-g2"] = "<section aria-label=\"Plan around readiness, not a fixed month\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Plan around readiness, not a fixed month</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Before ordering</h4><p style=\"color:#1a3b2a!important;margin:0\">Confirm local permission, a suitable hive site, equipment compatibility and a mentor. Ask suppliers about their current availability and total cost.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Before pickup</h4><p style=\"color:#1a3b2a!important;margin:0\">Prepare the hive, water and protective equipment. Agree on transport and installation arrangements with the supplier.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">After arrival</h4><p style=\"color:#1a3b2a!important;margin:0\">Check establishment with your mentor, monitor colony health and complete California registration requirements. Newly acquired apiaries must be registered within 30 days.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Weather, forage, colony development and supplier schedules vary across California. A calendar date alone cannot tell you when a colony is ready.</p></section>";
window.AH_GRAPHICS["langstroth-vs-top-bar-vs-flow-hive-g1"] = "<section aria-label=\"Three hive designs, three handling routines\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Three hive designs, three handling routines</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Langstroth</h4><p style=\"color:#1a3b2a!important;margin:0\">Removable frames in stacked boxes. Check box width and frame depth before buying parts. Full boxes can be heavy; plan how you will inspect and lift them.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Top-bar</h4><p style=\"color:#1a3b2a!important;margin:0\">A horizontal arrangement lets you inspect individual combs without routinely lifting stacked honey boxes. Unsupported comb needs careful handling, especially in warm weather.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Flow</h4><p style=\"color:#1a3b2a!important;margin:0\">A honey-harvesting system used above a brood nest. The harvesting mechanism does not replace opening the hive to inspect brood, bees and harvest readiness.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Choose equipment you can inspect safely and that a local mentor can help you manage. No design removes mite monitoring or guarantees a honey crop.</p></section>";
window.AH_GRAPHICS["langstroth-vs-top-bar-vs-flow-hive-g2"] = "<section aria-label=\"Try the work before buying the hive\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Try the work before buying the hive</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Handle real equipment</h4><p style=\"color:#1a3b2a!important;margin:0\">Lift a representative box or frame with a mentor. Consider reach, grip, weight and the route between the hive and your work area.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Check the complete system</h4><p style=\"color:#1a3b2a!important;margin:0\">Confirm frame dimensions, replacement parts, harvesting equipment and the exact model specifications. Similar-looking components may not fit.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Match the learning support</h4><p style=\"color:#1a3b2a!important;margin:0\">Find someone who works with your chosen design. Ask how they inspect brood, monitor mites, manage comb and harvest surplus honey.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Compare current complete-kit costs rather than a single advertised hive price. Protective gear, bees and ongoing care remain part of the budget.</p></section>";
window.AH_GRAPHICS["supporting-native-bees-california-garden-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>California Native Bee ID Card</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>The gentle, garden-friendly natives worth supporting.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>&nbsp;</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Mason bees<br><span style='font-weight:400; font-size:0.8rem; color:#d2a097 !important;'>Osmia species</span></th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Leafcutter bees<br><span style='font-weight:400; font-size:0.8rem; color:#d2a097 !important;'>Megachile species</span></th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Bumble bees</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Season</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Spring-active. Emerge as early as the first warm spells of late winter.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Summer counterparts of the mason bee.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Active across the warm season.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Nesting style</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Existing tubular cavities; build mud walls between egg chambers. Readily use bee houses.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Pre-made cavities; partition chambers with neatly cut leaf pieces. Also use bee houses.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Nest in the ground or in cavities. Supported through flowers and undisturbed habitat, not houses.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>What they pollinate</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Superb early-season pollinators of fruit trees and spring blooms.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Summer vegetables and flowers.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Important buzz-pollinators for tomatoes and other crops.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>California has about 1,600 native bee species. Nearly all are gentle and unlikely to sting, and most are solitary. The semicircular notches leafcutters cut from rose or redbud leaves are cosmetic, not harmful.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["supporting-native-bees-california-garden-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Native Bee Habitat Checklist</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Five changes that help every native bee, with zero risk.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Plant season-long flowers</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>The single highest-impact change. Native bees need nectar and pollen from late winter through fall, so aim for something always in bloom, especially California natives.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Leave bare ground for ground-nesters</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Roughly 70 percent of native bees nest in the ground. Leave some bare, undisturbed, un-mulched soil in a sunny spot. Heavy mulch, landscape fabric, and constant tilling remove this habitat.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Leave standing stems over winter</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Pithy and hollow stems from elderberry, sunflower, and many perennials become nesting cavities for stem-nesting bees. Resist cutting everything back in fall.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Provide a shallow water source</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>A shallow dish with landing spots like pebbles gives bees a safe place to drink.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; padding:1rem 1.25rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#8f4f45; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#8f4f45 !important;'>Minimize pesticides (most important)</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Avoiding insecticides that kill the bees you are trying to help is the foundation of native bee conservation, per the Xerces Society.</p>\n      </div>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["urban-small-space-beekeeping-california-g1"] = "<section aria-label=\"Plan the site before bringing bees home\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Plan the site before bringing bees home</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Confirm the address rules</h4><p style=\"color:#1a3b2a!important;margin:0\">City, county, property-owner and association requirements can differ. California apiary registration is separate from permission to keep bees at a particular site.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Keep everyday routes clear</h4><p style=\"color:#1a3b2a!important;margin:0\">Consider entrances, paths, neighboring spaces and inspection access. In the City of Santa Cruz, the ordinance requires placement that encourages bees to disperse before encountering people.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Provide dependable water</h4><p style=\"color:#1a3b2a!important;margin:0\">The City of Santa Cruz requires a constant, permanent water source on site. Maintain it; a water dish cannot guarantee bees will never visit another property.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Conceptual planning checklist, not an approved layout. The City of Santa Cruz has a specific pedestrian-right-of-way setback-or-barrier rule, plus other site requirements. Read section 24.12.650 for the applicable conditions.</p></section>";
window.AH_GRAPHICS["urban-small-space-beekeeping-california-g2"] = "<section aria-label=\"Small-space beekeeping is ongoing care\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Small-space beekeeping is ongoing care</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Make contact easy</h4><p style=\"color:#1a3b2a!important;margin:0\">Follow required consent and notice procedures. Give neighbors a way to reach you and respond promptly to concerns.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Get help with behavior changes</h4><p style=\"color:#1a3b2a!important;margin:0\">Review unusual defensiveness or swarm concerns with an experienced beekeeper. Barriers and hive orientation do not make stings impossible.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Keep access practical</h4><p style=\"color:#1a3b2a!important;margin:0\">Leave room to open and inspect the hive. Rooftops need permission, suitable access and qualified assessment of structural loading.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">One or two colonies may be a manageable starting scale, but that is practical guidance, not a Santa Cruz legal hive limit. Check the rules for your exact property.</p></section>";
window.AH_GRAPHICS["varroa-mites-bee-problems-beginners-g1"] = "<section aria-label=\"Build mite checks into colony care\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Build mite checks into colony care</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Measure</h4><p style=\"color:#1a3b2a!important;margin:0\">Learn a reliable sampling method and protect the queen from the sample. Record the sample size, mite count and date.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Interpret</h4><p style=\"color:#1a3b2a!important;margin:0\">Review results in the context of brood, season and local advice. A busy entrance or normal-looking bees cannot rule out a damaging mite population.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Act and check again</h4><p style=\"color:#1a3b2a!important;margin:0\">Use an appropriate management plan, then sample again to assess the result. Keep monitoring through the season rather than waiting for visible decline.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Monitoring is useful before problems become obvious. Treatment decisions and follow-up timing should reflect the colony and current guidance, not a single calendar deadline.</p></section>";
window.AH_GRAPHICS["varroa-mites-bee-problems-beginners-g2"] = "<section aria-label=\"Before using a Varroa treatment\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"color:#1a3b2a!important;font-family:Fraunces,serif;margin-top:0\">Before using a Varroa treatment</h3><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px\"><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Exact product</h4><p style=\"color:#1a3b2a!important;margin:0\">Confirm current California registration for the actual formulation and use. An ingredient name or an out-of-state guide is not enough.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Label conditions</h4><p style=\"color:#1a3b2a!important;margin:0\">Read colony-size, brood, temperature, application, protective-equipment and ventilation requirements. Check the full treatment period.</p></div><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><h4 style=\"color:#1a3b2a!important;margin:0 0 8px\">Honey and follow-up</h4><p style=\"color:#1a3b2a!important;margin:0\">Check the exact rules for honey supers, harvest and removal of treatment materials. Record use and measure mite levels afterward.</p></div></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">This is a label-reading checklist, not a pesticide prescription. Do not substitute household chemicals, invent a dose or assume that naturally derived ingredients are harmless.</p></section>";
