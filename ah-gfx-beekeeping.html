window.AH_GRAPHICS = window.AH_GRAPHICS || {};

window.AH_GRAPHICS["beekeeping-in-california-for-beginners-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>California Beekeeping Year at a Glance</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Central Coast rhythm for a single hobby hive</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:12px;'>\n      <div style='flex:1 1 220px; background:#dde2d8; border-left:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 6px; color:#1a3b2a !important;'>Winter (Dec to Feb)</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Plan and order bees in January or February. Colony is quiet; check food on warm days. Buildup can begin by late February.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#dde2d8; border-left:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 6px; color:#1a3b2a !important;'>Spring (Mar to May)</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Install package or nuc. Colony draws comb and grows. Inspect every 7 to 10 days for swarm cells. Busiest season.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#dde2d8; border-left:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 6px; color:#1a3b2a !important;'>Summer (Jun to Aug)</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Maintenance mode. Watch food stores through the mid to late summer dearth. Inspect every 10 to 14 days.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#dde2d8; border-left:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 6px; color:#1a3b2a !important;'>Fall (Sep to Nov)</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Assess surplus honey. Send the colony into winter well fed and low on mites. Little or no first-year harvest.</p>\n      </div>\n    </div>\n    <div style='margin-top:16px; background:#8f4f45; padding:12px 16px;'>\n      <p style='font-size:0.85rem; margin:0; color:#f8f9f0 !important;'><strong>Mite monitoring:</strong> Sample about 300 bees several times across the active season (spring, mid-summer, and again in fall). California colonies never get a broodless winter break, so mite pressure stays high all year.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["beekeeping-in-california-for-beginners-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Varroa Mite Monitoring Made Simple</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>The one skill that keeps a colony alive</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:16px;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 10px; color:#2e6b46 !important;'>Two ways to sample</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Alcohol wash:</strong> scoop about 300 bees (a half cup) from a brood frame into alcohol, shake, and count the mites that drop. Most accurate, but the sampled bees die.</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Sugar roll:</strong> same 300 bees, roll in powdered sugar, shake mites out over water. Gentler and the bees survive, slightly less exact.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#8f4f45; padding:16px; text-align:center; display:flex; flex-direction:column; justify-content:center;'>\n        <p style='font-size:0.8rem; margin:0 0 4px; color:#f8f9f0 !important;'>ACTION THRESHOLD</p>\n        <p style='font-family:Fraunces,serif; font-size:2.2rem; margin:0; line-height:1; color:#f8f9f0 !important;'>9+</p>\n        <p style='font-size:0.85rem; margin:6px 0 0; color:#f8f9f0 !important;'>mites per 300 bees means it is time to treat</p>\n      </div>\n    </div>\n    <div style='margin-top:16px; background:#dde2d8; padding:14px 16px;'>\n      <p style='font-size:0.9rem; margin:0 0 6px; font-family:Fraunces,serif; color:#1a3b2a !important;'>When to check across the season</p>\n      <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Sample several times a year: spring, mid-summer, and fall. If you cross the threshold, treat with an approved miticide such as a thymol, formic acid, or oxalic acid product. In California, colonies never get a broodless winter, so mite pressure never fully lets up.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["beekeeping-laws-california-registration-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>How to Register Your California Apiary</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Required for every owner, even a single backyard hive</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:12px;'>\n      <div style='flex:1 1 190px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.4rem; margin:0 0 4px; color:#8f4f45 !important;'>1</p>\n        <p style='font-family:Fraunces,serif; font-size:0.95rem; margin:0 0 4px; color:#1a3b2a !important;'>Acquire your bees</p>\n        <p style='font-size:0.82rem; margin:0; color:#1a3b2a !important;'>Register as soon as a colony is on your property. Do not wait for the next January if you get bees mid-year.</p>\n      </div>\n      <div style='flex:1 1 190px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.4rem; margin:0 0 4px; color:#8f4f45 !important;'>2</p>\n        <p style='font-family:Fraunces,serif; font-size:0.95rem; margin:0 0 4px; color:#1a3b2a !important;'>Sign up on BeeWhere</p>\n        <p style='font-size:0.82rem; margin:0; color:#1a3b2a !important;'>Enter your hive locations and colony count at beewhere.calagpermits.org, the statewide system.</p>\n      </div>\n      <div style='flex:1 1 190px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.4rem; margin:0 0 4px; color:#8f4f45 !important;'>3</p>\n        <p style='font-family:Fraunces,serif; font-size:0.95rem; margin:0 0 4px; color:#1a3b2a !important;'>Route to your county</p>\n        <p style='font-size:0.82rem; margin:0; color:#1a3b2a !important;'>Your information goes to the county agricultural commissioner. The fee is $10 for 1 to 9 colonies, often waived for hobbyists.</p>\n      </div>\n      <div style='flex:1 1 190px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.4rem; margin:0 0 4px; color:#8f4f45 !important;'>4</p>\n        <p style='font-family:Fraunces,serif; font-size:0.95rem; margin:0 0 4px; color:#1a3b2a !important;'>Confirm and stay protected</p>\n        <p style='font-size:0.82rem; margin:0; color:#1a3b2a !important;'>Your location stays confidential, shared only with pesticide applicators so they avoid spraying near your bees.</p>\n      </div>\n    </div>\n    <div style='margin-top:16px; background:#c9a84c; padding:12px 16px;'>\n      <p style='font-size:0.88rem; margin:0; color:#1a3b2a !important;'><strong>Deadline:</strong> Registration is due by January 1 each year and renews annually. Anyone who owns an apiary on that date must register.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["beekeeping-laws-california-registration-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>California Beehive Setback Rules Compared</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Local rules vary widely. Always confirm current text with your jurisdiction.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.82rem; min-width:640px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Jurisdiction</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Lot-size minimum</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Property-line setback</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Hive limit</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Flyway barrier</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Unincorporated Santa Cruz County</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>1/2 acre or larger</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>25 ft from all property lines and streets</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Not specified in draft</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Not specified in draft</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>City of Santa Cruz</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Single-family lots allowed</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Set back from pedestrian rights-of-way</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>No cap (2020 code)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>6 ft barrier or 10 ft setback (one option)</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Sacramento County</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>5,000 sq ft minimum</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>6 ft barrier from interior lines</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>2 on small lots up to 6 on larger</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>6 ft between hives and lines</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Los Angeles County</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>No countywide numeric rule</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>No countywide numeric setback</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>No countywide numeric limit</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Structure to push bees above eye level; water source</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.72rem; margin:12px 0 0; color:#8f4f45 !important;'>Sources: Santa Cruz County animal regulations (public hearing draft), City of Santa Cruz municipal code, Sacramento County code, Los Angeles County guidance. Verify current figures before placing hives.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-bee-friendly-plants-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>A California Bee Garden by Season</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Fill every season so bees never face a food gap</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.82rem; min-width:600px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Season</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Standout plants</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Native?</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Who it feeds</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Winter to early spring</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Manzanita, early ceanothus, willows, rosemary</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Mostly native</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Emerging bumble bee queens, early honey bees</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Spring</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Salvias, California lilac, poppies, lupines, phacelia, milkweed</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Native and garden</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Peak honey bee and native bee activity</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Summer (the dearth)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>California buckwheat, lavender, late salvias, sunflowers, borage</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Native and garden</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Honey bees and native bees through the driest weeks</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Fall</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Coyote brush, late buckwheat, goldenrod, California asters, toyon</td>\n            <td style='padding:10px 12px; color:#2e6b46 !important;'>Mostly native</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Colonies building final winter stores, late native bees</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:12px 0 0; color:#8f4f45 !important;'>Two leanest windows to plan around first: winter (manzanita) and the summer dearth (buckwheat).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-bee-friendly-plants-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Designing a Garden That Actually Helps Bees</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Plant choice is only half of it</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:16px;'>\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 10px; color:#2e6b46 !important;'>Do</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Plant in clumps.</strong> Group at least 3 to 5 of the same plant so bees forage efficiently.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Choose single, open flowers.</strong> Simple blooms let bees reach the nectar and pollen.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Aim for continuous bloom.</strong> Keep something flowering in every season, especially winter and the summer dearth.</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Provide water.</strong> A shallow dish with pebbles gives bees a safe place to land and drink.</p>\n      </div>\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8f4f45; padding:16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 10px; color:#8f4f45 !important;'>Do not</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Scatter single plants.</strong> One flower here and there draws far fewer bees than a patch.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Rely on double-bred flowers.</strong> Many showy doubles hide or lack accessible nectar and pollen.</p>\n        <p style='font-size:0.85rem; margin:0 0 8px; color:#1a3b2a !important;'><strong>Spray blooming plants.</strong> Even organic products can kill bees; avoid systemic insecticides that move into nectar.</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Leave forage gaps.</strong> A big spring flush and nothing else leaves bees hungry the rest of the year.</p>\n      </div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["california-beekeeping-calendar-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The California Beekeeping Year, Month by Month</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Central Coast timing. Shift earlier inland, later in coastal fog.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.82rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:9px 12px; color:#f8f9f0 !important;'>Month</th>\n            <th style='text-align:left; padding:9px 12px; color:#f8f9f0 !important;'>Phase</th>\n            <th style='text-align:left; padding:9px 12px; color:#f8f9f0 !important;'>Main task</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>January</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Early buildup</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Heft for food, reserve replacement bees, quick warm-day check</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>February</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Buildup</td><td style='padding:8px 12px; color:#1a3b2a !important;'>First real inspection, confirm queen, plan mite management</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>March</td><td style='padding:8px 12px; color:#8f4f45 !important;'>Swarm season</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Inspect weekly for queen cells, add space, install new bees</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>April</td><td style='padding:8px 12px; color:#8f4f45 !important;'>Swarm peak</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Add supers, split if needed, spring mite check</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>May</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Nectar flow</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Supering season, give space, peak population</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>June</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Flow winds down</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Keep space ahead of bees, plan harvest timing</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>July</td><td style='padding:8px 12px; color:#c9a84c !important;'>Dearth begins</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Harvest capped honey, mite count, reduce entrances, add water</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>August</td><td style='padding:8px 12px; color:#962d28 !important;'>Critical mite month</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Alcohol wash and treat to protect winter bees</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>September</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Fall prep</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Follow-up mite count, assess stores, combine weak colonies</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>Oct to Nov</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Winterize</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Ensure 30 to 50 lb stores, optional oxalic acid, good ventilation</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:8px 12px; color:#1a3b2a !important; font-weight:600;'>December</td><td style='padding:8px 12px; color:#2e6b46 !important;'>Quiet month</td><td style='padding:8px 12px; color:#1a3b2a !important;'>Leave bees alone, heft hives, order bees and supplies</td></tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";

yle='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td>\n          </tr>\n          <tr>\n            <td style='padding:5px 8px; color:#1a3b2a !important; font-weight:600; background:#dde2d8;'>Sage</td>\n            <td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#2e6b46; border:1px solid #f8f9f0;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td>\n          </tr>\n          <tr>\n            <td style='padding:5px 8px; color:#1a3b2a !important; font-weight:600; background:#dde2d8;'>Buckwheat</td>\n            <td style='background:#ffffff; border:1px solid #dde2d8;'>&nbsp;</td><td style='background
