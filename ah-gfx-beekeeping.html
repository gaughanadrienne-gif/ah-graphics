window.AH_GRAPHICS["california-beekeeping-calendar-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Adjusting the Calendar for Your Microclimate</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>The base calendar is written for the Central Coast</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.8rem; min-width:620px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Timing shift</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Warm inland valleys</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Cool coastal fog</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Higher elevations</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Buildup</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Earlier, Dec to Jan</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>2 to 4 weeks later</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Later start, true winter cluster</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Swarm season</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Can start February</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Lags 2 to 4 weeks</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Shorter, later</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Nectar flow</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Arrives and finishes weeks ahead</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Longer, cooler bloom</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Shorter season overall</td>\n          </tr>\n          <tr style='background:#dde2d8;'>\n            <td style='padding:10px 12px; color:#1a3b2a !important; font-weight:600;'>Summer dearth</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Harder and hotter</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Milder in fog-influenced spots</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Behaves like a cold climate</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; color:#8f4f45 !important; font-weight:600;'>Watch most</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Water, robbing control, heat-safe mite treatments</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Ventilation and dry conditions (nosema, mold)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Higher end of winter store recommendations</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:12px 0 0; color:#8f4f45 !important;'>Phenology beats the calendar date. When your local manzanita and ceanothus flower, buildup is on. When blackberries bloom, the flow is coming.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["cost-to-start-beekeeping-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>First-Year Beekeeping Cost Breakdown</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>One hive in California</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.25rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.85rem; min-width:420px;'>\n        <thead>\n          <tr style='background:#2e6b46;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important;'>Line item</th>\n            <th style='text-align:right; padding:10px 12px; color:#f8f9f0 !important;'>Low end</th>\n            <th style='text-align:right; padding:10px 12px; color:#f8f9f0 !important;'>High end</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'><td style='padding:9px 12px; color:#1a3b2a !important; font-weight:600;'>Langstroth hive kit</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$150</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$300</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:9px 12px; color:#1a3b2a !important; font-weight:600;'>Bees (package or nuc)</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$130</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$325</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:9px 12px; color:#1a3b2a !important; font-weight:600;'>Protective gear and tools</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$100</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$200</td></tr>\n          <tr style='background:#dde2d8;'><td style='padding:9px 12px; color:#1a3b2a !important; font-weight:600;'>Apiary registration</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$0 (waived)</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$10</td></tr>\n          <tr style='background:#ffffff;'><td style='padding:9px 12px; color:#1a3b2a !important; font-weight:600;'>First mite treatment</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$5</td><td style='padding:9px 12px; text-align:right; color:#1a3b2a !important;'>$20</td></tr>\n        </tbody>\n        <tfoot>\n          <tr style='background:#8f4f45;'>\n            <td style='padding:12px; color:#f8f9f0 !important; font-family:Fraunces,serif; font-size:1rem;'>Realistic total</td>\n            <td style='padding:12px; text-align:right; color:#f8f9f0 !important; font-family:Fraunces,serif; font-size:1.15rem;'>~$400</td>\n            <td style='padding:12px; text-align:right; color:#f8f9f0 !important; font-family:Fraunces,serif; font-size:1.15rem;'>~$800</td>\n          </tr>\n        </tfoot>\n      </table>\n    </div>\n    <p style='font-size:0.75rem; margin:12px 0 0; color:#8f4f45 !important;'>A premium hive, a nuc over a package, or buying your own extractor pushes the total higher. UC ANR publishes no official figure; ranges come from California suppliers.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["cost-to-start-beekeeping-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Beekeeping Starter Kit Checklist</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>What a first-year California beekeeper needs</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:14px;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 8px; color:#2e6b46 !important;'>The hive &nbsp;<span style='font-size:0.8rem; color:#8f4f45 !important;'>$150 to $300</span></p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>&#10003; Complete Langstroth kit: boxes, frames, bottom board, lid</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 8px; color:#2e6b46 !important;'>The bees &nbsp;<span style='font-size:0.8rem; color:#8f4f45 !important;'>$130 to $325</span></p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>&#10003; A package (loose bees + caged queen) or a 5-frame nuc. Order in January or February.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 8px; color:#2e6b46 !important;'>Protective gear &nbsp;<span style='font-size:0.8rem; color:#8f4f45 !important;'>$100 to $200</span></p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>&#10003; Full suit or jacket-and-veil &nbsp; &#10003; Gloves</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:14px 16px;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 8px; color:#2e6b46 !important;'>Hand tools &nbsp;<span style='font-size:0.8rem; color:#8f4f45 !important;'>$10 to $45 each</span></p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>&#10003; Smoker &nbsp; &#10003; Hive tool &nbsp; &#10003; Bee brush &nbsp; &#10003; Feeder</p>\n      </div>\n    </div>\n    <div style='margin-top:16px; background:#c9a84c; padding:12px 16px;'>\n      <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'><strong>Can wait until year two:</strong> a honey extractor ($179 to $330+). First-year colonies usually keep their honey to survive winter, and local guilds often lend an extractor to members.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["first-year-beekeeping-california-timeline-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Before Your Bees Arrive: A Pre-Arrival Checklist</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>The work starts weeks before a single bee shows up</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:14px 18px; margin-bottom:12px; border-left:5px solid #8f4f45;'>\n      <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>&#10003; Order your bees early</p>\n      <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Packages and nucs sell out by January or February in California. Reserve in late fall or early winter for a spring pickup.</p>\n    </div>\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:14px 18px; margin-bottom:12px; border-left:5px solid #8f4f45;'>\n      <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>&#10003; Register your hives</p>\n      <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>State law (FAC 29040) requires it, no matter how many hives. Register through BeeWhere with the county agricultural commissioner. It costs little to nothing and renews annually.</p>\n    </div>\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:14px 18px; border-left:5px solid #8f4f45;'>\n      <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>&#10003; Set up your site and equipment</p>\n      <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Assemble and paint boxes, build frames. Choose a location with morning sun, afternoon shade inland, a nearby water source, and a flight path aimed away from neighbors. In foggy coastal spots, morning sun helps bees warm up and forage earlier.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["first-year-beekeeping-california-timeline-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Your First Year, Season by Season</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#d2a097 !important;'>Central Coast California. The goal is a strong, low-mite colony, not a honey harvest.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='border-left:3px solid #2e6b46; padding-left:18px;'>\n      <div style='position:relative; margin-bottom:18px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 3px; color:#8f4f45 !important;'>Early spring (Mar to Apr) &middot; Install</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Install your package or nuc as weather settles and first nectar arrives. Feed 1:1 sugar syrup to fuel comb building. Confirm the queen is released and laying, then leave them to settle.</p>\n      </div>\n      <div style='position:relative; margin-bottom:18px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 3px; color:#8f4f45 !important;'>Late spring to early summer &middot; Buildup and nectar flow</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>The main event. Add space ahead of the bees, watch the queen's laying, provide water. Stop feeding before adding any honey supers. Start varroa monitoring.</p>\n      </div>\n      <div style='position:relative; margin-bottom:18px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 3px; color:#c9a84c !important;'>Mid to late summer &middot; The dearth</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>The landscape browns out and forage gets scarce. Robbing between colonies rises and mite pressure climbs. Most first-year colonies produce no surplus worth harvesting, so the safe default is to leave the honey.</p>\n      </div>\n      <div style='position:relative; margin-bottom:18px;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 3px; color:#962d28 !important;'>Aug to Sep &middot; Mite treatment (year is won or lost)</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Do an alcohol wash on about 300 bees. Threshold drops to roughly 1 to 2 mites per 100 heading into fall. Treat if over threshold, supers off first. Skipping this is the number one reason first-year colonies fail.</p>\n      </div>\n      <div style='position:relative;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 3px; color:#2e6b46 !important;'>Fall to winter &middot; Prep and overwinter</p>\n        <p style='font-size:0.85rem; margin:0; color:#1a3b2a !important;'>Confirm mites are controlled, leave roughly 30 to 50 lb of honey, reduce the entrance, stop deep inspections. A healthy coastal colony usually needs no winter feeding. Surviving that first winter is the real win.</p>\n      </div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["harvesting-honey-first-time-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Should You Harvest Honey Your First Year?</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Work down the checks. Any &quot;no&quot; means leave the honey.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem; margin:0 0 1rem;'>\n      <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#8a9a8f !important;'>Check 1</p>\n      <p style='margin:0; font-size:1.05rem; font-weight:600; color:#1a3b2a !important;'>Is the honey capped and cured?</p>\n      <p style='margin:6px 0 0; font-size:0.9rem; color:#3a4a40 !important;'>Frames should be at least about 80 percent capped (cured below roughly 18.6 percent moisture). Uncapped nectar will ferment in the jar.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem; margin:0 0 1rem;'>\n      <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#8a9a8f !important;'>Check 2</p>\n      <p style='margin:0; font-size:1.05rem; font-weight:600; color:#1a3b2a !important;'>Are winter stores already covered?</p>\n      <p style='margin:6px 0 0; font-size:0.9rem; color:#3a4a40 !important;'>A mild California colony needs roughly 30 to 50 pounds of stored honey to overwinter. The colony&#39;s own stores come first, always.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem; margin:0 0 1.25rem;'>\n      <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#8a9a8f !important;'>Check 3</p>\n      <p style='margin:0; font-size:1.05rem; font-weight:600; color:#1a3b2a !important;'>Is the colony strong, with surplus in a dedicated super?</p>\n      <p style='margin:6px 0 0; font-size:0.9rem; color:#3a4a40 !important;'>Only an unusually strong first-year colony that has filled a separate honey super above and beyond its winter stores has a true surplus.</p>\n    </div>\n\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 260px; background:#1a3b2a; padding:1.1rem 1.25rem;'>\n        <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#d2a097 !important;'>All three &quot;yes&quot;</p>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#f8f9f0 !important;'>A small harvest is reasonable. Take only the capped surplus above winter stores.</p>\n      </div>\n      <div style='flex:1 1 260px; background:#dde2d8; padding:1.1rem 1.25rem;'>\n        <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#5c6b60 !important;'>Any &quot;no&quot; (the usual case)</p>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Leave it all. Most first-year colonies produce no surplus. Surviving winter is the real success.</p>\n      </div>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["harvesting-honey-first-time-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>How Much Honey to Leave for Winter</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>California colonies burn far less than cold-climate hives.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; margin:0 0 1.25rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8a9a8f; padding:1.1rem 1.25rem; text-align:center;'>\n        <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#5c6b60 !important;'>Cold-climate hives</p>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:2rem; font-weight:600; color:#1a3b2a !important;'>60&ndash;90 lbs</p>\n        <p style='margin:6px 0 0; font-size:0.85rem; color:#3a4a40 !important;'>Weeks of cluster heat through a long, brutal winter (Vermont, Minnesota).</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8f4f45; padding:1.1rem 1.25rem; text-align:center;'>\n        <p style='margin:0 0 4px; font-size:0.8rem; letter-spacing:0.05em; text-transform:uppercase; color:#8f4f45 !important;'>Mild California target</p>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:2rem; font-weight:600; color:#8f4f45 !important;'>30&ndash;50 lbs</p>\n        <p style='margin:6px 0 0; font-size:0.85rem; color:#3a4a40 !important;'>Bees forage warm days and early bloomers. Aim high end for a beginner cushion.</p>\n      </div>\n    </div>\n\n    <div style='background:#1a3b2a; padding:1.1rem 1.25rem; margin:0 0 1rem;'>\n      <p style='margin:0 0 6px; font-size:0.85rem; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:#d2a097 !important;'>Frame-weight math</p>\n      <p style='margin:0; font-size:0.95rem; color:#f8f9f0 !important;'>A full deep frame of honey weighs roughly <strong>6 to 8 pounds</strong>. So 30&ndash;50 lbs is about the equivalent of a well-filled box of honey, which generally covers a coastal colony.</p>\n    </div>\n\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem;'>\n        <thead>\n          <tr style='background:#dde2d8;'>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #cdd5c8; color:#1a3b2a !important;'>Full deep frames of honey</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #cdd5c8; color:#1a3b2a !important;'>Approx. weight (6&ndash;8 lbs each)</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>5 frames</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~30&ndash;40 lbs</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>6 frames</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~36&ndash;48 lbs</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>7&ndash;8 frames</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~42&ndash;50+ lbs</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>Heft the hive by lifting the back to judge weight. Feed only if a colony feels alarmingly light. A well-provisioned coastal colony often needs no winter feeding at all.</p>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["how-to-get-your-first-bees-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Package vs. Nuc vs. Swarm</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Three ways to start a colony in California, compared.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>&nbsp;</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Package</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Nuc (nucleus colony)</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Caught swarm</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>What you get</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~3 lbs loose worker bees + a separately caged mated queen. Not yet a functioning colony.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>A small but complete colony: queen, workers, brood, and food on 3&ndash;5 frames of drawn comb.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>A cluster of bees that left another colony and settled, which you collect and hive.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Cost</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~$130&ndash;$200</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>~$210&ndash;$325</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Free</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Build-up speed</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Slower. Builds comb and establishes from scratch.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Faster. Already up and running with drawn comb and brood.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Varies widely with the swarm&#39;s size and health.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Disease &amp; Africanization risk</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Low. Known, managed source.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Low. Known, managed source; buy local stock.</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; background:#faf1f0; color:#962d28 !important;'>Unknown genetics, health, and temperament. High Africanization risk in Southern California.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Best-fit beginner</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Budget-minded keeper, or anyone needing mail delivery.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#8f4f45 !important; font-weight:600;'>Most first-timers who can pick up locally and want the smoothest start.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Experienced keepers, or beginners only with a mentor.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>Nucs are almost always local pickup only, since they do not ship well. Source local stock so your bees are already suited to our climate.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["how-to-get-your-first-bees-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>California Bee-Buying Timeline</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Order early. Spring supplies sell out and recent losses have tightened supply.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='border-left:3px solid #dde2d8; padding:0 0 0 1.25rem; margin:0 0 0.5rem;'>\n\n      <div style='position:relative; margin:0 0 1.1rem;'>\n        <span style='position:absolute; left:-1.65rem; top:2px; width:12px; height:12px; border-radius:50%; background:#8f4f45; display:inline-block;'></span>\n        <p style='margin:0; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#8f4f45 !important;'>January &ndash; February</p>\n        <p style='margin:3px 0 0; font-size:0.95rem; font-weight:600; color:#1a3b2a !important;'>Order your bees</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Reserve packages and nucs now for spring pickup or delivery. Register your apiary plan and line up a mentor.</p>\n      </div>\n\n      <div style='position:relative; margin:0 0 1.1rem;'>\n        <span style='position:absolute; left:-1.65rem; top:2px; width:12px; height:12px; border-radius:50%; background:#8f4f45; display:inline-block;'></span>\n        <p style='margin:0; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#8f4f45 !important;'>April</p>\n        <p style='margin:3px 0 0; font-size:0.95rem; font-weight:600; color:#1a3b2a !important;'>Install packages &amp; nucs</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Packages arrive for April pickup or mail delivery; California nucs are often ready mid-April. Have the hive assembled and placed first.</p>\n      </div>\n\n      <div style='position:relative; margin:0 0 1.1rem;'>\n        <span style='position:absolute; left:-1.65rem; top:2px; width:12px; height:12px; border-radius:50%; background:#2e6b46; display:inline-block;'></span>\n        <p style='margin:0; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2e6b46 !important;'>Spring &ndash; Summer</p>\n        <p style='margin:3px 0 0; font-size:0.95rem; font-weight:600; color:#1a3b2a !important;'>Build-up through the nectar flow</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>The colony grows population and comb through the growing season, storing the food it needs to survive the following winter.</p>\n      </div>\n\n      <div style='position:relative;'>\n        <span style='position:absolute; left:-1.65rem; top:2px; width:12px; height:12px; border-radius:50%; background:#2e6b46; display:inline-block;'></span>\n        <p style='margin:0; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2e6b46 !important;'>Register on arrival</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Register your hives with the county agricultural commissioner as soon as the bees are on your property.</p>\n      </div>\n\n    </div>\n\n    <div style='background:#1a3b2a; padding:1rem 1.25rem; margin:1.25rem 0 0;'>\n      <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#d2a097 !important;'>Coastal vs. inland timing</p>\n      <p style='margin:0; font-size:0.92rem; color:#f8f9f0 !important;'>On the mild Central Coast you may install slightly earlier than inland valleys. This is a general pattern, not a fixed date, so confirm timing with your local supplier and guild.</p>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["langstroth-vs-top-bar-vs-flow-hive-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Beehive Types at a Glance</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Langstroth, top-bar, and Flow Hive compared for a California beginner.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>&nbsp;</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Langstroth</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Top-bar</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Flow Hive</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>How it works</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Stacked boxes with movable frames. Add supers as the colony grows. The standard hive.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>A long horizontal cavity. Bees build natural comb hanging from a row of top bars. No boxes to stack.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>A Langstroth with special plastic honey-super frames you drain through a tap, no opening required.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Weight &amp; lifting</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Heavy. A full deep box can weigh over 90 lbs. Medium boxes lighten the load.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Light. Inspect one bar at a time, no box lifting. Easiest on your back.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Same as Langstroth for the brood boxes; only harvest avoids lifting.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Honey yield</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Best producer. Stackable supers let a strong colony store a lot.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Lower. Cannot add a super to expand.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Similar to Langstroth; easier harvest, not more honey.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Cost range</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Most affordable; interchangeable parts everywhere.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Inexpensive to build yourself; non-standard parts.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Priciest. Flow Hive Classic Cedar runs around $699.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Best-fit beekeeper</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#8f4f45 !important; font-weight:600;'>Most California beginners: max support, inspectable, best yield.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Back-friendly, natural-comb, small-space keepers not chasing honey volume.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Those valuing low-disturbance harvest who accept all the usual management.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>UC ANR identifies the Langstroth as the standard, most commonly used hive. A Flow Hive simplifies harvesting only, not inspection or mite management.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["langstroth-vs-top-bar-vs-flow-hive-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Langstroth vs. Top-Bar: Pros and Cons</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>The tradeoffs that matter most to a California beginner.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n\n      <div style='flex:1 1 300px; background:#ffffff; border:1px solid #dde2d8; padding:1.25rem;'>\n        <p style='margin:0 0 0.9rem; font-family:Fraunces,serif; font-size:1.15rem; font-weight:600; color:#1a3b2a !important; border-bottom:2px solid #dde2d8; padding-bottom:0.5rem;'>Langstroth</p>\n        <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#2e6b46 !important;'>Strengths</p>\n        <ul style='margin:0 0 1rem; padding-left:1.1rem; font-size:0.9rem; color:#3a4a40 !important;'>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Best honey yield; add supers to expand</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Interchangeable equipment available everywhere</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Movable frames make inspection straightforward</li>\n          <li style='margin-bottom:0; color:#3a4a40 !important;'>The most local support, classes, and mentorship</li>\n        </ul>\n        <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#8f4f45 !important;'>Limitations</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.9rem; color:#3a4a40 !important;'>\n          <li style='margin-bottom:0; color:#3a4a40 !important;'>Heavy: a full deep box can exceed 90 lbs (medium boxes lighten it)</li>\n        </ul>\n      </div>\n\n      <div style='flex:1 1 300px; background:#ffffff; border:1px solid #dde2d8; padding:1.25rem;'>\n        <p style='margin:0 0 0.9rem; font-family:Fraunces,serif; font-size:1.15rem; font-weight:600; color:#1a3b2a !important; border-bottom:2px solid #dde2d8; padding-bottom:0.5rem;'>Top-Bar</p>\n        <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#2e6b46 !important;'>Strengths</p>\n        <ul style='margin:0 0 1rem; padding-left:1.1rem; font-size:0.9rem; color:#3a4a40 !important;'>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>No heavy lifting; inspect one bar at a time</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Natural comb, which some keepers prefer</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Simple and inexpensive to build yourself</li>\n          <li style='margin-bottom:0; color:#3a4a40 !important;'>Relaxed, low-disturbance observation</li>\n        </ul>\n        <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:#8f4f45 !important;'>Limitations</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.9rem; color:#3a4a40 !important;'>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Less honey; cannot add a super to expand</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Fragile natural comb breaks more easily</li>\n          <li style='margin-bottom:5px; color:#3a4a40 !important;'>Non-standard, non-interchangeable parts</li>\n          <li style='margin-bottom:0; color:#3a4a40 !important;'>Far less local support and mentorship</li>\n        </ul>\n      </div>\n\n    </div>\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>For a small-space or back-friendly setup where honey volume is not the goal, a top-bar hive can be a good fit. Otherwise a Langstroth is the safer first hive.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["supporting-native-bees-california-garden-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>California Native Bee ID Card</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>The gentle, garden-friendly natives worth supporting.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>&nbsp;</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Mason bees<br><span style='font-weight:400; font-size:0.8rem; color:#d2a097 !important;'>Osmia species</span></th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Leafcutter bees<br><span style='font-weight:400; font-size:0.8rem; color:#d2a097 !important;'>Megachile species</span></th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Bumble bees</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Season</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Spring-active. Emerge as early as the first warm spells of late winter.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Summer counterparts of the mason bee.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Active across the warm season.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>Nesting style</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Existing tubular cavities; build mud walls between egg chambers. Readily use bee houses.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Pre-made cavities; partition chambers with neatly cut leaf pieces. Also use bee houses.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Nest in the ground or in cavities. Supported through flowers and undisturbed habitat, not houses.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; font-weight:600; color:#1a3b2a !important;'>What they pollinate</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Superb early-season pollinators of fruit trees and spring blooms.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Summer vegetables and flowers.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Important buzz-pollinators for tomatoes and other crops.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:1rem 0 0; font-size:0.85rem; font-style:italic; color:#5c6b60 !important;'>California has about 1,600 native bee species. Nearly all are gentle and unlikely to sting, and most are solitary. The semicircular notches leafcutters cut from rose or redbud leaves are cosmetic, not harmful.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["supporting-native-bees-california-garden-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Native Bee Habitat Checklist</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Five changes that help every native bee, with zero risk.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Plant season-long flowers</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>The single highest-impact change. Native bees need nectar and pollen from late winter through fall, so aim for something always in bloom, especially California natives.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Leave bare ground for ground-nesters</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Roughly 70 percent of native bees nest in the ground. Leave some bare, undisturbed, un-mulched soil in a sunny spot. Heavy mulch, landscape fabric, and constant tilling remove this habitat.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Leave standing stems over winter</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Pithy and hollow stems from elderberry, sunflower, and many perennials become nesting cavities for stem-nesting bees. Resist cutting everything back in fall.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.75rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Provide a shallow water source</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>A shallow dish with landing spots like pebbles gives bees a safe place to drink.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; padding:1rem 1.25rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#8f4f45; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#8f4f45 !important;'>Minimize pesticides (most important)</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Avoiding insecticides that kill the bees you are trying to help is the foundation of native bee conservation, per the Xerces Society.</p>\n      </div>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["urban-small-space-beekeeping-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Small-Yard Hive Placement</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>An overhead view of a city lot done right.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='position:relative; background:#eef1e8; border:2px dashed #8a9a8f; padding:1.25rem; min-height:230px;'>\n      <p style='margin:0 0 0.75rem; font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; text-align:center; color:#5c6b60 !important;'>&#8592; Neighbor&#39;s property line &nbsp;|&nbsp; keep hive setbacks &#8594;</p>\n\n      <div style='display:flex; flex-wrap:wrap; gap:1rem; align-items:stretch;'>\n\n        <div style='flex:1 1 150px; background:#1a3b2a; border-radius:6px; padding:1rem; text-align:center; display:flex; flex-direction:column; justify-content:center;'>\n          <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:#d2a097 !important;'>Quiet corner</p>\n          <p style='margin:0; font-size:0.85rem; color:#f8f9f0 !important;'>Hive in the calmest part of the lot, far from patios, walkways, and shared fences.</p>\n          <p style='margin:8px 0 0; font-size:0.78rem; font-style:italic; color:#dde2d8 !important;'>Entrance points ACROSS your own yard</p>\n        </div>\n\n        <div style='flex:1 1 150px; display:flex; flex-direction:column; gap:0.75rem;'>\n          <div style='background:#c9a84c; border-radius:6px; padding:0.75rem; text-align:center;'>\n            <p style='margin:0; font-size:0.85rem; font-weight:600; color:#1a3b2a !important;'>&#9788; Morning sun</p>\n            <p style='margin:2px 0 0; font-size:0.78rem; color:#3a4a40 !important;'>Face roughly east/southeast; some afternoon shade.</p>\n          </div>\n          <div style='background:#2e6b46; border-radius:6px; padding:0.75rem; text-align:center;'>\n            <p style='margin:0; font-size:0.85rem; font-weight:600; color:#f8f9f0 !important;'>Water source</p>\n            <p style='margin:2px 0 0; font-size:0.78rem; color:#dde2d8 !important;'>Shallow dish on your property, set up before bees arrive.</p>\n          </div>\n        </div>\n\n      </div>\n\n      <div style='margin:1rem 0 0; background:#8f4f45; border-radius:6px; padding:0.75rem 1rem; text-align:center;'>\n        <p style='margin:0; font-size:0.85rem; font-weight:600; color:#f8f9f0 !important;'>Flyway barrier (fence, wall, or dense hedge)</p>\n        <p style='margin:2px 0 0; font-size:0.8rem; color:#f8dfd9 !important;'>Forces departing bees to climb steeply and clear people&#39;s heads.</p>\n      </div>\n      <p style='margin:0.5rem 0 0; font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; text-align:center; color:#5c6b60 !important;'>Sidewalk / street side</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin:1rem 0 0;'>\n      <p style='margin:0; font-size:0.88rem; color:#3a4a40 !important;'><strong style='color:#1a3b2a !important;'>Santa Cruz rules:</strong> single-family lots are capped at two hives, with a required six-foot flyway barrier when hives sit within 10 feet of a property line. Leave working room behind and beside the hive to open it and lift boxes.</p>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["urban-small-space-beekeeping-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Good-Neighbor Beekeeping Checklist</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Your beekeeping is only as welcome as your worst day at the hive.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.7rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Keep gentle stock</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Start with gentle European bees rather than a caught swarm, and requeen any colony that turns defensive. A calm colony is a quiet colony.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.7rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Manage swarming</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Regular spring inspections to catch swarm preparations, plus giving the colony room to grow, keep a cloud of bees out of a neighbor&#39;s yard.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.7rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Talk to neighbors first</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Let people know you keep bees, share your contact information, and offer a jar of honey from the first harvest. A heads-up prevents most complaints.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.7rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Provide an on-property water source</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>Set up a shallow dish before installing the colony, so bees never lock onto a neighbor&#39;s pool or pet bowl. Prevention is the whole game.</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; margin:0 0 0.7rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Use a flyway barrier</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>A solid barrier near the entrance sends bees up and over head height. Many California cities require one (Santa Cruz: six feet, within 10 feet of a property line).</p>\n      </div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.25rem; display:flex; align-items:flex-start; gap:12px;'>\n      <span style='flex:0 0 auto; width:22px; height:22px; border-radius:4px; background:#2e6b46; color:#f8f9f0 !important; text-align:center; line-height:22px; font-weight:700; font-size:0.9rem;'>&#10003;</span>\n      <div>\n        <p style='margin:0; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Keep hive numbers sensible</p>\n        <p style='margin:3px 0 0; font-size:0.88rem; color:#3a4a40 !important;'>On a small lot, one or two hives is plenty, and many city ordinances cap you there anyway. Do not expand beyond what your space and neighbors can absorb.</p>\n      </div>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["varroa-mites-bee-problems-beginners-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>How Varroa Mites Collapse a Colony</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>A hive that looks healthy in September can be dead by February.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; flex-wrap:wrap; gap:0.85rem; align-items:stretch;'>\n\n      <div style='flex:1 1 160px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:1.1rem;'>\n        <p style='margin:0 0 4px; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#2e6b46 !important;'>Stage 1</p>\n        <p style='margin:0 0 5px; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>Mites reproduce in brood cells</p>\n        <p style='margin:0; font-size:0.86rem; color:#3a4a40 !important;'>Varroa destructor, about the size of a pinhead, breeds inside capped brood cells. Numbers can explode over a season while the colony looks outwardly fine.</p>\n      </div>\n\n      <div style='flex:1 1 160px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #c9a84c; padding:1.1rem;'>\n        <p style='margin:0 0 4px; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#a8862f !important;'>Stage 2</p>\n        <p style='margin:0 0 5px; font-size:1rem; font-weight:600; color:#1a3b2a !important;'>They transmit and amplify viruses</p>\n        <p style='margin:0; font-size:0.86rem; color:#3a4a40 !important;'>Mites feed on adult bees and brood, spreading deformed wing virus, which produces shriveled, useless wings and shortens bee lives. The mite-plus-virus combination is what pushes colonies past recovery.</p>\n      </div>\n\n      <div style='flex:1 1 160px; background:#ffffff; border:1px solid #962d28; border-top:5px solid #962d28; padding:1.1rem;'>\n        <p style='margin:0 0 4px; font-size:0.75rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#962d28 !important;'>Stage 3</p>\n        <p style='margin:0 0 5px; font-size:1rem; font-weight:600; color:#962d28 !important;'>Winter bees are compromised</p>\n        <p style='margin:0; font-size:0.86rem; color:#3a4a40 !important;'>The long-lived winter bees raised in late summer and fall must be as mite-free as possible. If mites and virus weaken them, the colony quietly dies over winter.</p>\n      </div>\n\n    </div>\n\n    <div style='background:#1a3b2a; padding:1rem 1.25rem; margin:1.1rem 0 0;'>\n      <p style='margin:0 0 4px; font-size:0.8rem; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#d2a097 !important;'>The late-summer risk window</p>\n      <p style='margin:0; font-size:0.92rem; color:#f8f9f0 !important;'>Late summer is the pivotal moment in the beekeeping year. The bees raised then become the winter bees, so this is when a low mite count matters most. Monitor monthly and treat before winter bees are reared.</p>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["varroa-mites-bee-problems-beginners-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Varroa Treatment Options Compared</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#dde2d8 !important;'>Always follow the product label exactly. The label is the law.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.88rem; min-width:600px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Treatment</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Temperature</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Supers on/off</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Effect on brood</th>\n            <th style='text-align:left; padding:11px 12px; border:1px solid #16482f; color:#f8f9f0 !important;'>Best-use timing</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#1a3b2a !important;'><strong>Formic acid</strong><br><span style='font-size:0.8rem; color:#5c6b60 !important;'>e.g. Formic Pro</span></td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Temperature-sensitive; can harm queen or brood in high heat.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Some formulations allow supers on.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Penetrates capped brood (a real advantage).</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>When temperatures are moderate.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#1a3b2a !important;'><strong>Oxalic acid</strong></td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Gentle on bees when dosed correctly; inexpensive.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Supers off.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Kills mites on adults only, not those in capped brood.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Broodless / low-brood window, often late fall or winter.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#1a3b2a !important;'><strong>Thymol</strong><br><span style='font-size:0.8rem; color:#5c6b60 !important;'>e.g. Apiguard</span></td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Works within a temperature range; a soft treatment.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Supers off.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Evaporates in the hive; thyme-oil derived.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>When temperatures fall in its working range.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#1a3b2a !important;'><strong>Amitraz</strong><br><span style='font-size:0.8rem; color:#5c6b60 !important;'>e.g. Apivar</span></td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Not temperature-limited; highly effective synthetic strip.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Supers off.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Applied over several weeks; rotate types to avoid resistance.</td>\n            <td style='padding:10px 12px; border:1px solid #e2e7dd; color:#3a4a40 !important;'>Multi-week treatment window with supers removed.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #962d28; padding:0.9rem 1.1rem; margin:1rem 0 0;'>\n      <p style='margin:0; font-size:0.88rem; color:#3a4a40 !important;'><strong style='color:#962d28 !important;'>Before harvest:</strong> any treatment that could contaminate honey must be fully completed and supers removed before you harvest. Never treat with supers on unless the specific product label allows it.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
