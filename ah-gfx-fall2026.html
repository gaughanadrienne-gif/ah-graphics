window.AH_GRAPHICS["fall-bulbs-central-coast-california-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Central Coast Fall Bulb Selector</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">What to plant September through December in Santa Cruz County, and what to expect from it</p>\n    </div>\n    <div style=\"overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; min-width: 720px;\">\n            <thead>\n                <tr>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Bulb</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Plant</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Depth</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Note</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr>\n                    <td colspan=\"4\" style=\"background-color: #8f4f45 !important; color: #f8f9f0 !important; padding: 9px 12px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;\">Plant once, comes back</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Daffodil and other narcissus</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept through Dec</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">3 to 6 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Naturalizes and multiplies. Small bulbs 3 to 4 in, medium 4 to 5, large 5 to 6. Deer and gopher resistant.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Freesia</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept through Nov</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Naturalizes well. Set 2 to 3 in apart, pointed ends up. The fragrance is the point.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Dutch iris</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept through Dec</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">4 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Naturalizes well. Set 3 to 4 in apart. Florist-quality cut flower you plant once.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Muscari (grape hyacinth)</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept and Oct</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 to 3 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Set 3 in apart. Listed as a good naturalizer.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Sparaxis (harlequin flower)</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept and Oct</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 to 3 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Set 2 to 4 in apart. Long bloom period in early spring. Cheap, and it multiplies.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Tritonia</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept and Oct</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 to 3 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Set 2 to 4 in apart. Naturalizes well, but wants regular water until the flowers fade.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Ixia (African corn lily)</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Fall, with everything else</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">About 3 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Not listed on the UC chart. WSU Extension: about 3 in deep, tips up, in well-drained soil. No wet feet.</td>\n                </tr>\n                <tr>\n                    <td colspan=\"4\" style=\"background-color: #8f4f45 !important; color: #f8f9f0 !important; padding: 9px 12px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;\">Worth it as annuals</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Tulip</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Nov and Dec, after chilling</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">6 to 8 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Chill at least 6 weeks first. Set 4 to 8 in apart. Gophers' particular favorite.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Hyacinth</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Nov and Dec, after chilling</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">6 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Chill at least 6 weeks first. Set 4 to 6 in apart. Blooms beautifully the first spring, then fizzles.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Crocus</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept and Oct on the UC chart</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Not listed by UC</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Needs pre-chilling as tulips do, and will not naturalize where winters are warm.</td>\n                </tr>\n                <tr>\n                    <td colspan=\"4\" style=\"background-color: #8f4f45 !important; color: #f8f9f0 !important; padding: 9px 12px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase;\">The in-betweens</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Ranunculus</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept through Dec</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">1 to 2 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Soak the tubers in water 45 minutes, plant prongs down. 4 to 5 in apart in the ground, 6 to 8 in pots.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Anemone (Anemone coronaria)</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Sept through Dec</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">1 to 2 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Scarred side up, 6 to 8 in apart, full sun. Blooms alongside ranunculus and cuts just as well.</td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        Depths and spacing are from the UC Master Gardeners of Sacramento County bulb planting schedule. Set everything pointy end up and flat, rooted end down. Water thoroughly once at planting, then leave it alone.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Master Gardeners of Sacramento County, Sacramento Bulb Planting Schedule. WSU Clark County Extension Master Gardeners (Ixia).\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["fall-bulbs-central-coast-california-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Chill or Skip?</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Which fall bulbs need refrigerator time in a mild-winter California county</p>\n    </div>\n    <div style=\"padding: 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Skip the fridge</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Daffodils and other narcissus</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Freesia</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Ranunculus</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Iris</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Anemone</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Most minor bulbs</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">UC Master Gardeners of Alameda County: these receive sufficient winter chill naturally outdoors in mild-winter California. Plant them straight into the ground.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Chill 4 to 6 weeks or more</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Tulips</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Hyacinths</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\"><strong>Crocus</strong></span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">35 to 45 degrees, in ventilated paper bags. UC Alameda calls for 4 to 6 weeks, then prompt planting. UC Sacramento calls for at least 6 weeks in the crisper drawer.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Buy in September or October so you have time to run the clock, then plant in November or December. Label the bag with the date you need to pull it out.</span>\n                </div>\n            </div>\n        </div>\n        <div style=\"background-color: #1a3b2a !important; border-left: 5px solid #c9a84c; padding: 14px 18px; margin-top: 18px;\">\n            <strong style=\"display: block; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: #c9a84c !important; margin-bottom: 6px;\">Keep them away from fruit</strong>\n            <span style=\"font-size: 0.85rem; line-height: 1.6; color: #f8f9f0 !important;\">Both UC sources give the same warning, so treat it as the real rule: keep chilling bulbs away from apples and other ripening fruit. The ethylene gas that fruit releases destroys the flower forming inside the bulb. A paper bag in the crisper next to a bag of apples is how you get a pot of leaves in March.</span>\n        </div>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        Want tulips that come back? Try species tulips. UC Marin Master Gardeners name <em>Tulipa bakeri</em>, <em>Tulipa clusiana</em>, and <em>Tulipa saxatilis</em> as the ones that often return after our mild winters. They are smaller and less showy than the Dutch hybrids on the catalog cover, and they are the only tulips on the Central Coast that behave like perennials.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Master Gardeners of Alameda County. UC Master Gardeners of Sacramento County. UC Master Gardeners of Solano County. UC Marin Master Gardeners.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["fall-bulbs-central-coast-california-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Bulb Bed Gopher Defense</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Exclusion specifications from UC IPM Pest Notes: Pocket Gophers, UC ANR Publication 7433</p>\n    </div>\n    <div style=\"overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; min-width: 640px;\">\n            <thead>\n                <tr>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Method</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Specification</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">When you build it</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Under raised beds</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Hardware cloth or 3/4 inch mesh poultry wire laid across the footprint.</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Before planting, when the bed is still empty.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Individual plantings</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Wire baskets sunk in the ground, sized to leave enough room for roots to grow.</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">At planting time.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Perimeter fencing</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Hardware cloth or 1/2 to 3/4 inch mesh buried at least 2 ft deep, with an additional 6 in bent at a 90 degree angle away from the planting, plus at least 1 ft extending aboveground. Use galvanized or stainless steel wire where you want the barrier to last.</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Once, around the whole bed.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">No protection at all</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Plant daffodils and other narcissus. Gophers avoid them because of the bitter taste.</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Any time in the fall window.</td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        A gopher basket sized for a shrub is too deep and too wide for a 2 inch freesia corm. Line the whole planting area instead, or use containers.\n    </div>\n    <div style=\"padding: 0 22px 6px 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"background-color: #1a3b2a !important; border-left: 5px solid #c9a84c; padding: 14px 18px; margin-top: 18px;\">\n            <strong style=\"display: block; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: #c9a84c !important; margin-bottom: 6px;\">Not a guarantee</strong>\n            <span style=\"font-size: 0.85rem; line-height: 1.6; color: #f8f9f0 !important;\">UC IPM is clear that the method is not perfect, since a persistent gopher can burrow below the wire. Trapping is the other half of the answer.</span>\n        </div>\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Statewide Integrated Pest Management Program, Pest Notes: Pocket Gophers, UC ANR Publication 7433. UC Master Gardeners of Sacramento County.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["sowing-california-native-wildflower-seed-fall-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Santa Cruz County Wildflower Sowing Timeline</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Watch the forecast, not the calendar. The target is the first storm that wets the soil several inches deep.</p>\n    </div>\n    <div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Late September through mid-October: prep and flush</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Prep the seedbed and run the weed flush. Water the area to trick weed seeds into germinating, then hoe the seedlings down as they appear. Repeat if you have time. Never hoe or till more than 4 inches down, because that unearths buried weed seed.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Late October through November: sow (the ideal window)</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Sow in the two or three days before a forecast storm. Rain settles seed into contact with the soil far more gently than a hose does. Late October through late November is the ideal window because it mimics how native annuals seed themselves in the wild and lets the winter rainy season handle the watering.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">December through February: second and third sowings</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Stagger a second and third round for a longer bloom, to replace what the birds took, and to fill gaps where germination was thin. November through January is optimal because it requires the least supplemental water.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">March: last call</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">You can keep sowing through March, but anything sown this late will most likely need hand watering to hold a bloom once the rains stop.</div>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        <strong>Microclimate matters.</strong> In the fog belt and up in the mountains around Boulder Creek and Ben Lomond, soils stay cool and damp longer, so germination can be slower but more forgiving. Down in the Pajaro Valley and the warmer inland pockets around Scotts Valley, the soil dries faster between storms, so sowing right before rain matters more.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Master Gardeners of San Mateo and San Francisco Counties. UC Master Gardener Program of Contra Costa County.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["sowing-california-native-wildflower-seed-fall-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Native Wildflower Species Selector</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Eight California natives with documented ranges and reliable garden behavior in Santa Cruz County</p>\n    </div>\n    <div style=\"overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; min-width: 860px;\">\n            <thead>\n                <tr>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Species</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Color</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Height</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Sun</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Bloom</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Seed treatment</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">California poppy<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Eschscholzia californica</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Yellow to bright orange</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">1 to 2 ft</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Primarily spring</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None. Calscape says do not cover the seed with soil or mulch.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Tidy tips<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Layia platyglossa</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Bright golden yellow rays with sharp white tips</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">6 to 24 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Spring, early in the wave</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Baby blue eyes<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Nemophila menziesii</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Bright blue</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">About 6 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun or partial shade</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Spring</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None. Sown outdoors in late fall it may do well with no treatment at all.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Globe gilia<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Gilia capitata</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">White to pink, lavender, or light blue globes of 50 to 100 flowers</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">4 to 36 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Late in the wave</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None required. About 2 weeks of stratification improves germination.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Farewell to spring<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Clarkia amoena</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Pink to purple</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 to 3 ft</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Late spring and early summer</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None. Sow in masses or drifts rather than scattering it thin.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Elegant clarkia<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Clarkia unguiculata</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Various shades of pink</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">About 3 ft</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun through deep shade</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Summer</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Sky lupine<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Lupinus nanus</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Blue to lavender</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">4 to 24 in</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Winter and spring</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">None when the seed is fresh. Stored seed benefits from scarification.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Arroyo lupine<br><em style=\"font-weight: 400; color: #8c9c8c !important;\">Lupinus succulentus</em></td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Purple-blue, sometimes light purple, pink, or white</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">2 to 4 ft</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Full sun</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Spring</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Hot water or scarification. Germination takes 15 to 75 days.</td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n    <div style=\"padding: 16px 22px 6px 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"background-color: #1a3b2a !important; border-left: 5px solid #c9a84c; padding: 14px 18px; margin-top: 18px;\">\n            <strong style=\"display: block; font-size: 0.8rem; letter-spacing: 0.06em; text-transform: uppercase; color: #c9a84c !important; margin-bottom: 6px;\">Arroyo lupine is toxic</strong>\n            <span style=\"font-size: 0.85rem; line-height: 1.6; color: #f8f9f0 !important;\">Calscape notes that the seeds, leaves, and stems of arroyo lupine are toxic. Keep it out of reach if you garden with small children or nibbling dogs.</span>\n        </div>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        Every description here comes from Calscape, the California Native Plant Society's plant database. Mix one part seed to three parts coarse sand and broadcast the mixture, cover very lightly at less than a quarter inch, then tamp.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: Calscape, California Native Plant Society. UC Master Gardeners of San Mateo and San Francisco Counties. UC Master Gardener Program of Contra Costa County.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["sowing-california-native-wildflower-seed-fall-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">What the First Year Actually Looks Like</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Sow in November, and the patch largely reloads itself by year two</p>\n    </div>\n    <div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">November: sow</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Sow ahead of a forecast storm. Mix one part seed to three parts coarse sand, cover very lightly at less than a quarter inch, then tamp lightly to protect the seed from wind and birds. Flag the area, because in January a bare-looking patch is very easy to walk on or weed by mistake.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">December through February: weed passes</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Weed seeds remaining in the ground will germinate alongside your wildflowers and can overrun them if left unchecked. Plan on a few passes, with your reference photos of the germinating weeds in hand. Germination is uneven, so a patch that looks half empty in December can fill in by February.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Spring: bloom comes in waves, not all at once</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Poppies and tidy tips are the early ones, clarkia and globe gilia the late ones. Sky lupine and baby blue eyes fall in between. Farewell to spring carries into early summer.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Late spring through summer: let them dry and drop seed</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Seed matures from late spring through summer before the parent plant dies. It gets a little less appealing to look at once the plants dry up, which is the argument for keeping the patch small or interplanting perennials and small shrubs.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">5</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Year two: the patch reloads itself</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">These species self-seed. California poppy reseeds freely, and sky lupine, elegant clarkia, and farewell to spring are self-sowing annuals. Let the plants dry and drop seed before you cut them back, and year two is usually better than year one.</div>\n            </div>\n        </div>\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Master Gardeners of Butte County. UC Master Gardener Program of Contra Costa County. UC Master Gardeners of San Mateo and San Francisco Counties. Calscape, California Native Plant Society.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["first-rain-checklist-santa-cruz-gardens-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">First Rain Countdown</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The first storm can arrive any time from early October to early December. Do the work before it, not during it.</p>\n    </div>\n    <div style=\"padding: 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">6 weeks out (late September)</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Walk the property and mark every patch of bare soil bigger than a doormat, then cover it.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Prep seedbeds so they are ready to sow ahead of a storm.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Sow cover crops early to mid October, so roots are holding soil by the time serious rain arrives.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Run each drip zone once and walk the lines. Summer sun degrades emitters, and rodent damage shows up as a wet spot you will not notice once everything is wet.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">2 weeks out</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Clear the gutters on sheds, greenhouses, coops, and lath houses. Redwood needles mat and clog a gutter screen rather than washing through.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Clear the summer debris out of swales, ditches, and dry creeks. A blocked swale is worse than no swale, because it concentrates water into one overflow point.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Run a hose into each downspout and swale and watch where the water actually goes.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Move bagged amendments, potting mix, saved seed, and hand tools under cover.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cover the compost pile, leaving the sides open so air still moves through.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Storm week</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Confirm the irrigation controller is off, or wet the rain shutoff sensor and confirm the controller skips the cycle.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Restake only the young trees that cannot stand on their own, using two stakes outside the root ball with the prevailing wind blowing between them.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Reconnect the rain barrel downspout diverter. This is the one people miss on the first storm.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Flag anything you have sown, so nobody walks on it or weeds it by mistake.</span>\n                </div>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        Treat the last week of September as your deadline for the structural work, and treat every October forecast as a possible start date. Waiting for a rain forecast to begin is how people end up tarping a slope in the dark.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Marin Master Gardeners. UC Master Gardener Program of Contra Costa County. UC Master Gardeners of San Luis Obispo County.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["first-rain-checklist-santa-cruz-gardens-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Mulch Selector: Slopes, Beds, and Paths</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">Not all mulch stays put, and depth is a real limit rather than a suggestion</p>\n    </div>\n    <div style=\"overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; min-width: 700px;\">\n            <thead>\n                <tr>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Where</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Use this</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Why, and the limit</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Slopes</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Coarse arborist wood chips</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Large chunks are typically most effective, and heavier is better. Straw, small bark, and cocoa hulls wash away with rain. On a Boulder Creek or Bonny Doon slope, that means coarse chips rather than the fine bark you would use in a flat front bed.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Beds</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">3 to 4 in of coarse, or about 2 in of fine</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Keep organic mulch at a depth of 3 to 4 inches. Coarse-textured mulches go up to 4 inches, fine-textured only to about 2. Going deeper than 4 inches can injure plants by keeping the soil too wet and limiting oxygen to the roots.</td>\n                </tr>\n                <tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 10px 12px; font-weight: 600; color: #1a3b2a !important;\">Paths</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Coarse wood chips or gravel, plus shallow cross-drains</td>\n                    <td style=\"padding: 10px 12px; color: #1c3c2c !important;\">Compaction diminishes the soil's capacity to absorb water, so your paths run water like a channel by design. Where a path runs straight downhill, add a couple of shallow cross-drains so water leaves the path instead of accelerating down it.</td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        For slopes steep enough that even chunky mulch moves, UC Marin recommends temporary erosion control for the first couple of years after a new landscape goes in, which may include wattles, long straw or fiber tubes that slow runoff and retain the hillside until the roots of new vegetation secure it. Rely on professionals for correct installation.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Marin Master Gardeners, Hillsides. UC Statewide IPM Program, Weed Management in Landscapes. UC Master Gardener Program of Contra Costa County.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["first-rain-checklist-santa-cruz-gardens-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">Compost Through the Rainy Season</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The target is unchanged. The risk flips from too dry to too wet.</p>\n    </div>\n    <div style=\"padding: 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Moisture target</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">As moist as a wrung-out sponge. That does not change in winter, but keeping it there does.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Cover it</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">A tarp, cardboard, or straw all work as covers.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Air has to circulate under or through the cover, so leave the sides open.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Cover it before the first storm, not after.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #1a3b2a; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Size it</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">A structure 3 to 5 feet on each side.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">The pile itself at least 3 feet, so it can generate enough heat.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #1a3b2a !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">A small pile in a wet winter will not heat at all.</span>\n                </div>\n            </div>\n            <div style=\"background-color: #ffffff !important; border: 1px solid #dde2d8; border-top: 4px solid #8f4f45; padding: 16px 18px;\">\n                <div style=\"font-weight: 700; font-size: 0.95rem; color: #1a3b2a !important; margin-bottom: 10px; font-family: Fraunces, Georgia, serif;\">Site it</div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Where runoff does not flow through it.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">Where leachate does not run into a creek or a neighbor's property.</span>\n                </div>\n                <div style=\"display: flex; align-items: flex-start; gap: 10px; padding: 5px 0;\">\n                    <span style=\"display: inline-block; width: 9px; height: 9px; min-width: 9px; background-color: #8f4f45 !important; margin-top: 6px;\"></span>\n                    <span style=\"font-size: 0.83rem; line-height: 1.55; color: #1c3c2c !important;\">On a slope, that means a bench cut into the hill, not the fall line.</span>\n                </div>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #dde2d8 !important; padding: 14px 18px; font-size: 0.8rem; line-height: 1.6; color: #1c3c2c !important; text-align: center;\">\n        An uncovered open pile in a Santa Cruz Mountains winter goes anaerobic quickly. Waterlogged compost stops heating, starts smelling of ammonia and sulfur, and leaches nutrients straight into the soil under it.\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Source: UC Master Gardeners of San Luis Obispo County, Composting Basics.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["first-rain-checklist-santa-cruz-gardens-g4"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important; font-family: Fraunces, Georgia, serif;\">The Two-Week Window After the First Rain</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; color: #d2a097 !important;\">The first soaking storm triggers a flush of germination across the whole property, weeds and desirable seed alike</p>\n    </div>\n    <div style=\"padding: 8px 22px 18px 22px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">1</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">About a week or two after: hoe the weed flush</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">You will have a carpet of seedlings at the thread stage. A sharp stirrup hoe run shallow through them kills essentially all of them for almost no effort. Run it an inch at most, because deep tilling brings buried weed seeds to the surface and starts the cycle over. Do it on a morning when the surface is drying, not right after rain, since seedlings uprooted into wet soil will re-root. Wait three weeks and you are pulling by hand.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">2</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">The same window: sow California natives</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Native annual and perennial seed here germinates on the first sustained rains and grows through the cool season. Sowing at or just after the first real storm gives seedlings the longest run at the wet season.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #dde2d8;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">3</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">Before you restart irrigation: check at 6 inches</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">Dig down 6 inches in a couple of representative spots. Moist to 6 inches means you can skip a cycle. Dry at 3 inches means the storm was a surface event, and established trees and shrubs were not reached at all.</div>\n            </div>\n        </div>\n        <div style=\"display: flex; align-items: flex-start; gap: 14px; padding: 14px 0;\">\n            <span style=\"display: inline-block; min-width: 34px; width: 34px; height: 34px; line-height: 34px; text-align: center; background-color: #1a3b2a !important; color: #f8f9f0 !important; font-weight: 700; font-size: 0.85rem;\">4</span>\n            <div>\n                <div style=\"font-weight: 700; font-size: 0.9rem; color: #8f4f45 !important; margin-bottom: 4px;\">December or January: sow a second round</div>\n                <div style=\"font-size: 0.84rem; line-height: 1.6; color: #1c3c2c !important;\">UC Contra Costa sows California native annual wildflowers from November through March, with November to January optimal, so a second sowing still lands inside the best stretch of the season.</div>\n            </div>\n        </div>\n    </div>\n    <div style=\"padding: 10px 15px; font-size: 0.7rem; color: #8c9c8c !important; text-align: center;\">\n        Sources: UC Statewide IPM Program, Weed Management in Landscapes. UC Master Gardener Program of Contra Costa County, Sowing Native Wildflower Seeds.\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";
