window.AH_GRAPHICS["fastest-crops-to-grow-with-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Fastest Crops for Kids: Days to Harvest</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Coastal California timing, sown direct in a cool spring or fall</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='margin-bottom:1.25rem;'>\n      <div style='display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;'>\n        <span style='font-weight:700; font-size:0.95rem; color:#1a3b2a !important;'>Radishes</span>\n        <span style='font-size:0.8rem; color:#8f4f45 !important; font-weight:700;'>21 to 28 days</span>\n      </div>\n      <div style='background:#dde2d8; border-radius:4px; height:22px; width:100%;'>\n        <div style='background:#8f4f45; height:22px; width:25%; border-radius:4px;'></div>\n      </div>\n      <p style='font-size:0.78rem; margin:5px 0 0; color:#2e6b46 !important;'>Kid difficulty: Easiest. Big seeds, pops out of the soil like a magic trick.</p>\n    </div>\n\n    <div style='margin-bottom:1.25rem;'>\n      <div style='display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;'>\n        <span style='font-weight:700; font-size:0.95rem; color:#1a3b2a !important;'>Leaf Lettuce (baby leaves)</span>\n        <span style='font-size:0.8rem; color:#8f4f45 !important; font-weight:700;'>25 to 35 days</span>\n      </div>\n      <div style='background:#dde2d8; border-radius:4px; height:22px; width:100%;'>\n        <div style='background:#8f4f45; height:22px; width:32%; border-radius:4px;'></div>\n      </div>\n      <p style='font-size:0.78rem; margin:5px 0 0; color:#2e6b46 !important;'>Kid difficulty: Easy. Cut-and-come-again harvest for weeks.</p>\n    </div>\n\n    <div style='margin-bottom:1.25rem;'>\n      <div style='display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;'>\n        <span style='font-weight:700; font-size:0.95rem; color:#1a3b2a !important;'>Bush Beans</span>\n        <span style='font-size:0.8rem; color:#8f4f45 !important; font-weight:700;'>50 to 60 days</span>\n      </div>\n      <div style='background:#dde2d8; border-radius:4px; height:22px; width:100%;'>\n        <div style='background:#8f4f45; height:22px; width:56%; border-radius:4px;'></div>\n      </div>\n      <p style='font-size:0.78rem; margin:5px 0 0; color:#2e6b46 !important;'>Kid difficulty: Easy. Large seeds, no trellis, snap and eat on the spot.</p>\n    </div>\n\n    <div style='margin-bottom:0.5rem;'>\n      <div style='display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;'>\n        <span style='font-weight:700; font-size:0.95rem; color:#1a3b2a !important;'>Sunflowers (to bloom)</span>\n        <span style='font-size:0.8rem; color:#8f4f45 !important; font-weight:700;'>60 to 90 days</span>\n      </div>\n      <div style='background:#dde2d8; border-radius:4px; height:22px; width:100%;'>\n        <div style='background:#8f4f45; height:22px; width:90%; border-radius:4px;'></div>\n      </div>\n      <p style='font-size:0.78rem; margin:5px 0 0; color:#2e6b46 !important;'>Kid difficulty: Easy, but patient. Biggest seeds; grows taller than the child.</p>\n    </div>\n\n    <p style='font-size:0.75rem; margin:1.25rem 0 0; color:#1a3b2a !important; border-top:1px solid #dde2d8; padding-top:10px;'>Bars scaled to days from seed to harvest. Dwarf sunflowers bloom in 60 to 70 days; giant Mammoth types closer to 90 to 100. Timing is for cool coastal Santa Cruz County.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["fastest-crops-to-grow-with-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Kid Planting-Day Guide</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>How deep and how far apart, matched to seed size</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.86rem; min-width:520px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700;'>Crop</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700;'>Seed size</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700;'>How deep</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700;'>How far apart</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; font-weight:700; color:#8f4f45 !important;'>Radishes</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Small, but pick up one at a time</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Half an inch (one fingertip knuckle)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>One inch (one finger-width)</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:10px 12px; font-weight:700; color:#8f4f45 !important;'>Leaf Lettuce</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Tiny, sprinkle a pinch</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Barely covered, a light dusting of soil</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Scatter, then thin the sprouts</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; font-weight:700; color:#8f4f45 !important;'>Bush Beans</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Big, easy for a toddler to poke in</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>One inch (one finger to the first knuckle)</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>A few inches (one small hand-width)</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:10px 12px; font-weight:700; color:#8f4f45 !important;'>Sunflowers</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Biggest seed on the list</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>One inch, in the sunniest spot</td>\n            <td style='padding:10px 12px; color:#1a3b2a !important;'>Six inches or more so they stand tall</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#2e6b46 !important;'>Little-hands tip: a fingertip pressed to the first knuckle is about one inch, and one finger-width is about an inch across. Radishes, beans, and sunflowers all get sown right where they will grow, since they do not like being moved.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["fastest-crops-to-grow-with-kids-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Sow a Little Every Two Weeks</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Succession planting for a steady coastal-California harvest</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <div style='min-width:520px;'>\n\n        <div style='display:flex; margin-bottom:6px; padding-left:120px;'>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 1</div>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 3</div>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 5</div>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 7</div>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 9</div>\n          <div style='flex:1; text-align:center; font-size:0.72rem; color:#1a3b2a !important; font-weight:700;'>Week 11</div>\n        </div>\n\n        <p style='font-size:0.8rem; margin:0 0 4px; font-weight:700; color:#8f4f45 !important;'>Radishes (about 4 weeks each)</p>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 1</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#8f4f45; height:18px; width:33%; border-radius:4px;'></div></div>\n        </div>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 2</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#8f4f45; height:18px; width:33%; border-radius:4px; margin-left:17%;'></div></div>\n        </div>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 3</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#8f4f45; height:18px; width:33%; border-radius:4px; margin-left:34%;'></div></div>\n        </div>\n        <div style='display:flex; align-items:center; margin-bottom:14px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 4</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#8f4f45; height:18px; width:33%; border-radius:4px; margin-left:51%;'></div></div>\n        </div>\n\n        <p style='font-size:0.8rem; margin:0 0 4px; font-weight:700; color:#2e6b46 !important;'>Leaf Lettuce (about 5 weeks, then keeps cutting)</p>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 1</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#2e6b46; height:18px; width:42%; border-radius:4px;'></div></div>\n        </div>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 2</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#2e6b46; height:18px; width:42%; border-radius:4px; margin-left:17%;'></div></div>\n        </div>\n        <div style='display:flex; align-items:center; margin-bottom:5px;'>\n          <div style='width:120px; font-size:0.74rem; color:#2e6b46 !important;'>Sow batch 3</div>\n          <div style='flex:1; background:#dde2d8; height:18px; border-radius:4px;'><div style='background:#2e6b46; height:18px; width:42%; border-radius:4px; margin-left:34%;'></div></div>\n        </div>\n\n      </div>\n    </div>\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#1a3b2a !important; border-top:1px solid #dde2d8; padding-top:10px;'>Each bar runs from sowing day to harvest. Because you start a new short row every two weeks, a fresh crop comes ready every couple of weeks instead of one big pull followed by a long wait. Radishes and lettuce both love the cool coastal spring and fall.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-projects-elementary-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>The Responsibility Ladder: Ages 6 to 10</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Hand over more control as skill and confidence grow</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='border-left:5px solid #dde2d8; padding:0 0 0 16px;'>\n\n      <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:12px 14px; margin-bottom:12px;'>\n        <span style='display:inline-block; background:#dde2d8; color:#1a3b2a !important; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:12px; margin-bottom:6px;'>Age 6 to 7</span>\n        <p style='margin:0; font-size:0.9rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Own a bed of their own.</strong> Plant and tend a personal bed or large container, and keep a watering chart so nothing gets forgotten on a busy day.</p>\n      </div>\n\n      <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:12px 14px; margin-bottom:12px; margin-left:18px;'>\n        <span style='display:inline-block; background:#dde2d8; color:#1a3b2a !important; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:12px; margin-bottom:6px;'>Age 7 to 8</span>\n        <p style='margin:0; font-size:0.9rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Start seeds in trays.</strong> Label the pots, thin the crowded sprouts, and transplant the strongest seedlings out to the garden.</p>\n      </div>\n\n      <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:12px 14px; margin-bottom:12px; margin-left:36px;'>\n        <span style='display:inline-block; background:#dde2d8; color:#1a3b2a !important; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:12px; margin-bottom:6px;'>Age 8 to 9</span>\n        <p style='margin:0; font-size:0.9rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Sow the tiny seeds.</strong> Direct-sow carrots, lettuce, and beets that younger hands cannot manage, then harvest and wash the produce for the kitchen.</p>\n      </div>\n\n      <div style='background:#1a3b2a; border-radius:6px; padding:12px 14px; margin-left:54px;'>\n        <span style='display:inline-block; background:#d2a097; color:#1a3b2a !important; font-size:0.72rem; font-weight:700; padding:2px 9px; border-radius:12px; margin-bottom:6px;'>Age 9 to 10</span>\n        <p style='margin:0; font-size:0.9rem; color:#f8f9f0 !important;'><strong style='color:#d2a097 !important;'>Run the show.</strong> Keep a garden journal, handle pest patrol and problem solving, and design and run a simple experiment from question to result.</p>\n      </div>\n\n    </div>\n\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#2e6b46 !important;'>Let them make decisions and live with the results. A bed that dries out teaches more than one you rescue every time.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-projects-elementary-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>My Garden Experiment</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Copy this into your journal, then fill it in</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 8px; font-size:0.9rem; font-weight:700; color:#8f4f45 !important;'>1. My question</p>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#2e6b46 !important;'>What do I want to find out? (Example: Does a plant grow taller in sun or shade?)</p>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 8px; font-size:0.9rem; font-weight:700; color:#8f4f45 !important;'>2. My prediction (my best guess)</p>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#2e6b46 !important;'>What do I think will happen, and why?</p>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 8px; font-size:0.9rem; font-weight:700; color:#8f4f45 !important;'>3. What we did</p>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#2e6b46 !important;'>The steps I took, and what I kept the same between plants.</p>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px;'>\n      <p style='margin:0 0 8px; font-size:0.9rem; font-weight:700; color:#8f4f45 !important;'>4. What happened</p>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#2e6b46 !important;'>What I measured or saw. Was my prediction right?</p>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n    </div>\n\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#1a3b2a !important;'>This is the scientific method in miniature: ask a question, make a prediction, test it, and record what happens.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-preschoolers-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Match the Skill to the Job: Ages 4 to 6</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Real garden jobs that grow the skills preschoolers are building</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.86rem; min-width:480px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700; width:38%;'>Skill they are building</th>\n            <th style='text-align:left; padding:10px 12px; color:#f8f9f0 !important; font-weight:700;'>Garden job that uses it</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Counting</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Drop the seeds into the hole and count them; count how many beans you picked</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Pouring and aiming</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Water with a small can or wand, aimed at the roots, not the leaves</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Following two-step directions</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Plant the bean seed, then pat the soil over it; dig the hole, then set the start in</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Gentle pinch and grip</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Harvest ripe cherry tomatoes, beans, peas, strawberries, and radishes</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Spotting what is different</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Simple weeding once shown, and hunting for snails and caterpillars</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#2e6b46 !important;'>Let them own one specific plant or small bed, and rotate jobs so they do not get bored. A defined role builds responsibility and the fine motor coordination they will soon use for writing and cutting.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-preschoolers-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Our Three-Step Planting Project</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>A simple beginning, middle, and end for a 15-minute session</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; flex-wrap:wrap; gap:12px; margin-bottom:1.1rem;'>\n\n      <div style='flex:1; min-width:150px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <div style='background:#8f4f45; color:#f8f9f0 !important; width:30px; height:30px; border-radius:50%; text-align:center; line-height:30px; font-weight:700; font-family:Fraunces,serif; margin-bottom:8px;'>1</div>\n        <p style='margin:0 0 4px; font-size:0.92rem; font-weight:700; color:#1a3b2a !important;'>Plant the seed</p>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Poke a hole, drop in a bean seed, and gently pat the soil over the top.</p>\n      </div>\n\n      <div style='flex:1; min-width:150px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <div style='background:#8f4f45; color:#f8f9f0 !important; width:30px; height:30px; border-radius:50%; text-align:center; line-height:30px; font-weight:700; font-family:Fraunces,serif; margin-bottom:8px;'>2</div>\n        <p style='margin:0 0 4px; font-size:0.92rem; font-weight:700; color:#1a3b2a !important;'>Water and mark the row</p>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Give it a gentle drink, then push in a garden marker so we know where to look.</p>\n      </div>\n\n      <div style='flex:1; min-width:150px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <div style='background:#8f4f45; color:#f8f9f0 !important; width:30px; height:30px; border-radius:50%; text-align:center; line-height:30px; font-weight:700; font-family:Fraunces,serif; margin-bottom:8px;'>3</div>\n        <p style='margin:0 0 4px; font-size:0.92rem; font-weight:700; color:#1a3b2a !important;'>Check back daily</p>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Visit every morning to water and watch for the first green sprout.</p>\n      </div>\n\n    </div>\n\n    <div style='background:#eef1e8; border:1px dashed #8f4f45; border-radius:6px; padding:14px 16px;'>\n      <p style='margin:0 0 8px; font-size:0.88rem; font-weight:700; color:#8f4f45 !important;'>What did we see today?</p>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n      <div style='border-bottom:1px solid #dde2d8; height:20px;'></div>\n    </div>\n\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#1a3b2a !important;'>When the planned steps are done, let free play take over. If they want to keep digging or hunt for snails, that is a win, not a detour.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-preschoolers-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Preschool Garden Safety Card</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Ages 4 to 6 follow rules better, but still explore with their mouths</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 6px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Remove or fence off toxic plants</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'>Common Santa Cruz County ornamentals like foxglove, oleander, and many bulbs are poisonous if eaten. Keep them out of the garden your child roams.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 6px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Lock away products and tools</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'>Store fertilizers, slug baits, and sharp tools out of reach. Iron-based slug baits are harmful if swallowed.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 6px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Teach the taste rule, then verify</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'>Nothing goes in the mouth without an adult's yes. Supervise closely at snack-height plants, since a 5 year old will still forget.</p>\n    </div>\n\n    <div style='background:#1a3b2a; border:2px solid #c9a84c; border-radius:6px; padding:12px 16px; text-align:center;'>\n      <p style='margin:0; font-size:0.8rem; color:#c9a84c !important; font-weight:700; letter-spacing:0.5px;'>SAVE IN YOUR PHONE</p>\n      <p style='margin:4px 0 0; font-size:1.05rem; font-weight:700; color:#f8f9f0 !important;'>Poison Control: 1-800-222-1222</p>\n      <p style='margin:4px 0 0; font-size:0.78rem; color:#dde2d8 !important;'>You will likely never need it, but it belongs alongside your garden gloves.</p>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-toddlers-ages-2-4-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>How Long Will a Toddler Stay Interested?</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Roughly 2 to 3 minutes of focus per year of age, matched to real jobs</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; flex-wrap:wrap; gap:12px;'>\n\n      <div style='flex:1; min-width:160px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#8f4f45 !important;'>Age 2</p>\n        <p style='margin:2px 0 8px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>About 4 to 6 minutes</p>\n        <div style='background:#dde2d8; border-radius:4px; height:14px; margin-bottom:10px;'><div style='background:#8f4f45; height:14px; width:45%; border-radius:4px;'></div></div>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Dig in a dedicated dig zone. Pour water from a can filled only a quarter full.</p>\n      </div>\n\n      <div style='flex:1; min-width:160px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#8f4f45 !important;'>Age 3</p>\n        <p style='margin:2px 0 8px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>About 6 to 9 minutes</p>\n        <div style='background:#dde2d8; border-radius:4px; height:14px; margin-bottom:10px;'><div style='background:#8f4f45; height:14px; width:68%; border-radius:4px;'></div></div>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Drop big beans or sunflower seeds in a hole and pat the soil. Pick ripe cherry tomatoes.</p>\n      </div>\n\n      <div style='flex:1; min-width:160px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#8f4f45 !important;'>Age 4</p>\n        <p style='margin:2px 0 8px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>About 8 to 12 minutes</p>\n        <div style='background:#dde2d8; border-radius:4px; height:14px; margin-bottom:10px;'><div style='background:#8f4f45; height:14px; width:100%; border-radius:4px;'></div></div>\n        <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Carry and aim a small watering can. Smell and gently touch soft, safe herbs.</p>\n      </div>\n\n    </div>\n\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#1a3b2a !important;'>Keep sessions short and repeat them often. Four focused minutes every morning builds a stronger habit than one 45-minute marathon a month. When they wander off to dig, that is a 2 year old gardening exactly as they should.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-toddlers-ages-2-4-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Toddler Garden Safety Checklist</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Toddlers explore with their mouths, so barriers matter more than rules</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 10px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Plants: remove or fence off</p>\n      <p style='margin:0 0 8px; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>Take out toxic ornamentals: foxglove, oleander, and many bulbs.</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>When in doubt, keep it out of the toddler zone.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 10px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Products and tools: lock away</p>\n      <p style='margin:0 0 8px; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>Store fertilizers, slug bait, and tools locked or up high. Iron-based baits are harmful if swallowed.</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>Choose child tools with rounded edges.</p>\n    </div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:14px 16px; margin-bottom:12px;'>\n      <p style='margin:0 0 10px; font-size:0.95rem; font-weight:700; color:#8f4f45 !important;'>Sun and water precautions</p>\n      <p style='margin:0 0 8px; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>Provide a hat, shade, and water breaks, even on bright coastal days.</p>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><span style='display:inline-block; width:16px; height:16px; border:2px solid #8f4f45; border-radius:3px; margin-right:8px; vertical-align:middle;'></span>Supervise near water. Empty buckets when you finish; a bucket or pond is a drowning hazard.</p>\n    </div>\n\n    <div style='background:#1a3b2a; border:2px solid #c9a84c; border-radius:6px; padding:12px 16px; text-align:center;'>\n      <p style='margin:0; font-size:0.8rem; color:#c9a84c !important; font-weight:700; letter-spacing:0.5px;'>SAVE IN YOUR PHONE</p>\n      <p style='margin:4px 0 0; font-size:1.05rem; font-weight:700; color:#f8f9f0 !important;'>Poison Control: 1-800-222-1222</p>\n      <p style='margin:4px 0 0; font-size:0.78rem; color:#dde2d8 !important;'>Staffed 24 hours. Keep the \"ask before you taste\" rule too, but never rely on it alone.</p>\n    </div>\n\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-tweens-teens-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>The Ownership Shift</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>From parent as supervisor to parent as consultant</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.85rem; min-width:520px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:10px 12px; color:#1a3b2a !important; font-weight:700; width:22%;'>Who decides</th>\n            <th style='text-align:left; padding:10px 12px; background:#dde2d8; color:#1a3b2a !important; font-weight:700;'>Parent-led garden (younger years)</th>\n            <th style='text-align:left; padding:10px 12px; background:#8f4f45; color:#f8f9f0 !important; font-weight:700;'>Teen-led garden</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>The budget</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Parent buys the seeds, tools, and amendments</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Teen gets a set budget and decides how to spend it</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>The crops</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Parent chooses what goes in the ground</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Teen picks the crops, even hot peppers or cut flowers you would not</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>The schedule</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Parent manages watering and tasks day to day</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Teen runs daily management; parent steps back and helps when asked</td>\n          </tr>\n          <tr style='background:#eef1e8;'>\n            <td style='padding:11px 12px; font-weight:700; color:#8f4f45 !important;'>Mistakes</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Parent rescues the plant before it fails</td>\n            <td style='padding:11px 12px; color:#1a3b2a !important;'>Natural consequences teach; a neglected bed is a real lesson, not a disaster</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#2e6b46 !important;'>Ownership is the single biggest lever for keeping older kids engaged, and it only works if it is real. A teen who has to ask permission for every choice does not own anything.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gardening-with-tweens-teens-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Three Pathways for a Teen Gardener</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Match the route to what your teen actually cares about</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; flex-wrap:wrap; gap:12px;'>\n\n      <div style='flex:1; min-width:200px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:0; overflow:hidden;'>\n        <div style='background:#8f4f45; padding:10px 14px;'>\n          <p style='margin:0; font-size:1rem; font-weight:700; font-family:Fraunces,serif; color:#f8f9f0 !important;'>The Backyard Business</p>\n        </div>\n        <div style='padding:12px 14px;'>\n          <p style='margin:0 0 6px; font-size:0.82rem; color:#1a3b2a !important;'>A produce or herb stand, cut flowers, spring seedling starts, a themed salsa or tea garden, or a neighbor garden service.</p>\n          <p style='margin:8px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Skills</p>\n          <p style='margin:0 0 6px; font-size:0.8rem; color:#2e6b46 !important;'>Planning, budgeting, marketing, customer service.</p>\n          <p style='margin:6px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Payoff</p>\n          <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Real money earned and genuine entrepreneurship experience.</p>\n        </div>\n      </div>\n\n      <div style='flex:1; min-width:200px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:0; overflow:hidden;'>\n        <div style='background:#8f4f45; padding:10px 14px;'>\n          <p style='margin:0; font-size:1rem; font-weight:700; font-family:Fraunces,serif; color:#f8f9f0 !important;'>The Big Build Project</p>\n        </div>\n        <div style='padding:12px 14px;'>\n          <p style='margin:0 0 6px; font-size:0.82rem; color:#1a3b2a !important;'>Build a raised bed or trellis, install drip irrigation on a timer, run a crop-rotation plot, or set up compost and seed-saving systems.</p>\n          <p style='margin:8px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Skills</p>\n          <p style='margin:0 0 6px; font-size:0.8rem; color:#2e6b46 !important;'>Engineering, design, planning, follow-through.</p>\n          <p style='margin:6px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Payoff</p>\n          <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Something impressive, plus strong entries for science fairs and college or job applications.</p>\n        </div>\n      </div>\n\n      <div style='flex:1; min-width:200px; background:#ffffff; border:1px solid #dde2d8; border-radius:6px; padding:0; overflow:hidden;'>\n        <div style='background:#8f4f45; padding:10px 14px;'>\n          <p style='margin:0; font-size:1rem; font-weight:700; font-family:Fraunces,serif; color:#f8f9f0 !important;'>The Structured Program</p>\n        </div>\n        <div style='padding:12px 14px;'>\n          <p style='margin:0 0 6px; font-size:0.82rem; color:#1a3b2a !important;'>California 4-H through UC Cooperative Extension (open to youth up to age 18), plus school FFA, community plots, and farm volunteer days.</p>\n          <p style='margin:8px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Skills</p>\n          <p style='margin:0 0 6px; font-size:0.8rem; color:#2e6b46 !important;'>Goal-setting, record-keeping, teamwork.</p>\n          <p style='margin:6px 0 2px; font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Payoff</p>\n          <p style='margin:0; font-size:0.8rem; color:#2e6b46 !important;'>Community, county fair exhibits, recognition, and adult mentors outside the family.</p>\n        </div>\n      </div>\n\n    </div>\n\n    <p style='font-size:0.78rem; margin:1.1rem 0 0; color:#1a3b2a !important;'>Not every teen thrives gardening solo. Many do better with peers, deadlines, and something to work toward, which is exactly what organized programs provide.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-pumpkins-with-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Seed to Jack-o-Lantern: A Coastal California Timeline</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Plant in June, carve in October (pumpkins need 90 to 120 days)</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:stretch; margin-bottom:12px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 96px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>Late May to June</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Plant and Germinate</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Poke big seeds an inch deep into warm soil. Seedlings pop up in about a week.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:12px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 96px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>June to July</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Vining</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>The vine takes off, sprawling six to twenty feet across its corner.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:12px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 96px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>July</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Flowering</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Male flowers open first, then female flowers with a tiny pumpkin at the base.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:12px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 96px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>July to August</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Fruit Set</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Once pollinated, the baby pumpkin swells from a marble toward a carving size.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:12px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 96px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>August to September</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Sizing Up and Coloring</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>The fruit reaches full size and starts turning its mature color. Ease off on water.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; background:#1a3b2a; border-left:6px solid #c9a84c;'>\n      <div style='flex:0 0 96px; background:#245236; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#f8f9f0 !important;'>October</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#d2a097 !important;'>Harvest for Halloween</strong><br><span style='font-size:0.9rem; color:#f8f9f0 !important;'>Full color, hard rind, drying stem. Right on schedule to carve.</span></div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-pumpkins-with-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Male vs Female Pumpkin Flowers</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Only female flowers become pumpkins, and only after they are pollinated</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:16px;'>\n      <div style='flex:1 1 260px; background:#ffffff; border:2px solid #dde2d8; padding:16px;'>\n        <div style='background:#8f4f45; padding:8px; text-align:center; margin:-16px -16px 14px;'><span style='font-family:Fraunces,serif; font-size:1.1rem; font-weight:700; color:#f8f9f0 !important;'>Male Flower</span></div>\n        <p style='margin:0 0 10px; font-size:0.9rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Appears first,</strong> often for a week or two before any females show up.</p>\n        <ul style='margin:0; padding-left:20px; font-size:0.9rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Sits on a thin, plain stem</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>No baby pumpkin at its base</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Pollen-covered center (the stamen)</li>\n          <li style='color:#1a3b2a !important;'>Its only job is to supply pollen</li>\n        </ul>\n      </div>\n      <div style='flex:1 1 260px; background:#ffffff; border:2px solid #dde2d8; padding:16px;'>\n        <div style='background:#1a3b2a; padding:8px; text-align:center; margin:-16px -16px 14px;'><span style='font-family:Fraunces,serif; font-size:1.1rem; font-weight:700; color:#f8f9f0 !important;'>Female Flower</span></div>\n        <p style='margin:0 0 10px; font-size:0.9rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Appears later,</strong> with a tiny baby pumpkin already at its base.</p>\n        <ul style='margin:0; padding-left:20px; font-size:0.9rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Look for the little round pumpkin below the petals</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Becomes the fruit once pollinated</li>\n          <li style='color:#1a3b2a !important;'>If not pollinated, it yellows and shrivels</li>\n        </ul>\n      </div>\n    </div>\n    <div style='background:#dde2d8; padding:14px 16px; margin-top:16px;'>\n      <p style='margin:0 0 6px; font-family:Fraunces,serif; font-size:1rem; font-weight:700; color:#1a3b2a !important;'>Kid job: hand-pollinate</p>\n      <p style='margin:0; font-size:0.9rem; color:#1a3b2a !important;'>1. Pick a male flower.&nbsp;&nbsp;2. Peel back its petals.&nbsp;&nbsp;3. Gently brush its pollen-covered center onto the center of a female flower. The baby pumpkin at her base starts to swell.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-pumpkins-with-kids-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Is Your Pumpkin Ready to Pick?</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Check all four before you harvest (usually October for a June planting)</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border:2px solid #dde2d8; padding:14px 16px; margin-bottom:10px;'>\n      <span style='font-family:Fraunces,serif; font-weight:700; color:#8f4f45 !important;'>&#10003; Full color</span>\n      <span style='display:block; font-size:0.9rem; color:#1a3b2a !important;'>It has turned its mature color all over, with no pale or green patches.</span>\n    </div>\n    <div style='background:#ffffff; border:2px solid #dde2d8; padding:14px 16px; margin-bottom:10px;'>\n      <span style='font-family:Fraunces,serif; font-weight:700; color:#8f4f45 !important;'>&#10003; Hard rind (fingernail test)</span>\n      <span style='display:block; font-size:0.9rem; color:#1a3b2a !important;'>The skin is hard enough that a fingernail cannot easily pierce it.</span>\n    </div>\n    <div style='background:#ffffff; border:2px solid #dde2d8; padding:14px 16px; margin-bottom:10px;'>\n      <span style='font-family:Fraunces,serif; font-weight:700; color:#8f4f45 !important;'>&#10003; Dried, cracking stem</span>\n      <span style='display:block; font-size:0.9rem; color:#1a3b2a !important;'>The stem has started to dry out and crack instead of staying green.</span>\n    </div>\n    <div style='background:#ffffff; border:2px solid #dde2d8; padding:14px 16px; margin-bottom:16px;'>\n      <span style='font-family:Fraunces,serif; font-weight:700; color:#8f4f45 !important;'>&#10003; Hollow sound</span>\n      <span style='display:block; font-size:0.9rem; color:#1a3b2a !important;'>Give it a thump. A ripe pumpkin sounds hollow.</span>\n    </div>\n    <div style='background:#1a3b2a; padding:14px 18px; text-align:center;'>\n      <p style='margin:0; font-family:Fraunces,serif; font-size:1.05rem; font-weight:700; color:#d2a097 !important;'>Leave the stem on</p>\n      <p style='margin:6px 0 0; font-size:0.9rem; color:#f8f9f0 !important;'>Cut the stem with pruners, leaving three to four inches attached. Never carry a pumpkin by its stem, since a broken stem invites rot.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-strawberries-with-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Which Strawberry Type for Kids?</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>For coastal California families, a steady trickle usually beats one big flush</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:520px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:12px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>&nbsp;</th>\n            <th style='text-align:left; padding:12px; background:#8f4f45; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Day-Neutral<br><span style='font-size:0.8rem; font-weight:400; color:#f8f9f0 !important;'>Albion, Seascape</span></th>\n            <th style='text-align:left; padding:12px; background:#245236; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>June-Bearing<br><span style='font-size:0.8rem; font-weight:400; color:#f8f9f0 !important;'>Short-day types</span></th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Harvest timing</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>A little at a time over a long season (fruits roughly 40 to 90&deg;F, any day length)</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>One large crop in late spring</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Flavor</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Good, disease-resistant, forgiving for beginners</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Classic strawberry flavor in one big batch</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Best use</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Pick-and-eat all season, keeps kids checking the garden</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>A big harvest for jam all at once</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Best for kids?</td>\n            <td style='padding:12px; background:#8f4f45; color:#f8f9f0 !important; border:1px solid #dde2d8; font-weight:700;'>Yes, start here</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Great if you want jam, less engaging day to day</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-strawberries-with-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Containers vs Raised Beds for Kids</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Both work well in Santa Cruz County, the right pick depends on your space</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:520px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:12px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>&nbsp;</th>\n            <th style='text-align:left; padding:12px; background:#8f4f45; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Containers</th>\n            <th style='text-align:left; padding:12px; background:#245236; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Raised Beds</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Space</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Fits a patio, balcony, or small yard. A pot, window box, or hanging basket works</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Needs more room, suits families with a larger appetite for berries</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Slug &amp; snail protection</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Strong. Lifts berries up off damp ground, away from slugs and snails</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Good drainage helps, but berries still sit closer to slug territory</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Reach for small kids</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Easy, and a child can have their very own pot to tend</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Easy to reach without stepping on plants</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Berry yield</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>A handful of plants, smaller harvest but very manageable</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Room for more plants and a bigger overall harvest</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:14px 0 0; font-size:0.85rem; text-align:center; color:#8f4f45 !important;'>Either way: at least six hours of sun, rich soil, and consistent moisture.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["rainy-day-indoor-garden-projects-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Regrow It From Scraps</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Stand the cut base in an inch of water on a bright windowsill</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:520px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:12px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Scrap</th>\n            <th style='text-align:left; padding:12px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>What to expect</th>\n            <th style='text-align:left; padding:12px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Time to visible growth</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Green onion base</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>New green shoots you can snip and eat. The fastest and most rewarding</td>\n            <td style='padding:12px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>Within a few days</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Celery base</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>New leaves sprout from the center of the stump</td>\n            <td style='padding:12px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>About one to two weeks</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Romaine lettuce base</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Fresh leaves grow from the center of the base</td>\n            <td style='padding:12px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>About one to two weeks</td>\n          </tr>\n          <tr>\n            <td style='padding:12px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Carrot top</td>\n            <td style='padding:12px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Feathery greens (a new root will not grow, just the leafy top)</td>\n            <td style='padding:12px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>Within a few days</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:14px 0 0; font-size:0.85rem; text-align:center; color:#1a3b2a !important;'>Change the water every couple of days to keep it fresh and prevent rot.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["rainy-day-indoor-garden-projects-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Seed Jar: Watch a Seed Wake Up</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Rinse and drain two to three times a day, jar tilted so water drips out</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 92px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>Overnight</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Soak</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Put a spoonful of seeds (mung bean or alfalfa) in a clean jar, add water, cover with mesh, and soak. Then drain.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 92px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>Day 1</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Root</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>The seed swells and cracks, and a first little root pushes out.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 92px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>Day 3</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Shoot</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>A pale shoot rises and the jar fills with tangles of white sprouts.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:16px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 92px; background:#dde2d8; display:flex; align-items:center; justify-content:center; padding:10px; text-align:center;'><span style='font-family:Fraunces,serif; font-size:0.95rem; font-weight:700; color:#1a3b2a !important;'>Day 5</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>First leaves</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Tiny leaves open. Seeds fully sprout somewhere between day two and day six.</span></div>\n    </div>\n    <div style='background:#f8f9f0; border:3px solid #c9a84c; padding:14px 16px;'>\n      <p style='margin:0 0 6px; font-family:Fraunces,serif; font-size:1rem; font-weight:700; color:#c9a84c !important;'>&#9888; Food-safety note</p>\n      <p style='margin:0; font-size:0.9rem; color:#1a3b2a !important;'>The FDA warns that raw sprouts are a high-risk food, and rinsing does not remove bacteria. Young children, pregnant women, older adults, and anyone with a weakened immune system should not eat raw sprouts. Treat the jar as a <strong style='color:#8f4f45 !important;'>science observation</strong>, not a snack. For an edible windowsill crop, grow microgreens instead.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["rainy-day-indoor-garden-projects-kids-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Pick a Rainy-Day Project</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Match the project to your afternoon and your kids</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.88rem; min-width:580px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Project</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Time</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Mess</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Edible?</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Age range</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Kitchen scraps</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Growth in a few days</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, just a dish of water</td>\n            <td style='padding:11px; background:#ffffff; color:#245236 !important; border:1px solid #dde2d8; font-weight:700;'>Yes (green onion shoots)</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>All ages</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Microgreens</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>One to two weeks</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, a tidy tray</td>\n            <td style='padding:11px; background:#ffffff; color:#245236 !important; border:1px solid #dde2d8; font-weight:700;'>Yes, cut above the soil</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>All ages</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Seed jar</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Two to six days</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, just rinse and drain</td>\n            <td style='padding:11px; background:#ffffff; color:#962d28 !important; border:1px solid #dde2d8; font-weight:700;'>No, observe only (raw sprout risk)</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Older kids, supervised</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Terrarium</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Build in one afternoon</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Medium, soil and pebbles</td>\n            <td style='padding:11px; background:#ffffff; color:#962d28 !important; border:1px solid #dde2d8; font-weight:700;'>No, a living display</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>All ages</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["starting-a-school-garden-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>School Garden Launch Roadmap</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Start small and build a team before you buy a single seed</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>1</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Form a garden team</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>A lead teacher or two, a parent volunteer, and ideally a staff member. Shared ownership prevents burnout.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>2</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Get approval in writing</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Secure the principal's support and understand district rules on site use, water, liability, and food safety.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>3</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Define your purpose</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Science lessons, nutrition, a single grade, or the whole school? A clear goal shapes every later decision.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>4</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Choose a site with sun and water</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Vegetables need at least six hours of sun and a nearby water source. This is hard to fix later, so get it right first.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>5</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Build one bed or a few containers</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>One to three raised beds (about 4 by 8 feet) or large containers. A single successful bed builds momentum.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; background:#1a3b2a; border-left:6px solid #c9a84c;'>\n      <div style='flex:0 0 54px; background:#245236; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>6</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#d2a097 !important;'>Plan for summer before you plant</strong><br><span style='font-size:0.9rem; color:#f8f9f0 !important;'>The empty summer garden is the top reason school gardens fail. Solve watering and weeding coverage first.</span></div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
