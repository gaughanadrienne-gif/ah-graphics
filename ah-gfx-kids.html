window.AH_GRAPHICS["starting-a-school-garden-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Ways to Fund a California School Garden</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Most gardens combine small grants, donations, and community fundraising</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.86rem; min-width:600px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Source</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Type</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Typical amount</th>\n            <th style='text-align:left; padding:11px; background:#1a3b2a; color:#f8f9f0 !important; font-family:Fraunces,serif; border:1px solid #dde2d8;'>Where to apply</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Western Growers Foundation</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>School garden grant</td>\n            <td style='padding:11px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>Around $1,500 per school</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Western Growers Foundation (500+ CA and AZ gardens since 2002)</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Whole Kids Foundation</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>School garden grant</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Varies by cycle</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Whole Kids Foundation grant program</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>USDA Farm to School</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Federal grant</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Program-dependent</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>USDA Patrick Leahy Farm to School Grant Program (FNS)</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>CA Instructional School Garden Program</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>State grant</td>\n            <td style='padding:11px; background:#ffffff; color:#8f4f45 !important; border:1px solid #dde2d8; font-weight:700;'>Historically $2,500 to $5,000 per school</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Watch through your county office of education</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Local businesses</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>In-kind donations</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Soil, seeds, tools, lumber</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Ask nurseries, hardware stores, and lumber yards</td>\n          </tr>\n          <tr>\n            <td style='padding:11px; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #f8f9f0;'>Parents and community</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Fundraising</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Seeds and sustains a garden</td>\n            <td style='padding:11px; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Plant sales, produce stands, small events (older students can run these)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:14px 0 0; font-size:0.85rem; text-align:center; color:#1a3b2a !important;'>UC Master Gardeners and 4-H volunteers (5,900+ statewide per UC ANR) often assist school gardens at no cost.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["worm-bin-composting-with-kids-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Set Up a Worm Bin in 5 Steps</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Use an opaque 10 to 15 gallon tote, then hand the fun jobs to the kids</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>1</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Drill the holes</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>About 20 air holes near the top and a dozen drainage holes in the bottom. Set the bin on a tray.</span><br><span style='font-size:0.82rem; color:#245236 !important;'><strong style='color:#245236 !important;'>Kid job:</strong> mark the hole spots with a marker while an adult runs the drill.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>2</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Add damp bedding</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Fill about two-thirds with damp, wrung-out newspaper or cardboard strips, plus a handful of soil for grit.</span><br><span style='font-size:0.82rem; color:#245236 !important;'><strong style='color:#245236 !important;'>Kid job:</strong> tear, soak, and fluff the bedding (the part kids enjoy most).</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>3</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>Add the worms</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Set one pound of red wigglers (about 1,000 worms) on top and let them burrow down away from the light.</span><br><span style='font-size:0.82rem; color:#245236 !important;'><strong style='color:#245236 !important;'>Kid job:</strong> count out a handful and watch them dig in.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; margin-bottom:10px; background:#ffffff; border-left:6px solid #8f4f45;'>\n      <div style='flex:0 0 54px; background:#8f4f45; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>4</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#8f4f45 !important;'>First feeding</strong><br><span style='font-size:0.9rem; color:#1a3b2a !important;'>Add a small amount of food scraps in one corner only. Do not overdo it.</span><br><span style='font-size:0.82rem; color:#245236 !important;'><strong style='color:#245236 !important;'>Kid job:</strong> chop soft scraps small with a butter knife and tuck them in.</span></div>\n    </div>\n    <div style='display:flex; align-items:stretch; background:#1a3b2a; border-left:6px solid #c9a84c;'>\n      <div style='flex:0 0 54px; background:#245236; display:flex; align-items:center; justify-content:center;'><span style='font-family:Fraunces,serif; font-size:1.4rem; font-weight:700; color:#f8f9f0 !important;'>5</span></div>\n      <div style='flex:1; padding:12px 16px;'><strong style='color:#d2a097 !important;'>Cover and wait</strong><br><span style='font-size:0.9rem; color:#f8f9f0 !important;'>Cover with a few sheets of damp newspaper, put the lid on, and wait about a week before feeding again.</span><br><span style='font-size:0.82rem; color:#d2a097 !important;'><strong style='color:#d2a097 !important;'>Kid job:</strong> lay the newspaper blanket on top.</span></div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["worm-bin-composting-with-kids-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>What to Feed the Worms (and What to Skip)</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>The golden rule: underfeed rather than overfeed, and always bury the food</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:16px;'>\n      <div style='flex:1 1 260px; background:#ffffff; border:2px solid #dde2d8; padding:16px;'>\n        <div style='background:#1a3b2a; padding:9px; text-align:center; margin:-16px -16px 14px;'><span style='font-family:Fraunces,serif; font-size:1.05rem; font-weight:700; color:#f8f9f0 !important;'>&#10003; Worms love it</span></div>\n        <ul style='margin:0; padding-left:20px; font-size:0.9rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Apple cores and banana peels</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Melon rinds and cucumber ends</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Lettuce and carrot peels</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Leftover cooked vegetables</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Coffee grounds and tea leaves</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Crushed eggshells</li>\n          <li style='color:#1a3b2a !important;'>The damp paper bedding itself</li>\n        </ul>\n      </div>\n      <div style='flex:1 1 260px; background:#ffffff; border:2px solid #dde2d8; padding:16px;'>\n        <div style='background:#962d28; padding:9px; text-align:center; margin:-16px -16px 14px;'><span style='font-family:Fraunces,serif; font-size:1.05rem; font-weight:700; color:#f8f9f0 !important;'>&#10007; Skip it</span></div>\n        <ul style='margin:0; padding-left:20px; font-size:0.9rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Meat and fish</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Dairy</li>\n          <li style='margin-bottom:6px; color:#1a3b2a !important;'>Oily or greasy food</li>\n          <li style='margin-bottom:10px; color:#1a3b2a !important;'>Pet waste</li>\n        </ul>\n        <p style='margin:0; padding-top:10px; border-top:1px solid #dde2d8; font-size:0.86rem; color:#962d28 !important;'><strong style='color:#962d28 !important;'>Go easy on:</strong> citrus, onion, and garlic. Large amounts make the bin too acidic.</p>\n      </div>\n    </div>\n    <p style='margin:16px 0 0; font-size:0.85rem; text-align:center; color:#8f4f45 !important;'>Chop scraps small and bury them under the bedding so the bin stays clean and pest-free.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
</script>
