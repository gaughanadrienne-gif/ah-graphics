window.AH_GRAPHICS["heat-wave-garden-survival-guide-california-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">One Heat Wave, Three Different Gardens</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">The same forecast lands very differently across Santa Cruz County</p></div><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 760px;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Zone</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">What the heat wave looks like</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">The main risk</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Do this first</th></tr></thead><tbody><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Coastal fog belt</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Santa Cruz, Live Oak, Capitola, Aptos, Davenport. Lowest absolute temperatures, highest relative shock. Plants have almost no acclimation.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Leaf scorch and fruit sunburn on plants that looked healthy a week earlier. Damage is done in the first two afternoons.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Shade cloth over tomatoes and peppers before the fog breaks.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Inland valleys</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Watsonville and the Pajaro Valley, Scotts Valley, parts of Soquel. Several degrees hotter on the same afternoon, with a little more acclimation.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Genuinely damaging temperatures, more often. Scotts Valley runs hot by day and cold at night.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Deep water the day before, then water early each morning.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">San Lorenzo Valley redwoods</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Felton, Ben Lomond, Boulder Creek, Brookdale. The canopy buffers air temperature, so the peak reading is often lower than Scotts Valley.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Not sunburn. Drought. Redwood duff is dry and root-competitive, and beds can go from moist to bone dry in 36 hours.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Check soil moisture daily, and mulch deeply.</td></tr></tbody></table></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">Heat is relative. UC and CDPH define extreme heat against what is normal for your area, which is why a 95 degree day on the coast can outrank a 100 degree day inland.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["heat-wave-garden-survival-guide-california-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Heat Wave Action Plan</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">What to do before, during, and after</p></div><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 820px;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Task</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Before (1 to 2 days out)</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">During the heat</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">After it passes</th></tr></thead><tbody><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Watering</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Water deeply the day before. A hydrated plant handles heat far better than one you rescue mid-wave.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Water early in the morning. Check containers daily, sometimes twice.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Return to a normal deep, infrequent schedule. Do not keep soil soggy.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Shade</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Get shade cloth up over tomatoes, peppers, and anything with exposed fruit.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Leave it up. Cover the afternoon, not the morning.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Remove it once normal temperatures return so plants get full light again.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Containers</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Move pots into afternoon shade. Group them together.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Check moisture daily. Small pots may need water twice.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Move back gradually rather than all at once.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Harvest</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Pick anything close to ripe. Fruit on the plant is fruit at risk.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Harvest in the early morning, before the day heats up.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Assess what set fruit and what dropped flowers.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Fertilizer</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Stop. Do not push new growth into a heat wave.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">None.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Wait until the plant is actively growing again.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Pruning</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Leave the canopy alone. Those leaves are shading fruit.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">None.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Remove clearly dead tissue only, once you can tell what is dead.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Planting</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Postpone transplanting. A new root system cannot keep up.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">None.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Resume once night temperatures settle.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Soil</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Top up mulch to cover bare soil. Pull it back an inch from stems.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Leave it in place. It is doing the work.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Check depth again. Mulch settles and breaks down.</td></tr></tbody></table></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">The work happens before the heat arrives. Once it is 98 degrees, your options are already narrow.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["heat-wave-garden-survival-guide-california-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Is It Wilting, or Is It Actually Thirsty?</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">The question that causes the most unnecessary overwatering in July</p></div><div style=\"display: flex; flex-wrap: wrap; gap: 0; background-color: #ffffff !important;\"><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #1a3b2a; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Probably normal afternoon wilt</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Perks back up by evening or the next morning</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Soil is still moist two to three inches down</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Big-leaved plants (squash, cucumber, melon) droop while their smaller-leaved neighbors do not</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">No browning or crisping at the leaf margins</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Do nothing.</strong> This is a defense mechanism, not a distress signal.</li></ul></div><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #962d28; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Real water stress</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Still wilted the next morning after a cool night</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Soil is dry two to three inches down</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Leaf margins and tips are browning or crisp</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">The whole plant looks dull or gray-green, not just droopy</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">New growth and flower buds are dropping</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Water deeply</strong>, at the root zone, in the early morning.</li></ul></div></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">The most reliable tool you own is your finger. Push it past the mulch and past the top inch. If it is moist down there, the plant is managing.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["heat-wave-garden-survival-guide-california-g4"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Which Shade Cloth Percentage Do You Need?</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Shade cloth is rated by the percentage of light it blocks</p></div><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 620px;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Crop</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: center; font-weight: 600; font-size: 0.8rem;\">Density</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Why</th></tr></thead><tbody><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Tomatoes, peppers, and other sun lovers</td><td style=\"padding: 10px 12px; text-align: center; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">20 to 40 percent</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Enough to stop fruit sunburn without starving a plant that wants full sun.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">General home garden default</td><td style=\"padding: 10px 12px; text-align: center; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">About 40 percent</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">UC Master Gardeners in Stanislaus County recommend 40 percent for home gardens and say anything higher is not necessary.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 700; color: #1a3b2a !important; vertical-align: top;\">Lettuce, spinach, seedlings, cool-season crops</td><td style=\"padding: 10px 12px; text-align: center; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">50 to 60 percent</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Delicate and cool-season plants need more protection than fruiting crops.</td></tr></tbody></table></div><div style=\"background-color: #ffffff !important; padding: 18px 22px;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">The install matters as much as the percentage</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.85rem; line-height: 1.6; color: #1c3c2c !important;\"><li style=\"color: #1c3c2c !important;\"><strong>Cover the afternoon, not the morning.</strong> Morning sun is not the problem.</li><li style=\"color: #1c3c2c !important;\"><strong>Keep it above the canopy.</strong> For tall tomatoes that can mean eight feet. Cloth resting on leaves traps heat against them.</li><li style=\"color: #1c3c2c !important;\"><strong>It does not need to reach the ground.</strong> Open sides help airflow.</li><li style=\"color: #1c3c2c !important;\"><strong>Anchor it.</strong> Heat waves here arrive with offshore wind.</li></ul></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">Row cover is not a substitute. It reduces light but traps heat, which is the opposite of what you want. Source: UC Master Gardeners, Contra Costa and Stanislaus counties.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["fall-vegetable-planting-guide-santa-cruz-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Count Back From Daylight, Not From Frost</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">On this coast, shrinking light ends the season before cold does</p></div><div style=\"background-color: #ffffff !important; padding: 20px 22px;\"><ol style=\"margin: 0 0 18px 0; padding-left: 20px; font-size: 0.9rem; line-height: 1.65; color: #1c3c2c !important;\"><li style=\"color: #1c3c2c !important; margin-bottom: 6px;\"><strong>Set the target.</strong> Your crop should be at or near full size by <strong>mid-November</strong>, when day length drops through 10 hours.</li><li style=\"color: #1c3c2c !important; margin-bottom: 6px;\"><strong>Take days to maturity</strong> from your seed packet or plant tag.</li><li style=\"color: #1c3c2c !important; margin-bottom: 6px;\"><strong>Add two to four weeks</strong> of padding. Growth slows as light and temperature decline, so a packet's 60 days is a summer number.</li><li style=\"color: #1c3c2c !important; margin-bottom: 6px;\"><strong>Add seed-to-transplant time</strong> if you are starting from seed rather than buying a start.</li><li style=\"color: #1c3c2c !important;\"><strong>Count backward from mid-November.</strong> That is your sow date.</li></ol></div><div style=\"display: flex; flex-wrap: wrap; gap: 0; background-color: #ffffff !important;\"><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #1a3b2a; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Worked example: broccoli</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Target: full size by mid-November</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Days to maturity: about 60 to 70 from transplant</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Fall padding: add 2 to 4 weeks</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Seed to transplant: about 6 weeks (UC Alameda)</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Start seed around August 1, transplant mid-September.</strong></li></ul></div><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #8f4f45; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Worked example: arugula</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Target: cutting size, not full size</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Days to maturity: roughly 30 to 40, direct sown</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Fall padding: add 2 to 4 weeks</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\">Seed to transplant: none, it is direct sown</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Sow in succession from September into October.</strong></li></ul></div></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">Day length in Santa Cruz falls from 14 hours 26 minutes on July 15 to 10 hours 11 minutes by November 15. Plants that are still small in November sit and wait for February. Source: U.S. Naval Observatory.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["fall-vegetable-planting-guide-santa-cruz-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Fall Planting Windows for Santa Cruz County</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Six crop families, and when each one goes in</p></div><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 880px;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Crop</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Start indoors</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Direct sow</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Transplant out</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Notes</th></tr></thead><tbody><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Brassicas</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">broccoli, cauliflower, cabbage, kale, Brussels sprouts, collards, bok choy</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Mid-July to mid-August</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Not preferred</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Mid-August to late September</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Cauliflower is the fussy end. Brussels sprouts need a long cool season, so start in July.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Leafy greens</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">lettuce, spinach, chard, arugula, mustards, Asian greens</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">July to August, in shade</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">September onward</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Anytime through fall</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Lettuce fails above 85 degrees soil, spinach above 75. Hot soil, not bad seed, is why they do not come up.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Root crops</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">carrots, beets, radishes, turnips, parsnips</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">Never</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Carrots and beets August to late September. Radishes and turnips August to October.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">Never</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Direct sow only. A transplanted carrot forks. Keep the seedbed evenly moist to germinate.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Alliums</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">garlic, bulb onions, leeks, green onions</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Onions from seed, about 6 months out</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Garlic in October and November</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Leeks and green onions, late summer through fall</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Choose intermediate-day onions (12 to 14 hours). A long-day variety bred for Oregon will never bulb here.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Peas and favas</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">snap, snow, shelling, fava</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Not needed</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Peas late August to October. Favas October and November.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Not needed</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Peas are a fall crop here, not a spring one. They germinate best at 65 to 75 degrees soil.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Cover crops</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">vetch, bell beans, field peas, clovers</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">Never</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">October to early November</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">Never</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Timed to the start of the rains. Buy legume inoculant when you buy the seed.</td></tr></tbody></table></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">Windows are for the coastal fog belt and Pajaro Valley. Plant on the early end in the San Lorenzo Valley. Source: UC Master Gardener Program.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["fall-vegetable-planting-guide-santa-cruz-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Start Indoors, Direct Sow, or Buy Transplants?</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Each fall crop has a method that works and one that wastes your time</p></div><div style=\"display: flex; flex-wrap: wrap; gap: 0; background-color: #ffffff !important;\"><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #1a3b2a; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Start indoors (or in a shaded flat)</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Brassicas:</strong> broccoli, cauliflower, cabbage, Brussels sprouts</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Lettuce and spinach in warm zones:</strong> late-summer soil is too hot to germinate them in the ground</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Why:</strong> you control soil temperature and moisture at the one stage that decides success, and you protect seedlings from slugs and birds</li></ul></div><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #8f4f45; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Direct sow</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>All root crops:</strong> carrots, beets, radishes, turnips, parsnips</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Peas and favas</strong></li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Arugula, mustards, Asian greens</strong> from September</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Garlic</strong> and <strong>cover crops</strong></li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Why:</strong> these resent transplanting. A moved carrot forks, and peas do not appreciate it either.</li></ul></div><div style=\"flex: 1 1 240px; min-width: 240px; padding: 18px 20px; border-top: 4px solid #c9a84c; border-right: 1px solid #dde2d8;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px 0; color: #1a3b2a !important;\">Buy transplants</h3><ul style=\"margin: 0; padding-left: 18px; font-size: 0.84rem; line-height: 1.5;\"><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Brassicas</strong>, if you missed the mid-July to mid-August seeding window</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Any crop</strong> when you are starting late and the light budget is running out</li><li style=\"margin-bottom: 7px; color: #1c3c2c !important;\"><strong>Why:</strong> a transplant buys back four to six weeks, which in a fall garden is the difference between a harvest and a plant that sits until February</li></ul></div></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">The fall garden is less forgiving of a late start than the spring garden, because you cannot get the daylight back.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";

window.AH_GRAPHICS["fall-vegetable-planting-guide-santa-cruz-g4"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\"><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\"><h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Your Microclimate Changes the Dates</h2><p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">UC is explicit that regional planting dates are approximate. In this county, that variation is the whole story.</p></div><div style=\"overflow-x: auto;\"><table style=\"width: 100%; border-collapse: collapse; min-width: 900px;\"><thead><tr><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Zone</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Brassica transplants</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Greens, direct sown</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Frost risk</th><th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px; text-align: left; font-weight: 600; font-size: 0.8rem;\">Biggest limiting factor</th></tr></thead><tbody><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Coastal fog belt</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">Santa Cruz, Live Oak, Capitola, Aptos</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Late end of the window (September)</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Easiest in the county. Cool soil germinates lettuce and spinach early.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Low. An occasional nuisance, not a season-ender.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Slugs and snails. Pressure here is severe.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Pajaro Valley and Watsonville</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">cool nights, good sun, deep soils</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Standard window (mid-August to late September)</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Standard. Follow the guide.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Possible on open valley floor on clear cold nights.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Nothing much. This is the county's cool-season powerhouse.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">San Lorenzo Valley and redwood canyons</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">Felton, Ben Lomond, Boulder Creek</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Early end of the window (mid to late August)</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Early. Sow before the light goes.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #962d28 !important; vertical-align: top;\">Highest. Cold air drains in at night, so frost arrives earlier and hits harder.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Light. Under redwoods, heading brassicas may never finish. Grow greens and roots in your sunniest opening.</td></tr><tr style=\"border-bottom: 1px solid #dde2d8; background-color: #f8f9f0 !important;\"><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; color: #1a3b2a !important; vertical-align: top;\"><strong style=\"color: #1a3b2a !important;\">Warm inland pockets and banana belts</strong><div style=\"font-size: 0.78rem; color: #4a4a46 !important; margin-top: 3px;\">Scotts Valley, parts of Soquel, ridge tops</div></td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Standard, and they grow fast here in the shoulder season</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Wait for September, or start in flats in the shade.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #1c3c2c !important; vertical-align: top;\">Ridge tops above the fog also sit above the coldest air on winter nights.</td><td style=\"padding: 10px 12px; text-align: left; font-size: 0.85rem; font-weight: 400; color: #8f4f45 !important; vertical-align: top;\">Hot soil in late summer stops lettuce and spinach cold.</td></tr></tbody></table></div><div style=\"background-color: #dde2d8 !important; padding: 12px 15px; font-size: 0.8rem; color: #1c3c2c !important; text-align: center;\">Not sure which one you are in? A map will not always tell you. Walk your own garden at 7am and 3pm.</div><div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div></div>";
