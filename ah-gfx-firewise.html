window.AH_GRAPHICS["preparing-your-vegetable-garden-for-fire-season-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;;background:#dde2d8;color:#1a3b2a;\">\n<div style=\"background-color: #dde2d8; color: #1a3b2a; padding: 20px 25px; text-align: center;\">\n<h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #1a3b2a;\">Fire Season Garden Prep Checklist</h2>\n<p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #1a3b2a;\">Prepare before dangerous conditions; revisit as crops and weather change</p>\n</div>\n<div style=\"padding: 25px; background-color: #dde2d8;\">\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;\">\n<div style=\"background-color: #dde2d8; border: 1px solid #dde2d8; padding: 20px;\">\n<h3 style=\"font-size: 1rem; font-weight: 700; color: #1a3b2a; margin: 0 0 14px; border-bottom: 2px solid #dde2d8; padding-bottom: 10px;\">Fuel Reduction</h3>\n<ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a; line-height: 2;\">\n<li>Clear finished crops and dead material</li>\n<li>Manage cover-crop residue and bolted greens</li>\n<li>Clean debris beneath supports</li>\n<li>Arrange disposal without creating another pile</li>\n<li>Get qualified advice for hazardous tree work</li>\n</ul>\n</div>\n<div style=\"background-color: #dde2d8; border: 1px solid #dde2d8; padding: 20px;\">\n<h3 style=\"font-size: 1rem; font-weight: 700; color: #1a3b2a; margin: 0 0 14px; border-bottom: 2px solid #dde2d8; padding-bottom: 10px;\">Irrigation</h3>\n<ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a; line-height: 2;\">\n<li>Check drip lines and emitters</li>\n<li>Repair damaged or clogged components</li>\n<li>Review timer settings and power needs</li>\n<li>Match watering to crops and actual conditions</li>\n<li>No extra property wetting during Red Flags</li>\n</ul>\n</div>\n<div style=\"background-color: #dde2d8; border: 1px solid #dde2d8; padding: 20px;\">\n<h3 style=\"font-size: 1rem; font-weight: 700; color: #1a3b2a; margin: 0 0 14px; border-bottom: 2px solid #dde2d8; padding-bottom: 10px;\">Hardscape and Structures</h3>\n<ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a; line-height: 2;\">\n<li>Assess combustible fence connections</li>\n<li>Clear accumulated material by fences</li>\n<li>Assess compost siting; do not rely on a zone label</li>\n<li>Keep the immediate five feet noncombustible</li>\n<li>Keep decks and exits clear in ordinary conditions</li>\n</ul>\n</div>\n</div>\n<p style=\"font-size: 0.75rem; color: #1a3b2a; margin: 16px 0 0; text-align: center;\">Sources: CAL FIRE and UC ANR | Never delay evacuation for garden work</p>\n</div>\n<div style=\"background-color: #dde2d8; color: #1a3b2a; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div><p style=\"color:#1a3b2a;background:#f8f9f0;padding:12px;font-size:14px;\">The plant-free first five feet shown here is conservative preparation guidance. Confirm applicable vegetation rules and deadlines with your fire authority.</p>";
window.AH_GRAPHICS["summer-garden-irrigation-for-fire-safety-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Summer Irrigation for Fire Safety</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Keep plants hydrated and fire-resistant through Santa Cruz dry season</p>\n    </div>\n    <div style=\"padding: 0; background-color: #f8f9f0 !important; overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; font-size: 0.85rem; min-width: 500px;\">\n            <thead>\n                <tr style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important;\">\n                    <th style=\"padding: 12px 14px; text-align: left; font-weight: 600; color: #f8f9f0 !important;\">Garden Type</th>\n                    <th style=\"padding: 12px 14px; text-align: center; font-weight: 600; color: #f8f9f0 !important;\">Water Depth</th>\n                    <th style=\"padding: 12px 14px; text-align: center; font-weight: 600; color: #f8f9f0 !important;\">Frequency</th>\n                    <th style=\"padding: 12px 14px; text-align: center; font-weight: 600; color: #f8f9f0 !important;\">Best Method</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr style=\"background-color: #fff !important;\">\n                    <td style=\"padding: 12px 14px; font-weight: 600; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Raised Beds (veggies)</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">6-12 inches</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Every 2-3 days</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Drip irrigation</td>\n                </tr>\n                <tr style=\"background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 12px 14px; font-weight: 600; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">In-Ground Beds</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">8-12 inches</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Every 3-5 days</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Drip or soaker hose</td>\n                </tr>\n                <tr style=\"background-color: #fff !important;\">\n                    <td style=\"padding: 12px 14px; font-weight: 600; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Fruit Trees</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">18-24 inches</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Weekly (deep soak)</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Basin or drip ring</td>\n                </tr>\n                <tr style=\"background-color: #f8f9f0 !important;\">\n                    <td style=\"padding: 12px 14px; font-weight: 600; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Groundcovers (Zone 1)</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">4-6 inches</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Every 5-7 days</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important; border-bottom: 1px solid #dde2d8;\">Low-volume sprinkler</td>\n                </tr>\n                <tr style=\"background-color: #fff !important;\">\n                    <td style=\"padding: 12px 14px; font-weight: 600; color: #1a3b2a !important;\">Containers</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important;\">Until drains</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important;\">Daily in heat</td>\n                    <td style=\"padding: 12px 14px; text-align: center; color: #1a3b2a !important;\">Hand water or drip</td>\n                </tr>\n            </tbody>\n        </table>\n    </div>\n    <div style=\"padding: 12px 25px; background-color: #dde2d8 !important;\">\n        <p style=\"font-size: 0.8rem; color: #1a3b2a !important; margin: 0; line-height: 1.6;\"><strong>Fire safety tip:</strong> Water in early morning (before 10 AM). This keeps plants hydrated through peak fire danger hours and reduces evaporation loss by up to 30%.</p>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com | Source: UC ANR, CAL FIRE Zone 1 Guidelines</div>\n</div>";
window.AH_GRAPHICS["summer-garden-irrigation-for-fire-safety-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">When the Power Goes Out: Irrigation Backup Plan</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Keep your garden watered during PSPS and Red Flag events</p>\n    </div>\n    <div style=\"padding: 25px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;\">Before Shutoff</div>\n                <h3 style=\"font-size: 0.95rem; font-weight: 700; color: #1a3b2a !important; margin: 0 0 12px;\">Prepare</h3>\n                <ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a !important; line-height: 1.8;\">\n                    <li>&#10003; Deep-water all beds the day before</li>\n                    <li>&#10003; Fill storage containers (5-gal buckets)</li>\n                    <li>&#10003; Add extra mulch to retain moisture</li>\n                    <li>&#10003; Water fruit trees deeply</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;\">During Shutoff</div>\n                <h3 style=\"font-size: 0.95rem; font-weight: 700; color: #1a3b2a !important; margin: 0 0 12px;\">Maintain</h3>\n                <ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a !important; line-height: 1.8;\">\n                    <li>&#10003; Hand water priority crops (tomatoes, peppers)</li>\n                    <li>&#10003; Use stored water for containers first</li>\n                    <li>&#10003; Gravity-fed systems work without power</li>\n                    <li>&#10003; Battery backup timers keep drip running</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;\">After Power Returns</div>\n                <h3 style=\"font-size: 0.95rem; font-weight: 700; color: #1a3b2a !important; margin: 0 0 12px;\">Recover</h3>\n                <ul style=\"list-style: none; padding: 0; margin: 0; font-size: 0.85rem; color: #1a3b2a !important; line-height: 1.8;\">\n                    <li>&#10003; Run full irrigation cycle immediately</li>\n                    <li>&#10003; Check for wilted or stressed plants</li>\n                    <li>&#10003; Reset timers if they lost programming</li>\n                    <li>&#10003; Refill backup water storage</li>\n                </ul>\n            </div>\n        </div>\n        <p style=\"font-size: 0.75rem; color: #657665 !important; margin: 16px 0 0; text-align: center;\">PG&E PSPS events in Santa Cruz County typically last 24-48 hours during high fire danger</p>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

window.AH_GRAPHICS["fire-wise-gardening-with-california-natives-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:14px;font-family:Montserrat,sans-serif;line-height:1.6\"><div style=\"overflow-x:auto;color:#1a3b2a!important\"><div class=\"ah-toolkit-callout\" style=\"color:#1a3b2a!important;\"><div style=\"color:#1a3b2a!important;\"><p style=\"color:#1a3b2a!important;\">Free California Gardening Resources</p></div><div style=\"color:#1a3b2a!important;\"><p style=\"color:#1a3b2a!important;\">Browse the Garden Toolkit for available California gardening guides, planting resources and seasonal checklists.</p><p style=\"color:#1a3b2a!important;\">Choose the resources that fit your garden and the task you are planning.</p><div style=\"color:#1a3b2a!important;\"><a href=\"https://ambitiousharvest.com/your-garden-toolkit\" rel=\"noopener\" style=\"color:#1a3b2a!important;\" target=\"_blank\">Browse the Free Toolkit</a></div></div><div style=\"color:#1a3b2a!important;\"><span style=\"color:#1a3b2a!important;\">ambitiousharvest.com</span></div></div></div></section>";

window.AH_GRAPHICS["what-not-to-plant-near-your-home-fire-hazard-plants-to-avoid-g1"] = "<div class=\"ah-toolkit-callout\" style=\"font-family:Montserrat,Arial,sans-serif;background-color: #dde2d8;border:1px solid #dde2d8;border-radius:6px;padding:0;margin:2em auto;width:100%;box-sizing:border-box;;background:#dde2d8;color:#1a3b2a;\"><div style=\"background-color: #dde2d8;color: #1a3b2a;padding:14px 24px;border-radius:6px 6px 0 0;\"><p style=\"font-size:18px;font-weight:700;color: #1a3b2a;margin:0;line-height:1.3;\">Free California Gardening Resources</p></div><div style=\"padding:24px;\"><p style=\"font-size:15px;color: #1a3b2a;margin:0 0 8px 0;line-height:1.6;\">Find the current collection of California gardening guides in Your Garden Toolkit. Use them for everyday planning alongside current fire-agency guidance.</p><div style=\"margin-bottom:8px;\"><a href=\"https://ambitiousharvest.com/your-garden-toolkit\" rel=\"noopener\" style=\"display:inline-block;background-color: #dde2d8;color: #1a3b2a;text-decoration:none;padding:12px 28px;border-radius:4px;font-size:14px;font-weight:600;letter-spacing:0.5px;\" target=\"_blank\">Browse the Free Toolkit</a></div></div><div style=\"padding:8px 24px;border-top:1px solid #dde2d8;text-align:right;\"><span style=\"font-size:11px;color: #1a3b2a;font-weight:500;\">ambitiousharvest.com</span></div></div>";

window.AH_GRAPHICS["10-fire-resistant-plants-for-santa-cruz-gardens-g1"] = "<style>.ah-fire-review-card{font-family:Montserrat,sans-serif;background:#dde2d8;padding:24px;border-radius:12px;margin:24px 0}.ah-fire-review-card h3{font-family:Fraunces,serif;color:#1a3b2a!important;margin:0 0 18px}.ah-fire-review-card dl{margin:0;background:#f8f9f0;padding:18px;border-radius:8px}.ah-fire-review-card dt{color:#8f4f45!important;font-weight:700;margin-top:12px}.ah-fire-review-card dt:first-child{margin-top:0}.ah-fire-review-card dd{color:#1a3b2a!important;margin:5px 0 0;line-height:1.6}.ah-fire-review-card footer{color:#1a3b2a!important;font-size:12px;margin-top:16px;line-height:1.7}.ah-fire-review-card a{color:#1a3b2a!important}@media(max-width:480px){.ah-fire-review-card{padding:16px}.ah-fire-review-card dl{padding:14px}}</style><section class=\"ah-fire-review-card\"><h3>Look beyond the plant label</h3><dl><dt>Inside the plant</dt><dd>Check for trapped dead leaves and stems.</dd><dt>At maturity</dt><dd>Allow for the full spread, height, and maintenance access.</dd><dt>At the site</dt><dd>A native or drought-tolerant label is not a fire rating.</dd></dl><footer><a href=\"https://ucanr.edu/program/uc-anr-fire-network/right-plant-right-place-right-care\" target=\"_blank\" rel=\"noopener\">Source guidance</a><br>ambitiousharvest.com</footer></section>";
window.AH_GRAPHICS["10-fire-resistant-plants-for-santa-cruz-gardens-g2"] = "<style>.ah-fire-review-card{font-family:Montserrat,sans-serif;background:#dde2d8;padding:24px;border-radius:12px;margin:24px 0}.ah-fire-review-card h3{font-family:Fraunces,serif;color:#1a3b2a!important;margin:0 0 18px}.ah-fire-review-card dl{margin:0;background:#f8f9f0;padding:18px;border-radius:8px}.ah-fire-review-card dt{color:#8f4f45!important;font-weight:700;margin-top:12px}.ah-fire-review-card dt:first-child{margin-top:0}.ah-fire-review-card dd{color:#1a3b2a!important;margin:5px 0 0;line-height:1.6}.ah-fire-review-card footer{color:#1a3b2a!important;font-size:12px;margin-top:16px;line-height:1.7}.ah-fire-review-card a{color:#1a3b2a!important}@media(max-width:480px){.ah-fire-review-card{padding:16px}.ah-fire-review-card dl{padding:14px}}</style><section class=\"ah-fire-review-card\"><h3>Start beside the house</h3><dl><dt>First 5 feet</dt><dd>UC recommends keeping vegetation and combustible material away from structures in this first five feet.</dd><dt>Farther out</dt><dd>Use current defensible-space spacing and maintenance guidance.</dd><dt>Requirements</dt><dd>Check the local rules for your property. Advice and legal requirements are not interchangeable.</dd></dl><footer><a href=\"https://www.readyforwildfire.org/prepare-for-wildfire/defensible-space/\" target=\"_blank\" rel=\"noopener\">CAL FIRE defensible-space guidance</a> <span> | </span><a href=\"https://ucanr.edu/program/uc-anr-fire-network/right-plant-right-place-right-care\" target=\"_blank\" rel=\"noopener\">UC plant placement guidance</a><br>ambitiousharvest.com</footer></section>";
window.AH_GRAPHICS["10-fire-resistant-plants-for-santa-cruz-gardens-g3"] = "<style>.ah-fire-review-card{font-family:Montserrat,sans-serif;background:#dde2d8;padding:24px;border-radius:12px;margin:24px 0}.ah-fire-review-card h3{font-family:Fraunces,serif;color:#1a3b2a!important;margin:0 0 18px}.ah-fire-review-card dl{margin:0;background:#f8f9f0;padding:18px;border-radius:8px}.ah-fire-review-card dt{color:#8f4f45!important;font-weight:700;margin-top:12px}.ah-fire-review-card dt:first-child{margin-top:0}.ah-fire-review-card dd{color:#1a3b2a!important;margin:5px 0 0;line-height:1.6}.ah-fire-review-card footer{color:#1a3b2a!important;font-size:12px;margin-top:16px;line-height:1.7}.ah-fire-review-card a{color:#1a3b2a!important}@media(max-width:480px){.ah-fire-review-card{padding:16px}.ah-fire-review-card dl{padding:14px}}</style><section class=\"ah-fire-review-card\"><h3>A maintenance check you can repeat</h3><dl><dt>Under the green surface</dt><dd>Look for dry thatch in succulent mats and ground covers.</dd><dt>In woody growth</dt><dd>Inspect older lavender and dense shrubs for dead material.</dd><dt>Along the route to the house</dt><dd>Look at plants together with fences, decks, and stored materials.</dd></dl><footer><a href=\"https://www.readyforwildfire.org/prepare-for-wildfire/fire-smart-landscaping/\" target=\"_blank\" rel=\"noopener\">Source guidance</a><br>ambitiousharvest.com</footer></section>";
window.AH_GRAPHICS["10-fire-resistant-plants-for-santa-cruz-gardens-g4"] = "<style>.ah-fire-review-card{font-family:Montserrat,sans-serif;background:#dde2d8;padding:24px;border-radius:12px;margin:24px 0}.ah-fire-review-card h3{font-family:Fraunces,serif;color:#1a3b2a!important;margin:0 0 18px}.ah-fire-review-card dl{margin:0;background:#f8f9f0;padding:18px;border-radius:8px}.ah-fire-review-card dt{color:#8f4f45!important;font-weight:700;margin-top:12px}.ah-fire-review-card dt:first-child{margin-top:0}.ah-fire-review-card dd{color:#1a3b2a!important;margin:5px 0 0;line-height:1.6}.ah-fire-review-card footer{color:#1a3b2a!important;font-size:12px;margin-top:16px;line-height:1.7}.ah-fire-review-card a{color:#1a3b2a!important}@media(max-width:480px){.ah-fire-review-card{padding:16px}.ah-fire-review-card dl{padding:14px}}</style><section class=\"ah-fire-review-card\"><h3>Ice plant needs an exact name</h3><dl><dt>Carpobrotus edulis</dt><dd>Cal-IPC rates highway iceplant High for invasiveness.</dd><dt>For a new planting</dt><dd>Choose an alternative rather than adding this species to a coastal garden.</dd><dt>For an existing mat</dt><dd>Assess unwanted spread and plan removal with care around sensitive habitat.</dd></dl><footer><a href=\"https://www.cal-ipc.org/plants/paf/carpobrotus-edulis-plant-assessment-form/\" target=\"_blank\" rel=\"noopener\">Source guidance</a><br>ambitiousharvest.com</footer></section>";

window.AH_GRAPHICS["fall-garden-cleanup-for-fire-safety-g1"] = "<style>.ah-refresh-card{background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:12px;margin:24px 0;font-family:Montserrat,Arial,sans-serif;box-sizing:border-box}.ah-refresh-card h3{font-family:Fraunces,Georgia,serif;font-size:25px;color:#1a3b2a!important;margin:0 0 12px}.ah-refresh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}.ah-refresh-item{background:#f8f9f0!important;color:#1a3b2a!important;padding:16px;border-radius:8px}.ah-refresh-item strong{display:block;color:#8f4f45!important;margin-bottom:8px}.ah-refresh-card p{line-height:1.5;color:inherit!important}.ah-refresh-card a{color:#1a3b2a!important;overflow-wrap:anywhere}.ah-refresh-footer{font-size:12px;color:#1a3b2a!important}</style><section class=\"ah-refresh-card\"><h3>A fall cleanup order that starts at home</h3><p>Repeat the close-to-home check as leaves and needles fall.</p><div class=\"ah-refresh-grid\"><div class=\"ah-refresh-item\"><strong>First: buildings and decks</strong><p>Clear accumulated debris from roofs, gutters and on or beneath decks. Get help for unsafe access.</p></div><div class=\"ah-refresh-item\"><strong>Next: finished beds</strong><p>Remove dry vines and spent annuals a bed at a time. Have collection or another suitable disposal route ready.</p></div><div class=\"ah-refresh-item\"><strong>Then: the wider garden</strong><p>Maintain plant spacing and remove dry accumulations. Check slope, access and nearby structures.</p></div><div class=\"ah-refresh-item\"><strong>Before equipment work</strong><p>Check conditions and restrictions. Never mow on hot or windy days; a morning start is not an all-clear.</p></div></div><p class=\"ah-refresh-footer\">Confirm requirements with your local fire authority. <a href=\"https://www.fire.ca.gov/dspace\">CAL FIRE</a> \u00b7 <a href=\"https://ucanr.edu/site/uc-marin-master-gardeners/maintain-fire-smart-landscape\">UC Marin</a> \u00b7 ambitiousharvest.com</p></section>";
window.AH_GRAPHICS["fall-garden-cleanup-for-fire-safety-g2"] = "<style>.ah-refresh-card{background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:12px;margin:24px 0;font-family:Montserrat,Arial,sans-serif;box-sizing:border-box}.ah-refresh-card h3{font-family:Fraunces,Georgia,serif;font-size:25px;color:#1a3b2a!important;margin:0 0 12px}.ah-refresh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}.ah-refresh-item{background:#f8f9f0!important;color:#1a3b2a!important;padding:16px;border-radius:8px}.ah-refresh-item strong{display:block;color:#8f4f45!important;margin-bottom:8px}.ah-refresh-card p{line-height:1.5;color:inherit!important}.ah-refresh-card a{color:#1a3b2a!important;overflow-wrap:anywhere}.ah-refresh-footer{font-size:12px;color:#1a3b2a!important}</style><section class=\"ah-refresh-card\"><h3>Manage debris by location</h3><p>A zone boundary does not turn combustible material into a safe material.</p><div class=\"ah-refresh-grid\"><div class=\"ah-refresh-item\"><strong>First 5 feet</strong><p>Use noncombustible surfaces beside structures and attached decks. Remove leaves, dry plants, organic mulch and stored debris.</p></div><div class=\"ah-refresh-item\"><strong>5 to 30 feet</strong><p>Clear dead vegetation and accumulated debris. Keep planting areas and combustible materials separated.</p></div><div class=\"ah-refresh-item\"><strong>Farther out</strong><p>Continue fuel management under local guidance. Avoid dry stockpiles and do not block access or create erosion problems.</p></div><div class=\"ah-refresh-item\"><strong>Mulch and compost</strong><p>Fresh chips can burn. A moist compost center does not make dry outer material safe. Choose location and maintenance carefully.</p></div></div><p class=\"ah-refresh-footer\">Confirm requirements with your local fire authority. <a href=\"https://www.fire.ca.gov/dspace\">CAL FIRE</a> \u00b7 <a href=\"https://ucanr.edu/site/uc-marin-master-gardeners/maintain-fire-smart-landscape\">UC Marin</a> \u00b7 ambitiousharvest.com</p></section>";

window.AH_GRAPHICS["fire-resistant-fruit-trees-for-santa-cruz-gardens-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:8px;font-family:Georgia,serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;margin:0 0 16px\">Plan the space before buying the tree</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Beside the home</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Keep the immediate five feet free of plant fuel and combustible mulch. A dwarf tree or container plant still burns.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Farther into the garden</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Draw the mature canopy, nearby fences and other vegetation. Use CAL FIRE slope-based spacing and local advice, rather than a universal orchard distance.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Choose for your site</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Match fruit, rootstock, pollination, water and maintenance needs. A species name is not a wildfire safety rating.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Keep caring for the tree</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Remove dead material, manage surrounding fuels and irrigate appropriately. No orchard guarantees protection from fire.</p></div><p style=\"color:#1a3b2a;font-size:14px;margin:16px 0 0\"><a href=\"https://ucanr.edu/program/uc-anr-fire-network/right-plant-right-place-right-care\" style=\"color:#1a3b2a;text-decoration:underline\" target=\"_blank\" rel=\"noopener\">UC plant placement and care</a> \u00b7 <a href=\"https://www.fire.ca.gov/dspace\" style=\"color:#1a3b2a;text-decoration:underline\" target=\"_blank\" rel=\"noopener\">CAL FIRE spacing</a> \u00b7 ambitiousharvest.com</p></section>\r\n";

window.AH_GRAPHICS["fire-wise-design-for-slopes-and-hillsides-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:8px;font-family:Georgia,serif;line-height:1.6\"><h3 style=\"color:#1a3b2a;margin:0 0 16px\">Read the slope and plan the work</h3><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Start at the building</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Assess the immediate surroundings and exposed downhill decks. Wind and embers can threaten every side.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Measure the right quantity</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Slope percent is rise divided by horizontal run, multiplied by 100. Two feet of rise over ten feet of horizontal run is 20%, not 20 degrees.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Increase vegetation gaps</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">CAL FIRE uses slope categories below 20%, 20\u201340%, and above 40%. Apply its shrub and tree spacing to vegetation edges and mature size.</p></div><div style=\"background:#f8f9f0;color:#1a3b2a;padding:14px;margin:10px 0;border-radius:4px\"><strong style=\"color:#1a3b2a\">Protect drainage and soil</strong><p style=\"color:#1a3b2a;margin:4px 0 0\">Do not clear the whole hillside or improvise terraces and drainage barriers. Coordinate fuel reduction with qualified slope and fire advice.</p></div><p style=\"color:#1a3b2a;font-size:14px;margin:16px 0 0\"><a href=\"https://www.fire.ca.gov/dspace\" style=\"color:#1a3b2a;text-decoration:underline\" target=\"_blank\" rel=\"noopener\">CAL FIRE spacing</a> \u00b7 <a href=\"https://ucanr.edu/site/uc-marin-master-gardeners/hillsides\" style=\"color:#1a3b2a;text-decoration:underline\" target=\"_blank\" rel=\"noopener\">UC hillside care</a> \u00b7 ambitiousharvest.com</p></section>\r\n";

window.AH_GRAPHICS["fire-wise-herb-gardens-low-growing-high-moisture-plants-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:14px;font-family:Montserrat,sans-serif;line-height:1.6\"><p style=\"color:#1a3b2a!important\">On a small screen, scroll the table sideways to read every column.</p><div tabindex=\"0\" role=\"region\" aria-label=\"Scrollable planning table\" style=\"overflow-x:auto;color:#1a3b2a!important\"><p style=\"color:#1a3b2a!important;\">The plant-free first five feet is the conservative UC design recommendation used here. Confirm current property requirements with your fire authority.</p><div class=\"ah-table-wrap\" style=\"color:#1a3b2a!important;\"><div class=\"ah-table-title\" style=\"color:#1a3b2a!important;\">Herb-garden choices and maintenance</div><p style=\"color:#1a3b2a!important;\">No herb is fireproof. Place herb plantings outside the immediate five-foot area around the house and attached decks, and assess the whole setting. These are gardening considerations, not fire-risk ratings or safe-zone approvals.</p><table class=\"ah-table\" style=\"color:#1a3b2a!important;width:100%;min-width:680px;border-collapse:collapse;font-size:15px;\"><thead style=\"color:#1a3b2a!important;\"><tr style=\"color:#1a3b2a!important;\"><th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Herb or group</th><th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Plan for</th><th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Regular care</th></tr></thead><tbody style=\"color:#1a3b2a!important;\"><tr style=\"color:#1a3b2a!important;\"><th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Rosemary, lavender, culinary sage</th><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Mature woody growth, spacing, and separation from structures</td><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Inspect interiors and remove dead material; reassess large or crowded plants</td></tr><tr style=\"color:#1a3b2a!important;\"><th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Thyme and oregano</th><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Variety-dependent size and well-drained soil</td><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Keep growth out of paths, check beneath foliage, and remove dry material</td></tr><tr style=\"color:#1a3b2a!important;\"><th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Mint</th><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Containment and regular moisture without soggy roots</td><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Watch for escaping shoots and keep containers in an appropriate permanent location</td></tr><tr style=\"color:#1a3b2a!important;\"><th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Parsley, cilantro, basil</th><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Seasonal planting and water suited to each crop</td><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Harvest regularly and clear exhausted, dry plants</td></tr><tr style=\"color:#1a3b2a!important;\"><th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Chives</th><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Room for the clump to grow</td><td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Remove dry leaves and spent stalks; divide crowded clumps</td></tr></tbody></table><p style=\"color:#1a3b2a!important;\">Separate plants from combustible structures and other vegetation. Healthy foliage can still burn. Follow <a href=\"https://ucanr.edu/program/uc-anr-fire-network/defensible-space\" style=\"color:#1a3b2a!important;\">UC ANR defensible-space guidance</a> and your local fire agency's recommendations.</p></div></div></section>";

window.AH_GRAPHICS["fire-wise-landscaping-on-a-budget-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:14px;font-family:Montserrat,sans-serif;line-height:1.6\"><p style=\"color:#1a3b2a!important\">On a small screen, scroll the table sideways to read every column.</p><div tabindex=\"0\" role=\"region\" aria-label=\"Scrollable planning table\" style=\"overflow-x:auto;color:#1a3b2a!important\"><p style=\"color:#1a3b2a!important;\">The plant-free first five feet is the conservative UC design recommendation used here. Confirm current property requirements with your fire authority.</p><div class=\"ah-table-wrap\" style=\"color:#1a3b2a!important;\">\r\n<div class=\"ah-table-title\" style=\"color:#1a3b2a!important;\">Planning the next expense</div>\r\n<table class=\"ah-table\" style=\"color:#1a3b2a!important;width:100%;min-width:680px;border-collapse:collapse;font-size:15px;\">\r\n<thead style=\"color:#1a3b2a!important;\">\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Task</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Budget question</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Where to look</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Before starting</th>\r\n</tr>\r\n</thead>\r\n<tbody style=\"color:#1a3b2a!important;\">\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Clear debris and move combustible items</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Can you safely do it with existing tools?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Beside the house, steps and decks</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Arrange disposal; avoid hazardous access</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Prune or remove vegetation</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Hand-tool task or professional quote?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Connections between plants and structures</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Do not attempt overhead, utility or unstable-tree work</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Install a noncombustible surface</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">What are the measured quantity, delivery and preparation costs?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Immediate 5-foot area</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Check drainage, siding clearance and erosion</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Upgrade vents</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">What does a suitable approved installation cost?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Attic and underfloor openings</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Consult building official and licensed contractor; not a dryer-screen project</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Replace unsuitable plantings</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">What are removal and establishment costs?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Location and condition determine priority</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">No species is fireproof</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Add paths or repair irrigation</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Which specific problem will the work solve?</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Access and planting areas farther from structures</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">No path or irrigation system guarantees protection</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div></div></section>";
window.AH_GRAPHICS["fire-wise-landscaping-on-a-budget-g2"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:14px;font-family:Montserrat,sans-serif;line-height:1.6\"><p style=\"color:#1a3b2a!important\">On a small screen, scroll the table sideways to read every column.</p><div tabindex=\"0\" role=\"region\" aria-label=\"Scrollable planning table\" style=\"overflow-x:auto;color:#1a3b2a!important\"><p style=\"color:#1a3b2a!important;\">The plant-free first five feet is the conservative UC design recommendation used here. Confirm current property requirements with your fire authority.</p><div class=\"ah-table-wrap\" style=\"color:#1a3b2a!important;\">\r\n<div class=\"ah-table-title\" style=\"color:#1a3b2a!important;\">Surface choices need maintenance</div>\r\n<table class=\"ah-table\" style=\"color:#1a3b2a!important;width:100%;min-width:680px;border-collapse:collapse;font-size:15px;\">\r\n<thead style=\"color:#1a3b2a!important;\">\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Area</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Planning distance</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Approach</th>\r\n<th scope=\"col\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Keep in mind</th>\r\n</tr>\r\n</thead>\r\n<tbody style=\"color:#1a3b2a!important;\">\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Zone 0</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">First 5 feet</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Noncombustible surface appropriate to the site; remove vegetation and combustible mulch</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Clear new leaves and stored items; maintain drainage</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Zone 1</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">5 to 30 feet</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Separate maintained planting groups with appropriate noncombustible areas</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Combustible mulch can smolder; avoid continuous fuels and plant-to-building connections</td>\r\n</tr>\r\n<tr style=\"color:#1a3b2a!important;\">\r\n<th scope=\"row\" style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Zone 2</th>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">30 to 100 feet, within property boundaries</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Maintain vegetation and spacing for the site and slope</td>\r\n<td style=\"color:#1a3b2a!important;background:#f8f9f0!important;text-align:left;padding:12px;border:1px solid #b9c5b5;vertical-align:top;\">Not blanket permission for deeper mulch; confirm local requirements</td>\r\n</tr>\r\n</tbody>\r\n</table>\r\n</div></div></section>";

window.AH_GRAPHICS["fire-wise-maintenance-a-seasonal-checklist-for-santa-cruz-gardeners-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><div class=\"ah-table-wrap\">\r\n<div class=\"ah-table-title\">\r\n    Seasonal Defensible-Space Priorities\r\n  </div>\r\n<div aria-label=\"Scrollable garden comparison\" role=\"region\" style=\"overflow-x:auto;max-width:100%\" tabindex=\"0\"><table class=\"ah-table\" style=\"border-collapse:collapse;width:100%;min-width:520px\">\r\n<thead>\r\n<tr>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Season</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Top focus</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Key actions</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Spring</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Prepare as conditions allow</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Clear near-home debris; arrange safe roof/gutter care; assess spacing, access and disposal</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Summer</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Check new growth and debris</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Remove spent plants; inspect gaps and irrigation; normal watering, no emergency wetting</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Fall</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Revisit leaf buildup and spent crops</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Clear debris repeatedly as needed; use plant-specific care; plan waste removal</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Winter</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Inspect safely and plan improvements</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Check storm damage from a safe position; arrange qualified work; assess drainage and planting fit</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n</div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";

window.AH_GRAPHICS["fire-wise-pollinator-gardens-for-santa-cruz-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><div class=\"ah-table-wrap\"><div class=\"ah-table-title\">Pollinator Plants: Flowers and Maintenance</div><div aria-label=\"Scrollable garden comparison\" role=\"region\" style=\"overflow-x:auto;max-width:100%\" tabindex=\"0\"><table class=\"ah-table\" style=\"border-collapse:collapse;width:100%;min-width:520px\"><caption>No plant is fireproof or approved for a zone by this table. Keep Zone 0 noncombustible and assess placement against <a href=\"https://www.readyforwildfire.org/prepare-for-wildfire/defensible-space/\" rel=\"noopener\" style=\"color:#1a3b2a;line-height:1.6\" target=\"_blank\">CAL FIRE guidance</a> and local requirements.</caption><thead><tr><th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Plant / group</th><th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Flower contribution</th><th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">What to assess</th></tr></thead><tbody><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">California fuchsia</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Late-season flowers especially useful to hummingbirds</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Check selection size, spreading growth, and dead stems</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Yarrow</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Small clustered flowers for visiting insects</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Manage spread and dry stalks</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">California buckwheats</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Flowers for insects; seeds for birds</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Species vary in size; assess woody growth and dry heads</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Phacelia</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Bee forage when in flower</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Identify species; remove dry annual growth where needed</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">California poppy</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Pollen for bees, not nectar</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Manage summer dieback and reseeding</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Stonecrops / hens-and-chicks</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Flower value and season vary by species</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Remove dead leaves beneath rosettes and spent stalks</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Lavender</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Bee forage in flower</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Assess woody interior, aromatic foliage, and dry stalks</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Sages</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Flower visitors vary by species</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Identify species and mature habit; manage dry growth</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Rosemary</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Bee forage in flower</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Assess aromatic foliage, woodiness, and plant continuity</td></tr><tr><th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Manzanita</th><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Early-season flowers</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Check mature canopy and connections to surrounding fuels</td></tr></tbody></table></div></div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";

window.AH_GRAPHICS["vegetable-gardens-in-fire-zones-growing-food-safely-in-fire-country-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><div class=\"ah-table-wrap\">\r\n<div class=\"ah-table-title\">\r\n    Zone and Garden Placement Overview\r\n  </div>\r\n<div aria-label=\"Scrollable garden comparison\" role=\"region\" style=\"overflow-x:auto;max-width:100%\" tabindex=\"0\"><table class=\"ah-table\" style=\"border-collapse:collapse;width:100%;min-width:520px\">\r\n<thead>\r\n<tr>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Zone</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Planning distance</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Vegetable placement</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">What to check</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Zone 0</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Immediate 0 to 5 feet</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Keep planted beds and containers outside this area; maintain noncombustible surfaces</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Keep planted containers outside this band under this conservative plan; confirm current local requirements</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Zone 1</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Beyond 5 to 30 feet</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">May accommodate a maintained garden where the layout is suitable</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Mature crops, bed materials, supports, nearby structures and access; irrigation is not a firebreak</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Zone 2</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">30 to 100 feet or the property line</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Assess larger growing areas for site suitability</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Slope, surrounding fuels, access and maintenance; do not clear across boundaries without permission</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n</div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";
window.AH_GRAPHICS["vegetable-gardens-in-fire-zones-growing-food-safely-in-fire-country-g2"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\"><div class=\"ah-table-wrap\">\r\n<div class=\"ah-table-title\">\r\n    Crop Types and Fire-Wise Considerations\r\n  </div>\r\n<div aria-label=\"Scrollable garden comparison\" role=\"region\" style=\"overflow-x:auto;max-width:100%\" tabindex=\"0\"><table class=\"ah-table\" style=\"border-collapse:collapse;width:100%;min-width:520px\">\r\n<thead>\r\n<tr>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Crop group</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Growing consideration</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Fuel to watch</th>\r\n<th scope=\"col\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Maintenance plan</th>\r\n</tr>\r\n</thead>\r\n<tbody>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Leafy greens</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Choose for season and available space</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Bolting or spent growth and weeds beneath plants</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Maintain the whole bed; watering does not remove fire concerns</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Tomatoes, peppers and eggplant</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Allow for mature canopy and supports</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Dead lower leaves, ties and stakes</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Collect dead material and keep supports from linking to structures</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Squash and cucumbers</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Keep spreading vines within the planned area</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Finished vines across paths or fences</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Remove spent vines as the crop finishes</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Root crops</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Maintain foliage as well as the underground crop</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Dry tops and surrounding weeds</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Harvest and clear according to crop needs</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Dry beans, grains and seed crops</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Plan for a drying stage</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Dry pods, stems and stalks</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Choose an appropriate location and remove residues after harvest</td>\r\n</tr>\r\n<tr>\r\n<th scope=\"row\" style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Perennial herbs</th>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Assess species, mature size and placement</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Woody growth, oils and accumulated dead material</td>\r\n<td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Maintain access and separation; a zone boundary is not a safety rating</td>\r\n</tr>\r\n</tbody>\r\n</table></div>\r\n</div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";

window.AH_GRAPHICS["fire-wise-raised-bed-materials-and-placement-g1"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\">\r\n<div class=\"ah-material-table-container\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Raised-bed material decisions</h3><p style=\"color:#1a3b2a;line-height:1.6\">The frame is only one part of the bed. Metal and masonry sides do not make plants, mulch, liners, or accessories noncombustible.</p><div aria-label=\"Scrollable garden comparison\" role=\"region\" style=\"overflow-x:auto;max-width:100%\" tabindex=\"0\"><table class=\"ah-material-table\" style=\"border-collapse:collapse;width:100%;min-width:520px\"><thead><tr><th style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Material</th><th style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Useful characteristics</th><th style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Check before installation</th></tr></thead><tbody><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Galvanized steel</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Modular panels; no wood rot</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Coating, bracing, edge protection, drainage and intended garden use</td></tr><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Weathering steel</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Weathered appearance</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Soil-contact suitability, runoff staining and actual product warranty</td></tr><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Concrete blocks</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Modular masonry construction</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Stable base, wall design and known material history</td></tr><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Poured concrete</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Permanent layout</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Design, drainage, access and installed cost</td></tr><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Natural stone</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Permanent masonry appearance</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Weight, workmanship and engineering where retaining a slope</td></tr><tr><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Brick</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Dry-stacked or mortared designs where suitable</td><td style=\"background:#f8f9f0;color:#1a3b2a;padding:12px;border:1px solid #dde2d8;text-align:left;vertical-align:top\">Base, height, soil pressure and condition of salvaged materials</td></tr></tbody></table></div><p style=\"color:#1a3b2a;line-height:1.6\">Compare complete installed costs and manufacturer guidance. No universal lifespan or wildfire rating is assigned here.</p><p style=\"color:#1a3b2a;line-height:1.6\">ambitiousharvest.com | Santa Cruz County Gardening</p></div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";
window.AH_GRAPHICS["fire-wise-raised-bed-materials-and-placement-g2"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\">\r\n<div class=\"ah-zone-guide\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Raised-bed placement and defensible space</h3><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Zone 0: immediate five feet</h3><p style=\"color:#1a3b2a;line-height:1.6\">Keep planted beds and planted containers outside the first five feet around the house and attached decks. Noncombustible containers do not make their contents noncombustible. Keep this area clear of combustible mulch and debris.</p><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Zone 1: five to thirty feet</h3><p style=\"color:#1a3b2a;line-height:1.6\">Assess bed location, mature crops, trellises, frame and nearby fuels together. Maintain appropriate separation from structures, fences and vegetation. A location beyond five feet is not automatic approval.</p><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Zone 2: thirty to one hundred feet</h3><p style=\"color:#1a3b2a;line-height:1.6\">Work to the property boundary if it is closer. Follow local fire-agency guidance and coordinate beyond-boundary work with the owner. Wood and organic materials still require attention here.</p><p style=\"color:#1a3b2a;line-height:1.6\">Arrange permanent locations in advance. Do not rely on moving beds or watering them during an evacuation.</p><p style=\"color:#1a3b2a;line-height:1.6\">Source: <a href=\"https://ucanr.edu/program/uc-anr-fire-network/defensible-space\" style=\"color:#1a3b2a;line-height:1.6\">UC ANR Fire Network</a>.</p><p style=\"color:#1a3b2a;line-height:1.6\">ambitiousharvest.com | Santa Cruz County Gardening</p></div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";
window.AH_GRAPHICS["fire-wise-raised-bed-materials-and-placement-g3"] = "<section style=\"background:#dde2d8;color:#1a3b2a;padding:24px;border-radius:12px;margin:2rem 0;font-family:Montserrat,sans-serif;line-height:1.6\">\r\n<div class=\"ah-mulch-guide\"><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Mulch and debris around raised beds</h3><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Within the immediate five feet</h3><p style=\"color:#1a3b2a;line-height:1.6\">Keep combustible mulch and plant debris away from the house and attached decks. Gravel or other suitable noncombustible surfaces still need leaf and weed cleanup. Keep planted beds outside this band.</p><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Beyond the immediate area</h3><p style=\"color:#1a3b2a;line-height:1.6\">Choose mulch by its location, amount, combustibility and local guidance. Straw, wood chips and other organic materials can dry and burn. Compost is not noncombustible. Irrigation and annual replenishment do not make a mulch fire-safe.</p><h3 style=\"color:#1a3b2a;font-family:Fraunces,serif;line-height:1.3\">Maintain the whole bed</h3><p style=\"color:#1a3b2a;line-height:1.6\">Remove spent crops, dry trimmings and accumulated debris. Keep paths usable and prevent combustible material from connecting beds to fences or the home.</p><p style=\"color:#1a3b2a;line-height:1.6\">Source: <a href=\"https://ucanr.edu/program/uc-anr-fire-network/prepare-your-landscaping\" style=\"color:#1a3b2a;line-height:1.6\">UC ANR Fire Network landscaping guidance</a>.</p><p style=\"color:#1a3b2a;line-height:1.6\">ambitiousharvest.com | Santa Cruz County Gardening</p></div><p style=\"color:#1a3b2a\">Plant-free immediate five feet is the conservative design recommendation used here. Confirm applicable rules with your local fire authority.</p></section>";
