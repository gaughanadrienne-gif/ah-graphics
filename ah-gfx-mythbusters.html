window.AH_GRAPHICS["garden-myth-adding-lime-to-california-soil-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color: #1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: TEST BEFORE LIMING</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Every California Garden Needs Routine Lime</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Use a soil test and the intended crop to decide whether pH needs raising. Lime is not routine care, and a pH reading alone does not set the dose.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-adding-sand-to-clay-soil-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Adding Sand to Clay Soil Improves Drainage</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Mixing sand into clay soil can actually make drainage worse, creating a dense, cement-like material that is harder to work than the clay you started with.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-all-bees-sting-keep-away-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color: #1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">All Bees Sting and Should Be Kept Away From Gardens</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Male bees cannot sting; females can. Give foraging bees space, avoid handling them, and keep away from nests. Follow an individual medical plan for sting allergies.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-banana-peels-great-fertilizer-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color: #1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: MOSTLY BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Banana Peels Are a Great Garden Fertilizer</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Banana peels contribute nutrients to compost, but they are not a measured fertilizer dose. Compost them in a managed system, and base additional feeding on the plant and soil needs.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-beer-traps-best-slug-control-g1"] = "<section aria-label=\"Beer traps are one tool\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Beer traps are one tool</h3><p style=\"color:#1a3b2a!important\">A trap can catch nearby slugs and snails. It does not show that the garden population is controlled.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Check fresh plant damage, reduce unnecessary shelter and damp surfaces, and maintain any traps you use. Keep pets away from beer.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Consider a currently labeled bait only when warranted, and follow all label precautions. Lower risk does not mean harmless.</p></section>";
window.AH_GRAPHICS["garden-myth-bought-ladybugs-stay-in-garden-g1"] = "<section aria-label=\"A short visit can still help\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">A short visit can still help</h3><p style=\"color:#1a3b2a!important\">Purchased convergent lady beetles tend to disperse after release. Properly handled, sufficiently large releases can give temporary aphid control.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Check for existing predators and actual plant damage before buying. Follow UC handling guidance if you choose a release.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Flowering habitat and fewer unnecessary broad-spectrum sprays support natural enemies, but cannot make individual beetles stay.</p></section>";
window.AH_GRAPHICS["garden-myth-butterflies-moths-all-beneficial-g1"] = "<section aria-label=\"Identify the insect and the damage\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Identify the insect and the damage</h3><p style=\"color:#1a3b2a!important\">Butterflies and moths have different roles at different life stages. Some caterpillars feed on crops; others are the wildlife a habitat planting supports.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Observe before treating. Use focused crop protection when needed and leave unfamiliar eggs alone while identifying them.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Btk can kill desirable caterpillars too. Use only a product labeled for the crop and pest, and protect nearby host plants from spray.</p></section>";
window.AH_GRAPHICS["garden-myth-cant-compost-citrus-peels-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color: #1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Conventional pile: YES</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">You Can't Compost Citrus Peels</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Citrus rinds can go in a conventional compost pile. Chop and mix them with other materials. Worm-bin guidance is more cautious: limit citrus or leave it out.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-cant-grow-blueberries-california-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color: #1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">You Can't Grow Blueberries in California</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Blueberries can grow in suitable California gardens. Match the cultivar to local conditions and provide an acidic, well-drained root environment with reliable irrigation.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-cant-grow-productive-garden-in-shade-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: THE AMOUNT OF SHADE MATTERS</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">You Can't Grow a Productive Garden in Shade</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Partial shade can support some food crops, especially leafy greens. Match crops to the available light, expect variable growth, and do not confuse relief from summer heat with tolerance of deep shade.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-coffee-grounds-make-soil-acidic-g1"] = "<div style=\"width:100%;margin:30px 0;padding:22px;box-sizing:border-box;font-family:'Montserrat',system-ui,sans-serif;background-color:#dde2d8 !important;color:#1a3b2a !important;border:1px solid #cbd5c1;border-radius:10px;\"><p style=\"margin:0 0 10px;font-size:0.75rem;font-weight:700;letter-spacing:0.08em;color:#1a3b2a !important;\">MYTH VS. REALITY</p><h3 style=\"font-family:Fraunces,Georgia,serif;margin:0 0 16px;color:#1a3b2a !important;\">Coffee grounds are not a reliable soil acidifier</h3><div style=\"background-color:#f8f9f0 !important;padding:18px;border-radius:6px;color:#1a3b2a !important;\"><p style=\"margin:0 0 12px;color:#1a3b2a !important;\"><strong>The myth:</strong> Coffee grounds make soil acidic.</p><p style=\"margin:0;line-height:1.6;color:#1a3b2a !important;\"><strong>The reality:</strong> Used coffee grounds are not a dependable way to lower soil pH. Use them sparingly in a varied compost pile, and test soil before trying to change its acidity.</p></div><p style=\"font-size:12px;margin:16px 0 0;color:#1a3b2a !important;\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-companion-planting-always-works-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color: #dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color: #dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: PARTIALLY TRUE</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color: #1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Companion Planting Always Works as Described</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color: #1a3b2a !important;line-height:1.5;\">Some companion planting combinations have scientific support, but many popular pairings are based on folklore rather than evidence. Results vary widely depending on conditions.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-compost-bins-attract-rats-g1"] = "<section aria-label=\"Make food and shelter harder to reach\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Make food and shelter harder to reach</h3><p style=\"color:#1a3b2a!important\">Compost can attract rats when it provides accessible food or shelter. Careful management reduces the risk, but does not guarantee a rat-free bin.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Check the lid, seams and base. Secure quarter-inch hardware cloth beneath open-bottom bins and keep scraps contained.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Inspect regularly. Fresh burrows, gnawing or droppings call for attention to the wider garden and qualified help when needed.</p></section>";
window.AH_GRAPHICS["garden-myth-compost-tea-better-than-compost-g1"] = "<section aria-label=\"Choose compost for an identified need\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Choose compost for an identified need</h3><p style=\"color:#1a3b2a!important\">Compost tea varies with its ingredients and preparation. It is not a dependable upgrade to finished compost or an unspecified cure for plant disease.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">For soil improvement, suitable finished compost adds solid organic material directly. Choose the amount for the soil and crop.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Aeration does not establish food safety. Keep unverified homemade tea off edible plant parts; production requirements depend on inputs and process.</p></section>";
window.AH_GRAPHICS["garden-myth-crushed-eggshells-deter-slugs-g1"] = "<section aria-label=\"Judge the leaves, not the shell ring\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Judge the leaves, not the shell ring</h3><p style=\"color:#1a3b2a!important\">In an RHS lettuce trial, crushed-eggshell barriers did not reduce feeding damage. That is evidence against relying on them, not a universal claim about every slug movement.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Inspect after dark, identify the feeder, hand-pick regularly and reduce unnecessary damp shelter beside vulnerable crops.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">Use bait only when warranted and follow the exact product label. Organic status does not mean harmless to pets or wildlife.</p></section>";
window.AH_GRAPHICS["garden-myth-deep-watering-means-soaking-for-hours-g1"] = "<section aria-label=\"Water the roots, not the clock\" style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:28px;border-radius:16px;font-family:Montserrat,sans-serif;line-height:1.6\"><h3 style=\"font-family:Fraunces,serif;color:#1a3b2a!important;margin-top:0\">Water the roots, not the clock</h3><p style=\"color:#1a3b2a!important\">Deep watering describes where moisture reaches. Runtime depends on flow, soil, initial moisture, planted area and the active root zone.</p><div style=\"background:#f8f9f0!important;color:#1a3b2a!important;padding:18px;border-radius:10px\"><p style=\"color:#1a3b2a!important;margin:0\">Check several places and depths. Repair blocked outlets and dry gaps instead of simply extending the whole irrigation zone.</p></div><p style=\"color:#1a3b2a!important;margin-bottom:0\">If water runs off, adjust the application and allow time to soak in. A fixed number of minutes or a screwdriver hard stop cannot establish adequate watering.</p></section>";
window.AH_GRAPHICS["garden-myth-dish-soap-safe-garden-spray-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#dde2d8 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Dish Soap Is a Safe Garden Spray</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Household dishwashing products are not a reliable substitute for labeled insecticidal soap and can injure plants. Identify the pest first; use any pesticide only as its label directs.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-drip-irrigation-wastes-water-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#dde2d8 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Drip Irrigation Wastes Water Because It Runs All the Time</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Drip can conserve water when properly designed and maintained. Flow rate, runtime and root-zone coverage determine delivery; leaks and excessive watering can waste it.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-drought-tolerant-plants-zero-water-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: PARTIALLY TRUE</span></div><div style=\"background-color:#dde2d8 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Drought-Tolerant Plants Need Zero Water Once Established</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Drought tolerance does not give every plant the same watering needs. Establish new roots carefully, then follow species and site guidance. Some established plants need little or no summer irrigation.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-eggshells-add-calcium-quickly-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#dde2d8 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: PREPARATION AND NEED MATTER</span></div><div style=\"background-color:#dde2d8 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Eggshells Add Calcium to Soil Quickly</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Eggshells contain calcium, but coarse pieces are not a reliable quick treatment. Fine grinding changes their behavior; soil testing and moisture management matter more than adding shells by habit.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-epsom-salt-helps-all-plants-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;background-color:#dde2d8 !important;color:#1a3b2a !important;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#f8f9f0 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: MOSTLY BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Epsom Salt Helps All Plants Grow Better</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Epsom salt supplies magnesium and sulfur, not a universal growth boost. Test before supplementing: excessive use can cause salt injury and nutrient imbalances.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-fall-too-late-to-plant-california-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;background-color:#dde2d8 !important;color:#1a3b2a !important;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#f8f9f0 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Fall Is Too Late to Plant in California</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Fall suits many cool-season crops and landscape plants. Choose the plant and timing for your site, frost risk, drainage and available water.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-garlic-around-roses-deters-aphids-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;background-color:#dde2d8 !important;color:#1a3b2a !important;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#f8f9f0 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: NOT A RELIABLE CONTROL</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Planting Garlic Around Roses Deters Aphids</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Do not rely on garlic beside a rose to control aphids. Results from extracts or other crop-and-pest combinations do not establish that this planting works. Monitor the rose and use appropriate controls when needed.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-hardpan-soil-cant-be-fixed-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;background-color:#dde2d8 !important;color:#1a3b2a !important;\"><div style=\"background-color:#dde2d8 !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#f8f9f0 !important;color:#1a3b2a !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Hardpan Soil in California Can't Be Fixed</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#1a3b2a !important;line-height:1.5;\">Some soil restrictions can be improved; others need a different growing approach. Identify the layer before deep breaking. Raised beds and cover crops have limits.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-heirloom-varieties-always-taste-better-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Taste the variety, not the category</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> Heirloom Varieties Always Taste Better Than Hybrids</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Heirloom status does not guarantee better flavor. Variety, ripeness, growing conditions and personal preference all affect the tomatoes you enjoy.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-marigolds-repel-all-pests-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Identify the pest before choosing the plant</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> Marigolds Repel All Garden Pests</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Some marigold varieties can suppress particular nematodes when grown in a suitable planting system. A few flowers beside vegetables are not a general pest barrier.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-midday-watering-burns-leaves-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Water for the roots and the conditions</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> Watering in the Middle of the Day Burns Leaves</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Droplets did not burn the smooth leaves tested in one study, but droplets held above floating-fern leaves by wax hairs did cause damage. Avoid a universal rule; check soil moisture and water the root zone when needed.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-more-fertilizer-means-more-fruit-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Feed for a demonstrated need</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> More Fertilizer Means More Fruit</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Correcting a nutrient shortage can help a crop. Excess fertilizer can injure plants or favor leafy growth. Use soil information, crop needs and the product label instead of assuming more means more fruit.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-mulch-attracts-termites-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><div style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Keep the foundation inspectable</div><div style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> Mulch Attracts Termites</div><div style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Mulch near a foundation needs attention to moisture, wood contact and inspection access. Do not treat a universal attraction claim or a narrow gap as a complete termite or fire-safety plan.</div><div style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-must-rotate-crops-home-garden-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><div style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Rotation can help in a small garden</div><div style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> You Need to Rotate Crops in a Home Garden</div><div style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Rotate crop families where practical to help manage some soilborne diseases. The benefit and interval depend on the problem; rotation does not replace sanitation, resistant varieties or other suitable care.</div><div style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-must-start-seeds-indoors-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Choose the method for the crop</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> You Have to Start Seeds Indoors to Get a Good Harvest</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Direct sowing and transplanting can both work. Choose by the crop, available season, soil conditions and your ability to care for starts. Indoor sowing is a useful option, not a requirement for every harvest.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-native-gardens-look-messy-brown-g1"] = "<div style=\"width:100%;box-sizing:border-box;margin:30px 0;padding:22px;background:#dde2d8!important;color:#1a3b2a!important;border:1px solid #1a3b2a;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6\"><p style=\"margin:0 0 8px;color:#1a3b2a!important;font-weight:700\">Plan for seasonal change</p><p style=\"margin:0 0 12px;color:#1a3b2a!important\"><strong>The claim:</strong> California Native Gardens Look Messy and Brown</p><p style=\"margin:0;padding:16px;background:#f8f9f0!important;color:#1a3b2a!important;border-radius:6px\">Summer dormancy and brown stems can be normal. Combine suitable plants for structure and seasonal interest, and maintain paths and plantings. A greener-looking garden is not the only successful native garden.</p><p style=\"margin:12px 0 0;font-size:0.8rem;color:#1a3b2a!important\">ambitiousharvest.com</p></div>";
window.AH_GRAPHICS["garden-myth-need-big-yard-to-grow-food-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Start with one useful harvest</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Match the plant to the space</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Choose something you enjoy eating, then allow for its mature roots, foliage, light and care.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Plan beyond the pot</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Leave room to reach and water plants. Check balcony limits before adding heavy containers.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Use estimates carefully</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">UC yield estimates use 15-foot rows; they are not a guaranteed harvest from a small mixed bed.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin:16px 0 0;\"><a href=\"https://ucanr.edu/site/uc-master-gardeners-santa-clara-county/container-gardening-basics\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></section>";
window.AH_GRAPHICS["garden-myth-need-compost-tumbler-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">A tumbler is optional</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Choose for the work</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">A suitable pile, bin or tumbler can support composting. Consider access, capacity and pest management.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Manage the ingredients</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Browns, greens, moisture and air still matter in every container. A lid alone does not establish rodent resistance.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Let the batch finish</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Ingredients and management affect timing. A two-week claim is not a universal finished-compost date.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin:16px 0 0;\"><a href=\"https://www.epa.gov/recycle/composting-home\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></section>";
window.AH_GRAPHICS["garden-myth-need-expensive-soil-to-start-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Buy for the growing space</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">In the ground</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Assess existing soil and improve it when needed. Compost is not a fix for every soil problem.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">In a raised bed</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Choose a suitable soil mixture. Do not fill an ordinary vegetable bed with compost alone.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">In a container</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Use container potting mix. Compare the total cost and quantity you need, not just a premium label.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin:16px 0 0;\"><a href=\"https://extension.oregonstate.edu/catalog/em-9308-how-use-compost-gardens-landscapes\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></section>";
window.AH_GRAPHICS["garden-myth-neem-oil-safe-for-everything-g1"] = "<section style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Neem is not a universal garden spray</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Identify the problem</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Decide whether treatment is needed before choosing a product.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Check the exact product</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Ingredient, formulation, plant restrictions and registered uses matter. Follow the label, including weather and protective-equipment directions.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Protect unintended targets</strong><div style=\"color:#1a3b2a!important;margin:6px 0 0;\">Avoid plant injury, pollinator exposure and aquatic contamination. Natural origin and evening timing are not safety guarantees.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin:16px 0 0;\"><a href=\"https://ipm.ucanr.edu/home-and-landscape/less-toxic-insecticides/\" target=\"_blank\" rel=\"noopener\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></section>";
window.AH_GRAPHICS["garden-myth-pine-needles-too-acidic-g1"] = "<div style=\"background:#edf3e9;color:#183c28;padding:24px;border-radius:14px;font-family:Arial,sans-serif;line-height:1.55;box-sizing:border-box;max-width:100%;\">\r\n<div style=\"font-size:24px;font-weight:700;color:#183c28;margin-bottom:18px;\">Pine needles: separate pH from fire exposure</div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Test the soil</div><div style=\"color:#183c28;\">Acidic needles do not appreciably lower soil pH as mulch. Do not rely on them to prepare blueberry soil.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Check the location</div><div style=\"color:#183c28;\">Pine needles are combustible and can carry fire quickly. Keep combustible material away from structures.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Plan the first five feet</div><div style=\"color:#183c28;\">Use conservative noncombustible immediate-zone design guidance and check current requirements for your property.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Inspect before adding</div><div style=\"color:#183c28;\">Check water penetration, accumulated depth and windblown needles near stems, fences and structures.</div></div>\r\n<div style=\"font-size:13px;color:#183c28;margin-top:18px;\">Sources: <a href=\"https://extension.unh.edu/blog/2019/10/do-pine-trees-pine-needles-make-soil-more-acidic\" style=\"color:#183c28;text-decoration:underline;\">Source 1</a> | <a href=\"https://ucanr.edu/program/uc-anr-fire-network/mulch\" style=\"color:#183c28;text-decoration:underline;\">Source 2</a></div><div style=\"font-size:13px;font-weight:700;color:#183c28;margin-top:10px;\">ambitiousharvest.com</div></div>\r\n";
window.AH_GRAPHICS["garden-myth-planting-by-moon-phases-g1"] = "<div style=\"background:#edf3e9;color:#183c28;padding:24px;border-radius:14px;font-family:Arial,sans-serif;line-height:1.55;box-sizing:border-box;max-width:100%;\">\r\n<div style=\"font-size:24px;font-weight:700;color:#183c28;margin-bottom:18px;\">Let growing conditions choose the planting date</div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Keep the tradition in perspective</div><div style=\"color:#183c28;\">A lunar calendar has not established a reliable vegetable-planting advantage.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Check the crop and stage</div><div style=\"color:#183c28;\">Seed germination guidance and transplant timing answer different questions.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Read the bed</div><div style=\"color:#183c28;\">Consider soil temperature and moisture alongside the forecast and local planting guidance.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Keep useful notes</div><div style=\"color:#183c28;\">Record emergence, growth and harvest. Different sowing dates also experience different weather.</div></div>\r\n<div style=\"font-size:13px;color:#183c28;margin-top:18px;\">Sources: <a href=\"https://extension.illinois.edu/blogs/garden-scoop/2022-04-16-lunar-influence-gardening\" style=\"color:#183c28;text-decoration:underline;\">Source 1</a> | <a href=\"https://ucanr.edu/sites/default/files/2021-01/343966.pdf\" style=\"color:#183c28;text-decoration:underline;\">Source 2</a></div><div style=\"font-size:13px;font-weight:700;color:#183c28;margin-top:10px;\">ambitiousharvest.com</div></div>\r\n";
window.AH_GRAPHICS["garden-myth-potting-soil-lasts-forever-g1"] = "<div style=\"background:#edf3e9;color:#183c28;padding:24px;border-radius:14px;font-family:Arial,sans-serif;line-height:1.55;box-sizing:border-box;max-width:100%;\">\r\n<div style=\"font-size:24px;font-weight:700;color:#183c28;margin-bottom:18px;\">Reuse potting mix by condition, not its birthday</div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Review the previous crop</div><div style=\"color:#183c28;\">Healthy plants and no major disease history can make reuse reasonable. Investigate unresolved problems before reusing material.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Watch water and roots</div><div style=\"color:#183c28;\">Blocked drainage, a root-filled pot and dried water-repellent mix are different problems.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Refresh appropriately</div><div style=\"color:#183c28;\">Use a compatible mix for the plant. Topping up must not bury the stem or crown.</div></div>\r\n<div style=\"background:#fff;color:#183c28;padding:16px;margin:12px 0;border:1px solid #b8c9b1;border-radius:8px;\"><div style=\"font-weight:700;color:#183c28;\">Replace when needed</div><div style=\"color:#183c28;\">Decomposition eventually changes drainage and aeration. Fertilizer does not restore physical structure.</div></div>\r\n<div style=\"font-size:13px;color:#183c28;margin-top:18px;\">Sources: <a href=\"https://extension.illinois.edu/container-gardens/soil\" style=\"color:#183c28;text-decoration:underline;\">Source 1</a> | <a href=\"https://ucanr.edu/blog/under-solano-sun/article/choose-proper-potting-medium-container-plants\" style=\"color:#183c28;text-decoration:underline;\">Source 2</a></div><div style=\"font-size:13px;font-weight:700;color:#183c28;margin-top:10px;\">ambitiousharvest.com</div></div>\r\n";
window.AH_GRAPHICS["garden-myth-prune-fruit-trees-perfect-vase-g1"] = "<div style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Prune for the tree you have</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Identify the crop</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Training system, age and fruiting wood guide the cuts. A perfect vase is not the goal for every tree.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Keep productive wood</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Peaches and nectarines bear on last season\u2019s growth. Plums and apricots also use older fruiting spurs.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Check the pruning window</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Apricots and cherries need summer timing under UC Eutypa guidance. Check coastal conditions before cutting.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin-top:16px;\"><a href=\"https://ucanr.edu/site/uc-master-gardener-program-alameda-county/pruning-fruit-trees\" rel=\"noopener\" target=\"_blank\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-pulling-weeds-makes-more-grow-g1"] = "<div style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Find out what is coming back</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">New seedlings</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">The soil seed bank can produce another flush when conditions suit it.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Living underground parts</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Some perennial weeds regrow from roots or other structures. Identify them before repeated cultivation spreads fragments.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Choose the next step</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Remove young weeds before seed production. Use mulch only where planting and fire-planning needs allow.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin-top:16px;\"><a href=\"https://ipm.ucanr.edu/home-and-landscape/weed-management-in-landscapes/\" rel=\"noopener\" target=\"_blank\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-remove-all-fallen-leaves-g1"] = "<div style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Choose where leaves can remain</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Clear sensitive places</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Keep paths and drainage clear. UC recommends removing combustible debris in the immediate five feet beside structures.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Keep a suitable habitat patch</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Whole leaves can shelter invertebrates. Avoid burying seedlings or piling material against trunks and crowns.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Handle disease specifically</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Follow guidance for the diagnosed problem. Leaf cleanup alone does not manage every disease.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin-top:16px;\"><a href=\"https://ucanr.edu/site/uc-marin-master-gardeners/what-do-fallen-leaves\" rel=\"noopener\" target=\"_blank\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-rocks-in-bottom-of-pots-g1"] = "<div style=\"background:#dde2d8!important;color:#1a3b2a!important;padding:24px;border-radius:10px;font-family:Montserrat,system-ui,sans-serif;line-height:1.6;box-sizing:border-box;max-width:100%;\"><h3 style=\"color:#1a3b2a!important;margin:0 0 16px;\">Give excess water a way out</h3><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Skip the gravel layer</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">A coarse layer below potting mix does not provide a drainage shortcut and takes up growing space.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Use the right container</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Choose open drainage holes and a suitable growing mix. Check saucers and outer pots for standing water.</div></div><div style=\"background:#fafaf3!important;color:#1a3b2a!important;padding:16px;margin:12px 0;border-radius:8px;\"><strong style=\"color:#1a3b2a!important;\">Match the system to the plant</strong><div style=\"color:#1a3b2a!important;margin-top:6px;\">Root room, mix, watering and container design all matter. A photograph is not a drainage test.</div></div><div style=\"color:#1a3b2a!important;font-size:13px;margin-top:16px;\"><a href=\"https://ucanr.edu/blog/fresno-gardening-green/article/rosies-corner-if-you-dont-have-yard-grow-roses-pot\" rel=\"noopener\" target=\"_blank\" style=\"color:#1a3b2a!important;text-decoration:underline;\">Primary source guidance</a><br>ambitiousharvest.com</div></div>";
window.AH_GRAPHICS["garden-myth-rusty-nails-help-plants-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Rusty Nails in Soil Help Plants Grow</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Iron from rusty nails is not available to plants in any meaningful way. This old folk remedy does not address actual iron deficiency and can introduce contaminants to your soil.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-seal-pruning-cuts-wound-paste-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">You Should Seal Pruning Cuts With Wound Paste</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Wound sealers do not help trees heal and can actually trap moisture and pathogens under the seal.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-succulents-zero-maintenance-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Succulents Need Zero Maintenance</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Succulents are low-maintenance, not no-maintenance. They still need appropriate watering, good drainage, pest management, and occasional care.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-sugar-water-helps-transplant-shock-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Sugar Water Helps Transplant Shock</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Plants cannot absorb sugar through their roots in any useful way. Sugar water does nothing for transplant shock and may actually feed harmful soil pathogens.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-till-soil-every-spring-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: MOSTLY BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">You Need to Till Your Soil Every Spring</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Routine tilling destroys soil structure, kills beneficial organisms, and can actually make your soil worse over time. Most home gardens do not need annual tilling.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-vinegar-safe-effective-herbicide-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: MOSTLY BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Vinegar Is a Safe and Effective Herbicide</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Household vinegar burns leaf tissue on contact but does not kill roots, and horticultural-strength vinegar is a serious safety hazard.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-water-every-day-california-summers-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: MOSTLY BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">You Should Water Every Day During California Summers</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Daily watering is rarely necessary and often counterproductive. Most established garden plants do best with deeper, less frequent irrigation, even in our dry summers.</p></div></div></div>";
window.AH_GRAPHICS["garden-myth-water-lawn-every-day-summer-g1"] = "<div style=\"width:100%;margin:30px 0;font-family:'Montserrat',system-ui,sans-serif;border:1px solid #dde2d8 !important;border-radius:10px;overflow:hidden;\"><div style=\"background-color:#1a3b2a !important;padding:16px 22px;text-align:center;\"><p style=\"margin:0;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:#c9a84c !important;font-weight:700;\">Myth vs. Reality</p><span style=\"display:inline-block;margin-top:8px;background-color:#b8694a !important;color:#f8f9f0 !important;font-size:0.74rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:5px 15px;border-radius:999px;\">Verdict: BUSTED</span></div><div style=\"background-color:#f8f9f0 !important;padding:20px 22px;\"><div style=\"border-left:4px solid #b8694a !important;padding:2px 0 2px 15px;margin-bottom:16px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#b8694a !important;font-weight:700;\">The Myth</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">You Should Water Your Lawn Every Day in Summer</p></div><div style=\"border-left:4px solid #1a3b2a !important;padding:2px 0 2px 15px;\"><p style=\"margin:0 0 5px 0;font-size:0.7rem;letter-spacing:0.1em;text-transform:uppercase;color:#1a3b2a !important;font-weight:700;\">The Reality</p><p style=\"margin:0;font-size:0.98rem;color:#3a3a3a !important;line-height:1.5;\">Daily shallow watering weakens grass roots, wastes water, and encourages disease. Most California lawns perform better with deep, infrequent watering.</p></div></div></div>";
