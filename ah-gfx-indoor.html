window.AH_GRAPHICS["best-houseplants-for-beginners-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Reading the Light in Your Home</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Match a plant to the light you actually have. You do not need a meter.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem;'>\n        <thead>\n          <tr style='background:#dde2d8;'>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Light Level</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Foot-candles</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Window Direction</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Shadow Test (noon)</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Low</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>50 to 250 fc</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>North window or interior wall away from windows</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Almost no shadow</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Medium</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>250 to 1,000 fc</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>East or west window</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Soft, fuzzy shadow</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>High</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Above 1,000 fc</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>South window (brightest)</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Crisp, dark shadow</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='margin-top:1rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>The newspaper test:</strong> Low light is a spot just bright enough to comfortably read a newspaper. If you need a lamp to read there at midday, it is too dark for most plants.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: University of Missouri Extension (foot-candle bands); Penn State Extension (newspaper test).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-houseplants-for-beginners-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The Three Toughest Beginner Houseplants</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>All three tolerate dim corners and forgive a missed watering.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.88rem;'>\n        <thead>\n          <tr style='background:#dde2d8;'>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Plant</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Light</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Watering</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Difficulty</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Pet Safety</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Snake Plant</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Very low, as low as 25 fc</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Every 2 to 3 weeks; let soil dry several inches down</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Easiest</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; font-weight:600;'>Toxic to cats and dogs (saponins)</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>ZZ Plant</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Low; coasts through dim light</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Only when soil dries fully; err on the dry side</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Very easy</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; font-weight:600;'>Toxic to pets (calcium oxalate)</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Pothos</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Low to medium</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>When leaves droop slightly; perks up after watering</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Easy</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; font-weight:600;'>Toxic to pets (insoluble calcium oxalates)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: Penn State Extension (light tolerance); ASPCA (pet toxicity). Spider plant is a non-toxic alternative for homes with pets that nibble.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["fungus-gnats-houseplants-no-spray-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Fungus Gnat or Fruit Fly?</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>The easy tell is where they hang out. If they rise from your plant pots, they are fungus gnats.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 250px; background:#ffffff; border-top:4px solid #8f4f45; padding:1rem 1.2rem;'>\n        <h4 style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 8px; color:#8f4f45 !important;'>Fungus Gnat</h4>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Size:</strong> 1/16 to 1/8 inch long</p>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Body:</strong> Dark, slender, mosquito-like; a weak flier</p>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Where:</strong> Rests on and runs across the soil surface of potted plants; does not move around much indoors</p>\n      </div>\n      <div style='flex:1 1 250px; background:#ffffff; border-top:4px solid #dde2d8; padding:1rem 1.2rem;'>\n        <h4 style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 8px; color:#1a3b2a !important;'>Fruit Fly</h4>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Size:</strong> Similar small size, easily confused</p>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Body:</strong> Tan, rounder</p>\n        <p style='margin:4px 0; font-size:0.85rem; color:#1a3b2a !important;'><strong>Where:</strong> Hovers around ripening fruit and kitchen drains, not soil</p>\n      </div>\n    </div>\n    <div style='margin-top:1rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>The real damage is in the soil:</strong> The larva has a shiny black head and an elongated, whitish-to-clear, legless body, living in the top inch of moist mix where it feeds on organic matter, fungi, and root hairs.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: UC Integrated Pest Management (size, behavior, larva); Cornell Cooperative Extension (fruit fly vs gnat).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["fungus-gnats-houseplants-no-spray-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The No-Spray Fungus Gnat Program</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Used together, these steps break the gnat life cycle instead of just swatting the adults.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:flex-start; gap:14px; background:#ffffff; padding:12px 15px; margin-bottom:10px;'>\n      <div style='flex:0 0 34px; height:34px; background:#8f4f45; text-align:center; line-height:34px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>1</div>\n      <div><p style='margin:0; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Let the soil dry between waterings</p><p style='margin:3px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Why it works: the larvae live in the top 1 to 2 inches of moist mix. Drying it kills them and stops adults laying new eggs. This is the single most important step.</p></div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:14px; background:#ffffff; padding:12px 15px; margin-bottom:10px;'>\n      <div style='flex:0 0 34px; height:34px; background:#8f4f45; text-align:center; line-height:34px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>2</div>\n      <div><p style='margin:0; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Water from the bottom</p><p style='margin:3px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Why it works: using saucers under pots lets the roots drink while the top layer, where larvae live, stays dry and inhospitable.</p></div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:14px; background:#ffffff; padding:12px 15px; margin-bottom:10px;'>\n      <div style='flex:0 0 34px; height:34px; background:#8f4f45; text-align:center; line-height:34px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>3</div>\n      <div><p style='margin:0; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Set out yellow sticky traps</p><p style='margin:3px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Why it works: they catch the adults and, as the weekly count drops, tell you your watering changes are working.</p></div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:14px; background:#ffffff; padding:12px 15px; margin-bottom:10px;'>\n      <div style='flex:0 0 34px; height:34px; background:#8f4f45; text-align:center; line-height:34px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>4</div>\n      <div><p style='margin:0; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Apply a Bti soil drench</p><p style='margin:3px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Why it works: Bti (Mosquito Bits, Gnatrol) is a soil bacterium that targets fly larvae and is harmless to people, pets, and plants. Applied as a drench, not a foliar spray.</p></div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:14px; background:#ffffff; padding:12px 15px;'>\n      <div style='flex:0 0 34px; height:34px; background:#8f4f45; text-align:center; line-height:34px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>5</div>\n      <div><p style='margin:0; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Bring in biological controls</p><p style='margin:3px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Why it works: for recurring problems, beneficial nematodes (Steinernema feltiae, effective at 60 to 90 degrees F) and predatory Hypoaspis mites hunt the larvae in the soil.</p></div>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Source: UC Integrated Pest Management.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["grow-lights-for-indoor-plants-explained-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Grow Light Types Compared</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>For nearly every home gardener the choice is now simple: buy LED.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.86rem;'>\n        <thead>\n          <tr style='background:#dde2d8;'>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Type</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Efficiency (micromoles/joule)</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Heat</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Lifespan</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Cost to Run</th>\n            <th style='text-align:left; padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif;'>Best Use</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>LED</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>2.5 to 3.0 (two to three times fluorescent)</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Runs cool</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Years</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Very low</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>The default. Seeds, greens, herbs</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>T5 Fluorescent</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>About 1.0</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Runs warmer</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Wears out faster</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Moderate</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Fine if you already own one; being phased out</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Incandescent</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Poor; wastes most energy as heat</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; font-weight:600;'>Hot; can scorch leaves</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Short</td>\n            <td style='padding:10px 12px; border:1px solid #dde2d8; color:#1a3b2a !important;'>Wasteful</td>\n            <td style='padding:10px 12px; border:1px solid #962d28 !important; font-weight:600;'>Skip it</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Source: Utah State University research.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["grow-lights-for-indoor-plants-explained-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Grow Light Setup: Distance and Duration</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Distance and duration are where most beginners go wrong, and both are easy to fix.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 250px; background:#ffffff; border-left:5px solid #8f4f45; padding:1rem 1.2rem;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1.4rem; color:#8f4f45 !important;'>2 to 4 in</p>\n        <p style='margin:4px 0 0; font-weight:600; font-size:0.9rem; color:#1a3b2a !important;'>Light above seedlings</p>\n        <p style='margin:6px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Keep the light just 2 to 4 inches above the tops of new seedlings. A light hung too far away is the top cause of weak, stretched seedlings. LEDs run cooler and can sit slightly higher.</p>\n      </div>\n      <div style='flex:1 1 250px; background:#ffffff; border-left:5px solid #8f4f45; padding:1rem 1.2rem;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1.4rem; color:#8f4f45 !important;'>14 to 16 hrs</p>\n        <p style='margin:4px 0 0; font-weight:600; font-size:0.9rem; color:#1a3b2a !important;'>On a timer, then dark</p>\n        <p style='margin:6px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>Give 12 hours minimum, 14 to 16 ideal, followed by about 8 hours of dark. Do not run lights 24 hours; plants build sturdier stems with a real night. A cheap outlet timer handles it.</p>\n      </div>\n    </div>\n    <div style='margin-top:1rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Raise as they grow:</strong> As the plants get taller, lift the fixture to hold that few-inches gap. Intensity drops off sharply with distance, so a modest light kept close beats a powerful one across the room.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Source: University of Illinois Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-dwarf-meyer-lemon-indoors-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The Indoor Meyer Lemon Light Reality Check</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Citrus are among the most light-hungry plants people try to grow indoors.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#8f4f45; padding:14px 16px; text-align:center; margin-bottom:1.1rem;'>\n      <p style='margin:0; font-family:Fraunces,serif; font-size:1.15rem; color:#f8f9f0 !important;'>Citrus need at least 6 hours of direct sun a day</p>\n      <p style='margin:5px 0 0; font-size:0.82rem; color:#d2a097 !important;'>Few indoor spots deliver that. A winter south window, filtered through glass and shortened by low sun, often falls well short.</p>\n    </div>\n    <p style='margin:0 0 0.7rem; font-weight:600; font-size:0.92rem; color:#1a3b2a !important;'>Your three honest options:</p>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 200px; background:#ffffff; border-top:4px solid #dde2d8; padding:1rem 1.1rem;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1rem; color:#8f4f45 !important;'>1. Bright south window</p>\n        <p style='margin:6px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>An exceptionally bright, unobstructed south or west window. Set back a few feet from the glass and it gets only a fraction of the light.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border-top:4px solid #dde2d8; padding:1rem 1.1rem;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1rem; color:#8f4f45 !important;'>2. Add a grow light</p>\n        <p style='margin:6px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>A full-spectrum grow light run 10 to 12 hours daily. Best of all, pair it with your brightest window.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <p style='margin:0; font-family:Fraunces,serif; font-size:1rem; color:#8f4f45 !important;'>3. Grow it outdoors</p>\n        <p style='margin:6px 0 0; font-size:0.82rem; color:#1a3b2a !important;'>The best plan in mild California: keep the pot outdoors in full sun and move it in only for the coldest nights.</p>\n      </div>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: UC Master Gardeners (6 hours direct sun); University of Minnesota Extension (10 to 12 hours supplemental light).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-dwarf-meyer-lemon-indoors-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Container Meyer Lemon Year in Coastal California</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Feed February through October. Water and pollinate by the plant, not the calendar.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.78rem; text-align:center;'>\n        <thead>\n          <tr style='background:#dde2d8;'>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important; font-family:Fraunces,serif; text-align:left;'>Task</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>J</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>F</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>M</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>A</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>M</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>J</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>J</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>A</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>S</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>O</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>N</th>\n            <th style='padding:8px 4px; border:1px solid #dde2d8; color:#1a3b2a !important;'>D</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:8px 6px; border:1px solid #dde2d8; color:#1a3b2a !important; text-align:left; font-weight:600;'>Fertilize (monthly)</td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#8f4f45;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n          </tr>\n          <tr>\n            <td style='padding:8px 6px; border:1px solid #dde2d8; color:#1a3b2a !important; text-align:left; font-weight:600;'>Watch for freeze / move in</td>\n            <td style='border:1px solid #dde2d8; background:#c9a84c;'></td>\n            <td style='border:1px solid #dde2d8; background:#c9a84c;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#f8f9f0;'></td>\n            <td style='border:1px solid #dde2d8; background:#c9a84c;'></td>\n            <td style='border:1px solid #dde2d8; background:#c9a84c;'></td>\n          </tr>\n          <tr>\n            <td style='padding:8px 6px; border:1px solid #dde2d8; color:#1a3b2a !important; text-align:left; font-weight:600;'>Hand-pollinate at bloom</td>\n            <td style='border:1px solid #dde2d8; background:#1a3b2a;'></td>\n            <td style='border:1px solid #dde2d8; background:#1a3b2a;'></td>\n            <td style='border:1px solid #dde2d8; background:#1a3b2a;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#dde2d8;'></td>\n            <td style='border:1px solid #dde2d8; background:#1a3b2a;'></td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='margin-top:0.9rem; display:flex; flex-wrap:wrap; gap:14px; font-size:0.76rem;'>\n      <span style='color:#1a3b2a !important;'><span style='display:inline-block; width:13px; height:13px; background:#8f4f45; vertical-align:middle;'></span> Citrus fertilizer per package, once a month</span>\n      <span style='color:#1a3b2a !important;'><span style='display:inline-block; width:13px; height:13px; background:#c9a84c; vertical-align:middle;'></span> Move indoors only for the freeze nights</span>\n      <span style='color:#1a3b2a !important;'><span style='display:inline-block; width:13px; height:13px; background:#1a3b2a; vertical-align:middle;'></span> Peak bloom: hand-pollinate when indoors</span>\n      <span style='color:#1a3b2a !important;'><span style='display:inline-block; width:13px; height:13px; background:#dde2d8; vertical-align:middle;'></span> Flowers can appear year-round; pollinate whenever indoors</span>\n    </div>\n    <div style='margin-top:0.9rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.83rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Watering (all year):</strong> Water only when the top 2 to 3 inches of the fast-draining mix have dried out, then water thoroughly and let it drain fully. Overwatering is the classic container-citrus killer.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: UC Master Gardeners (fertilize Feb to Oct, water at top 2 to 3 inches dry, peak bloom late winter to early spring). Freeze timing varies by year in Santa Cruz County; move the tree in only when a real freeze threatens.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-herbs-indoors-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Dim Windowsill vs. a Grow Light</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>The single biggest reason indoor herbs fail is not enough light.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 250px; background:#ffffff; border-top:5px solid #962d28; padding:1.1rem 1.3rem;'>\n        <h4 style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 4px; color:#962d28 !important;'>Dim Windowsill</h4>\n        <p style='margin:0 0 10px; font-size:0.78rem; color:#1a3b2a !important;'>Under a coastal fog belt or an east window in winter</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.85rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Leggy, stretched, lax stems reaching for the glass</li>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Pale, thin color</li>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Small leaves</li>\n          <li style='color:#1a3b2a !important;'>Reduced aroma and flavor</li>\n        </ul>\n      </div>\n      <div style='flex:1 1 250px; background:#ffffff; border-top:5px solid #8f4f45; padding:1.1rem 1.3rem;'>\n        <h4 style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 4px; color:#8f4f45 !important;'>Under a Grow Light</h4>\n        <p style='margin:0 0 10px; font-size:0.78rem; color:#1a3b2a !important;'>Full-spectrum LED, 12 to 16 hrs/day, 6 to 12 in above the leaves</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.85rem; color:#1a3b2a !important;'>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Compact, sturdy growth</li>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Deep green color</li>\n          <li style='margin-bottom:5px; color:#1a3b2a !important;'>Full, well-sized leaves</li>\n          <li style='color:#1a3b2a !important;'>Strong aroma; herbs you actually cook with</li>\n        </ul>\n      </div>\n    </div>\n    <div style='margin-top:1rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.84rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>Why glass is not enough:</strong> High-light herbs want roughly 250 to 450 micromoles per square meter per second (more than 1,000 foot-candles). A bright winter window often falls well short for much of the day.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: Iowa State University Extension (thin, spindly, reduced aroma; 12 to 16 hr timer); University of Minnesota Extension (light intensity); Penn State Extension (6 to 12 in placement).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-herbs-indoors-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Which Herbs Actually Thrive Indoors?</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>The dividing line is mostly light appetite and humidity tolerance.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border-left:5px solid #1a3b2a; padding:1rem 1.2rem; margin-bottom:12px;'>\n      <h4 style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>Thrives Indoors</h4>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#8f4f45 !important; font-weight:600;'>Tolerates lower light, cooler temps, drier air &middot; about 6 to 8 hrs</p>\n      <p style='margin:0; font-size:0.86rem; color:#1a3b2a !important;'><strong>Chives, mint</strong> (most forgiving, best for beginners), <strong>parsley, oregano, cilantro.</strong> Cilantro is short-lived and bolts, so resow every few weeks.</p>\n    </div>\n    <div style='background:#ffffff; border-left:5px solid #8f4f45; padding:1rem 1.2rem; margin-bottom:12px;'>\n      <h4 style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#8f4f45 !important;'>Workable With Strong Light</h4>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#8f4f45 !important; font-weight:600;'>Needs your brightest spot &middot; 6 hrs direct sun or 14 to 16 hrs supplemental</p>\n      <p style='margin:0; font-size:0.86rem; color:#1a3b2a !important;'><strong>Basil</strong> (light-hungry and needs warmth; fluorescent 6 in above, 14 to 16 hrs; damaged below 40 degrees F). <strong>Thyme</strong> is borderline: fine under a strong light, will not thrive in a dim corner.</p>\n    </div>\n    <div style='background:#ffffff; border-left:5px solid #962d28; padding:1rem 1.2rem;'>\n      <h4 style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#962d28 !important;'>Struggles Indoors</h4>\n      <p style='margin:0 0 6px; font-size:0.78rem; color:#8f4f45 !important; font-weight:600;'>Demands full direct sun; prone to spider mites in dry air</p>\n      <p style='margin:0; font-size:0.86rem; color:#1a3b2a !important;'><strong>Rosemary</strong> (needs 5 hrs bright window light or 14 to 16 hrs supplemental; the classic heartbreaker), <strong>sage, bay laurel, marjoram, lemon balm, chervil.</strong> Far easier grown outdoors here.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: Iowa State University Extension; Penn State Extension; UC Master Gardeners of Santa Clara County.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-herbs-indoors-california-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>How to Pinch Basil for Bushier Growth</h3>\n    <p style='font-size:0.8rem; margin:6px 0 0; color:#dde2d8 !important;'>Frequent, careful cutting keeps an indoor herb bushy instead of leggy.</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; align-items:stretch;'>\n      <div style='flex:1 1 220px; background:#ffffff; padding:1.1rem 1.3rem;'>\n        <p style='margin:0 0 8px; font-family:Fraunces,serif; font-size:1rem; color:#8f4f45 !important;'>Where to cut</p>\n        <p style='margin:0; font-size:0.86rem; color:#1a3b2a !important;'>Find a <strong>leaf node</strong>, the point where a pair of leaves and two tiny side shoots meet the stem. Snip the stem <strong>just above that node</strong>, cutting back leafy annuals like basil to roughly 4 to 6 inches of stem.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#ffffff; padding:1.1rem 1.3rem;'>\n        <p style='margin:0 0 8px; font-family:Fraunces,serif; font-size:1rem; color:#8f4f45 !important;'>What happens next</p>\n        <p style='margin:0; font-size:0.86rem; color:#1a3b2a !important;'>The plant responds by sending out <strong>two new branches</strong> from the shoots at that node. One stem becomes two, and the plant grows fuller and lower instead of tall and spindly.</p>\n      </div>\n    </div>\n    <div style='margin-top:1rem; background:#ffffff; padding:1rem 1.2rem; text-align:center;'>\n      <p style='margin:0 0 10px; font-size:0.82rem; color:#1a3b2a !important;'>Cut above the node &rarr; two new branches</p>\n      <div style='display:inline-block; text-align:center;'>\n        <div style='width:70px; height:22px; margin:0 auto; border-left:3px solid #1a3b2a; border-right:3px solid #1a3b2a; border-top:3px solid #1a3b2a; border-radius:14px 14px 0 0;'></div>\n        <div style='width:0; height:26px; margin:0 auto; border-left:3px solid #1a3b2a;'></div>\n        <div style='width:110px; height:2px; margin:0 auto; background:#8f4f45;'></div>\n        <p style='margin:2px 0 0; font-size:0.72rem; color:#8f4f45 !important; font-weight:600;'>cut here, just above the leaf node</p>\n        <div style='width:0; height:34px; margin:0 auto; border-left:3px solid #1a3b2a;'></div>\n      </div>\n    </div>\n    <div style='margin-top:1rem; background:#dde2d8; padding:12px 15px;'>\n      <p style='margin:0; font-size:0.85rem; color:#1a3b2a !important;'><strong style='color:#8f4f45 !important;'>The half-the-plant rule:</strong> Always leave at least half the plant's growth intact when you harvest, and pinch off any flower buds as they appear, since flowering turns the flavor bitter.</p>\n    </div>\n    <p style='margin:0.9rem 0 0; font-size:0.72rem; color:#1a3b2a !important;'>Sources: UC Master Gardeners of Sonoma County and Santa Clara County; Iowa State University Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-lettuce-greens-indoors-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Indoor Greens: The Light Setup That Works</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 6px; color:#8f4f45 !important;'>Full-spectrum LED</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>A basic LED shop light over a shallow tray is all most people need. A winter window cannot supply enough light on its own.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 6px; color:#8f4f45 !important;'>Kept close to the leaves</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Just a few inches above the foliage prevents the stretching that makes indoor greens leggy. Raise the light as plants grow to hold the small gap.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1rem; margin:0 0 6px; color:#8f4f45 !important;'>14 to 16 hours daily</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Run it on a timer. A moderate, steady dose beats a short blast, so no oversized light is needed.</p>\n      </div>\n    </div>\n    <div style='margin-top:1.25rem; background:#1a3b2a; padding:1.25rem; text-align:center;'>\n      <p style='font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase; margin:0 0 6px; color:#dde2d8 !important;'>Lettuce Sweet Spot (Daily Light Integral)</p>\n      <p style='font-family:Fraunces,serif; font-size:2.4rem; margin:0; color:#d2a097 !important;'>~11.5</p>\n      <p style='font-size:0.8rem; margin:6px 0 0; color:#f8f9f0 !important;'>moles per square meter per day. Pushing it up to 14.4 actually <em>reduced</em> yield.</p>\n    </div>\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Sources: Scientific Reports (lettuce yield study); University of Illinois Extension (window light and light distance).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["growing-lettuce-greens-indoors-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Cut and Come Again: One Sowing, Weeks of Salad</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1.25rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 8px; color:#8f4f45 !important;'>How to cut</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.85rem; line-height:1.6; color:#1a3b2a !important;'>\n          <li>Harvest the <strong>outer leaves</strong>, never the whole plant</li>\n          <li>Let the center keep growing for the next cutting</li>\n          <li>Cut once leaves reach <strong>3 to 4 inches</strong></li>\n          <li>Cut about an inch above the growing point</li>\n          <li>The plant regrows for another cutting or two</li>\n        </ul>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 8px; color:#8f4f45 !important;'>Never run out</p>\n        <p style='font-size:0.85rem; line-height:1.6; margin:0 0 8px; color:#1a3b2a !important;'>Sow a fresh tray every <strong>2 to 3 weeks</strong> (succession planting) so a new batch is always coming up as an older one winds down.</p>\n        <p style='font-size:0.85rem; line-height:1.6; margin:0; color:#1a3b2a !important;'>A rotation of two or three small trays under one light keeps a household in salad most of the year.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; padding:1rem; text-align:center;'>\n      <p style='font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; margin:0 0 10px; color:#1a3b2a !important;'>Succession Sowing Rhythm</p>\n      <div style='display:flex; flex-wrap:wrap; justify-content:center; gap:8px;'>\n        <span style='background:#1a3b2a; padding:8px 14px; font-size:0.8rem; color:#f8f9f0 !important;'>Week 1: sow tray A</span>\n        <span style='background:#2e6b46; padding:8px 14px; font-size:0.8rem; color:#f8f9f0 !important;'>Week 3: sow tray B</span>\n        <span style='background:#8f4f45; padding:8px 14px; font-size:0.8rem; color:#f8f9f0 !important;'>Week 5: sow tray C</span>\n        <span style='background:#1a3b2a; padding:8px 14px; font-size:0.8rem; color:#f8f9f0 !important;'>Repeat, harvesting all along</span>\n      </div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["indoor-gardening-california-guide-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The Indoor Light Gap (Foot-Candles)</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <p style='font-size:0.85rem; line-height:1.5; margin:0 0 1.25rem; color:#1a3b2a !important;'>Our eyes adjust, so a bright kitchen and a sunny yard both feel bright. Plants do not experience it that way. Bars are scaled to the light gap.</p>\n\n    <div style='margin-bottom:1.1rem;'>\n      <div style='display:flex; justify-content:space-between; margin-bottom:4px;'>\n        <span style='font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Outdoor sun</span>\n        <span style='font-size:0.85rem; font-weight:700; color:#8f4f45 !important;'>10,000 to 12,000</span>\n      </div>\n      <div style='background:#dde2d8; width:100%;'><div style='background:#2e6b46; width:100%; height:26px;'></div></div>\n      <p style='font-size:0.76rem; margin:4px 0 0; color:#1a3b2a !important;'>Supports everything, including fruiting crops like tomatoes and peppers.</p>\n    </div>\n\n    <div style='margin-bottom:1.1rem;'>\n      <div style='display:flex; justify-content:space-between; margin-bottom:4px;'>\n        <span style='font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Bright south window</span>\n        <span style='font-size:0.85rem; font-weight:700; color:#8f4f45 !important;'>2,000 to 5,000</span>\n      </div>\n      <div style='background:#dde2d8; width:100%;'><div style='background:#2e6b46; width:42%; height:26px;'></div></div>\n      <p style='font-size:0.76rem; margin:4px 0 0; color:#1a3b2a !important;'>Strong windowsill herbs and houseplants; still short of full sun for fruiting crops.</p>\n    </div>\n\n    <div style='margin-bottom:1.1rem;'>\n      <div style='display:flex; justify-content:space-between; margin-bottom:4px;'>\n        <span style='font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>North window</span>\n        <span style='font-size:0.85rem; font-weight:700; color:#8f4f45 !important;'>under 400</span>\n      </div>\n      <div style='background:#dde2d8; width:100%;'><div style='background:#8f4f45; width:8%; height:26px;'></div></div>\n      <p style='font-size:0.76rem; margin:4px 0 0; color:#1a3b2a !important;'>Low-light only: snake plant, ZZ plant, pothos, sprouts.</p>\n    </div>\n\n    <div style='margin-bottom:0.5rem;'>\n      <div style='display:flex; justify-content:space-between; margin-bottom:4px;'>\n        <span style='font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Typical room lighting</span>\n        <span style='font-size:0.85rem; font-weight:700; color:#8f4f45 !important;'>40 or fewer</span>\n      </div>\n      <div style='background:#dde2d8; width:100%;'><div style='background:#8f4f45; width:2%; height:26px;'></div></div>\n      <p style='font-size:0.76rem; margin:4px 0 0; color:#1a3b2a !important;'>Not enough for plants to grow. Add a grow light or match the plant to real window light.</p>\n    </div>\n\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Source: University of Illinois Extension (outdoor and window foot-candle ranges).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["indoor-gardening-california-guide-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Match the Plant to Your Window</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>North window / dim corner</p>\n        <p style='font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 8px; color:#8f4f45 !important;'>Low light</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Snake plant, ZZ plant, pothos, sprouts.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>East / bright indirect window</p>\n        <p style='font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 8px; color:#8f4f45 !important;'>Medium light</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Many houseplants, mint, parsley, microgreens.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#1a3b2a !important;'>South / west window, unobstructed</p>\n        <p style='font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 8px; color:#8f4f45 !important;'>High indoor light</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>The strongest windowsill herbs, and still not enough for fruiting crops.</p>\n      </div>\n    </div>\n\n    <div style='margin-top:1.25rem; background:#1a3b2a; padding:1.25rem;'>\n      <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 8px; color:#d2a097 !important;'>The paper-shadow test</p>\n      <p style='font-size:0.85rem; line-height:1.6; margin:0; color:#f8f9f0 !important;'>Hold your hand a foot above a white sheet of paper at midday.\n      <strong style='color:#d2a097 !important;'>Sharp, dark shadow</strong> means bright light.\n      <strong style='color:#d2a097 !important;'>Soft, fuzzy shadow</strong> means medium light.\n      <strong style='color:#d2a097 !important;'>Barely any shadow</strong> means low light, suitable only for the toughest houseplants.</p>\n    </div>\n\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Sources: University of Missouri Extension (light ranges); Penn State Extension (shadow test).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["kratky-hydroponics-beginners-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Inside a Kratky Jar: How the Air Gap Works</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1.25rem; align-items:stretch;'>\n\n      <div style='flex:1 1 200px; max-width:320px; margin:0 auto;'>\n        <div style='background:#dde2d8; border:2px solid #1a3b2a; border-bottom:none; text-align:center; padding:8px 4px;'>\n          <span style='font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Net cup + seedling</span>\n          <div style='font-size:0.72rem; color:#1a3b2a !important;'>sits in the lid, growing medium holds the plant</div>\n        </div>\n        <div style='background:#f8f9f0; border:2px solid #1a3b2a; border-top:none; border-bottom:none; padding:14px 8px; text-align:center;'>\n          <span style='font-size:0.78rem; font-weight:700; color:#8f4f45 !important;'>Growing air gap</span>\n          <div style='font-size:0.72rem; color:#1a3b2a !important;'>enlarges as the plant drinks; feeds the oxygen roots</div>\n        </div>\n        <div style='background:#2e6b46; border:2px solid #1a3b2a; border-top:none; padding:22px 8px; text-align:center;'>\n          <span style='font-size:0.78rem; font-weight:700; color:#f8f9f0 !important;'>Nutrient solution</span>\n          <div style='font-size:0.72rem; color:#dde2d8 !important;'>level drops over time (never top it back up)</div>\n        </div>\n      </div>\n\n      <div style='flex:1 1 240px;'>\n        <div style='background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:0.9rem; margin-bottom:0.9rem;'>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 4px; color:#8f4f45 !important;'>Oxygen roots</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Left in the widening air space, their main job is aeration. This is why no pump or air stone is needed.</p>\n        </div>\n        <div style='background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #2e6b46; padding:0.9rem; margin-bottom:0.9rem;'>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 4px; color:#2e6b46 !important;'>Water and nutrient roots</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Reach down into the liquid to absorb water and dissolved fertilizer.</p>\n        </div>\n        <div style='background:#1a3b2a; padding:0.9rem;'>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#f8f9f0 !important;'><strong style='color:#d2a097 !important;'>The one rule:</strong> do not raise the solution level. Submerging the oxygen roots drowns the plant. Let it draw down.</p>\n        </div>\n      </div>\n    </div>\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Source: Dr. B.A. Kratky, University of Hawaii College of Tropical Agriculture and Human Resources (2009).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["kratky-hydroponics-beginners-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Kratky Nutrient Targets for Leafy Greens</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #2e6b46; padding:1rem; margin-bottom:1rem;'>\n      <p style='font-family:Fraunces,serif; font-size:1.05rem; margin:0 0 4px; color:#2e6b46 !important;'>Use a complete hydroponic fertilizer</p>\n      <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>It must include <strong>calcium and magnesium</strong>, which most general plant foods leave out. A plant in plain water has nothing else to draw on.</p>\n    </div>\n\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; margin-bottom:1rem;'>\n      <div style='flex:1 1 200px; background:#1a3b2a; padding:1.25rem; text-align:center;'>\n        <p style='font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; margin:0 0 6px; color:#dde2d8 !important;'>Strength (EC)</p>\n        <p style='font-family:Fraunces,serif; font-size:1.9rem; margin:0; color:#d2a097 !important;'>1.25 to 1.5</p>\n        <p style='font-size:0.78rem; margin:6px 0 0; color:#f8f9f0 !important;'>milliSiemens. Mix to the label rate for leafy greens.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#1a3b2a; padding:1.25rem; text-align:center;'>\n        <p style='font-size:0.78rem; letter-spacing:0.06em; text-transform:uppercase; margin:0 0 6px; color:#dde2d8 !important;'>pH</p>\n        <p style='font-family:Fraunces,serif; font-size:1.9rem; margin:0; color:#d2a097 !important;'>5.5 to 6</p>\n        <p style='font-size:0.78rem; margin:6px 0 0; color:#f8f9f0 !important;'>For a first jar on decent water, you can usually skip pH tinkering.</p>\n      </div>\n    </div>\n\n    <div style='background:#dde2d8; padding:1rem; text-align:center;'>\n      <p style='font-size:0.9rem; font-weight:700; margin:0; color:#8f4f45 !important;'>Regular houseplant food will not work</p>\n      <p style='font-size:0.82rem; line-height:1.5; margin:6px 0 0; color:#1a3b2a !important;'>A squirt of general plant food in water produces pale, stunted, unhappy lettuce.</p>\n    </div>\n\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Sources: University of Florida IFAS Extension; Dr. B.A. Kratky (University of Hawaii) trials.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["regrowing-vegetables-from-scraps-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Scrap Regrowing: Real Crop vs. Fun Tuft</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n\n      <div style='flex:1 1 300px;'>\n        <div style='background:#2e6b46; padding:10px 14px; text-align:center;'>\n          <p style='font-family:Fraunces,serif; font-size:1rem; margin:0; color:#f8f9f0 !important;'>Genuinely regrows into a productive plant</p>\n        </div>\n        <div style='overflow-x:auto;'>\n          <table style='width:100%; border-collapse:collapse; background:#ffffff;'>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; width:34%; color:#1a3b2a !important;'>Green onions</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Root ends in a glass of water; snip green tops. Shoots in 1 to 2 weeks; pot up for an ongoing supply.</td>\n            </tr>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Herb cuttings</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Root a sprig (basil, mint, oregano, thyme, sage) in water; pot up. True propagation, entirely new plants.</td>\n            </tr>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Lemongrass</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Stand plump stalks in water; roots in 2 to 3 weeks, then pot up. Vigorous new plant.</td>\n            </tr>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Potato / sweet potato</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Eye pieces sprout; sweet potato grows leafy slips over water. Plant slips out. Use untreated stock.</td>\n            </tr>\n            <tr>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Ginger</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Plant a rhizome piece with 2 to 3 eyes. Slow, often 1 to 2 months to sprout. Choose organic.</td>\n            </tr>\n          </table>\n        </div>\n      </div>\n\n      <div style='flex:1 1 300px;'>\n        <div style='background:#8f4f45; padding:10px 14px; text-align:center;'>\n          <p style='font-family:Fraunces,serif; font-size:1rem; margin:0; color:#f8f9f0 !important;'>Novelty only: a tuft, not a crop</p>\n        </div>\n        <div style='overflow-x:auto;'>\n          <table style='width:100%; border-collapse:collapse; background:#ffffff;'>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; width:34%; color:#1a3b2a !important;'>Celery</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Base in water sprouts a small rosette of leaves. No new head. Garnish generator only.</td>\n            </tr>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Lettuce</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Heart in water pushes a modest flush of pale leaves. Never a new head.</td>\n            </tr>\n            <tr style='border-bottom:1px solid #dde2d8;'>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Bok choy</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Same as celery: a few center leaves you can trim and eat, not a rebuilt plant.</td>\n            </tr>\n            <tr>\n              <td style='padding:9px 10px; font-size:0.82rem; font-weight:700; color:#1a3b2a !important;'>Carrot &amp; beet tops</td>\n              <td style='padding:9px 10px; font-size:0.8rem; color:#1a3b2a !important;'>Sprout feathery greens only. You will not get a new root. Greens are edible as a garnish.</td>\n            </tr>\n          </table>\n        </div>\n      </div>\n\n    </div>\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Sources: Iowa State University Extension; UC Cooperative Extension; UC Master Gardeners of Sonoma County.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["regrowing-vegetables-from-scraps-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Do This: A Scrap-Regrowing Checklist</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border:1px solid #dde2d8; padding:0.5rem 0.5rem;'>\n\n      <div style='display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-bottom:1px solid #dde2d8;'>\n        <span style='font-family:Fraunces,serif; font-size:1.3rem; line-height:1; color:#8f4f45 !important;'>1</span>\n        <div>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 2px; color:#1a3b2a !important;'>Give them a bright window</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Scraps start on stored energy, but light sustains new leaf growth. A south-facing sill works most of the year.</p>\n        </div>\n      </div>\n\n      <div style='display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-bottom:1px solid #dde2d8;'>\n        <span style='font-family:Fraunces,serif; font-size:1.3rem; line-height:1; color:#8f4f45 !important;'>2</span>\n        <div>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 2px; color:#1a3b2a !important;'>Change the water on schedule</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Weekly for green onions and lemongrass; daily for celery. Fresh water stops scraps from turning slimy and stalling.</p>\n        </div>\n      </div>\n\n      <div style='display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-bottom:1px solid #dde2d8;'>\n        <span style='font-family:Fraunces,serif; font-size:1.3rem; line-height:1; color:#8f4f45 !important;'>3</span>\n        <div>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 2px; color:#1a3b2a !important;'>Pot up the rooted keepers</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Herbs, lemongrass, green onions, and potato slips do best moved into soil once rooted. Water alone runs out of nutrients quickly.</p>\n        </div>\n      </div>\n\n      <div style='display:flex; align-items:flex-start; gap:12px; padding:12px 10px; border-bottom:1px solid #dde2d8;'>\n        <span style='font-family:Fraunces,serif; font-size:1.3rem; line-height:1; color:#8f4f45 !important;'>4</span>\n        <div>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 2px; color:#1a3b2a !important;'>Use untreated produce for ginger and garlic</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Grocery stock is often treated to stop sprouting. Organic ginger and seed-grade garlic and potatoes root far more reliably.</p>\n        </div>\n      </div>\n\n      <div style='display:flex; align-items:flex-start; gap:12px; padding:12px 10px;'>\n        <span style='font-family:Fraunces,serif; font-size:1.3rem; line-height:1; color:#8f4f45 !important;'>5</span>\n        <div>\n          <p style='font-size:0.9rem; font-weight:700; margin:0 0 2px; color:#1a3b2a !important;'>Set expectations by the plant</p>\n          <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Herbs and green onions reward you. Enjoy celery and carrot-top tufts as a garnish, for the fun of it.</p>\n        </div>\n      </div>\n\n    </div>\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Sources: Iowa State University Extension; UC Master Gardeners of Sonoma County; University of Illinois Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["starting-seeds-indoors-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Coastal Santa Cruz Seed-Starting Calendar</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <p style='font-size:0.85rem; line-height:1.5; margin:0 0 1.1rem; color:#1a3b2a !important;'>On the coast, soil temperature, not frost, sets the pace. Start later and transplant later than inland charts suggest.</p>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; background:#ffffff; min-width:420px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='padding:10px; text-align:left; font-size:0.82rem; color:#f8f9f0 !important;'>Crop</th>\n            <th style='padding:10px; text-align:left; font-size:0.82rem; color:#d2a097 !important;'>Start indoors</th>\n            <th style='padding:10px; text-align:left; font-size:0.82rem; color:#dde2d8 !important;'>Transplant out</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='border-bottom:1px solid #dde2d8;'>\n            <td style='padding:10px; font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Tomatoes</td>\n            <td style='padding:10px; font-size:0.85rem; color:#8f4f45 !important;'>Mid to late February</td>\n            <td style='padding:10px; font-size:0.85rem; color:#1a3b2a !important;'>May, once soil warms</td>\n          </tr>\n          <tr style='border-bottom:1px solid #dde2d8; background:#f8f9f0;'>\n            <td style='padding:10px; font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Peppers &amp; eggplant</td>\n            <td style='padding:10px; font-size:0.85rem; color:#8f4f45 !important;'>Late Feb to early March</td>\n            <td style='padding:10px; font-size:0.85rem; color:#1a3b2a !important;'>Late May</td>\n          </tr>\n          <tr>\n            <td style='padding:10px; font-size:0.85rem; font-weight:700; color:#1a3b2a !important;'>Cool-season crops<br><span style='font-weight:400; font-size:0.76rem; color:#1a3b2a !important;'>(broccoli, kale, lettuce)</span></td>\n            <td style='padding:10px; font-size:0.85rem; color:#8f4f45 !important;'>As early as January</td>\n            <td style='padding:10px; font-size:0.85rem; color:#1a3b2a !important;'>Early spring (tolerate cool soil)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.8rem; line-height:1.5; margin:0.9rem 0 0; color:#1a3b2a !important;'><strong>Rule of thumb:</strong> start most vegetable seeds 6 to 8 weeks before your transplant date.</p>\n    <p style='font-size:0.72rem; line-height:1.5; margin:0.6rem 0 0; color:#8f4f45 !important;'>Source: UC Master Gardener Program. County microclimates vary, so check your own frost pattern first.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["starting-seeds-indoors-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Leggy vs. Sturdy Seedlings</h3>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8f4f45; padding:1.1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 4px; color:#8f4f45 !important;'>Leggy</p>\n        <p style='font-size:0.78rem; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 10px; color:#8f4f45 !important;'>Tall, thin, floppy stems</p>\n        <p style='font-size:0.8rem; font-weight:700; margin:0 0 4px; color:#1a3b2a !important;'>What causes it</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.82rem; line-height:1.6; color:#1a3b2a !important;'>\n          <li>Too little light (the main cause)</li>\n          <li>Too much heat after germination</li>\n          <li>Crowding, so seedlings compete and stretch</li>\n        </ul>\n      </div>\n\n      <div style='flex:1 1 260px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:1.1rem;'>\n        <p style='font-family:Fraunces,serif; font-size:1.1rem; margin:0 0 4px; color:#2e6b46 !important;'>Sturdy</p>\n        <p style='font-size:0.78rem; letter-spacing:0.05em; text-transform:uppercase; margin:0 0 10px; color:#2e6b46 !important;'>Short, thick, strong stems</p>\n        <p style='font-size:0.8rem; font-weight:700; margin:0 0 4px; color:#1a3b2a !important;'>How to get it</p>\n        <ul style='margin:0; padding-left:1.1rem; font-size:0.82rem; line-height:1.6; color:#1a3b2a !important;'>\n          <li>Grow light just 2 to 4 inches above the plants</li>\n          <li>Run it 14 to 16 hours a day</li>\n          <li>Cooler temps once seeds sprout (off the heat mat)</li>\n          <li>Airflow: a gentle fan or a daily brush of your hand</li>\n        </ul>\n      </div>\n\n    </div>\n    <p style='font-size:0.72rem; line-height:1.5; margin:1rem 0 0; color:#8f4f45 !important;'>Source: University of Illinois Extension. Insufficient light is the primary cause of leggy seedlings.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
</script>
