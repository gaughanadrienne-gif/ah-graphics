n or part shade</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Berries feed birds through summer</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#f8f9f0; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>'Howard McMinn' manzanita</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>5&ndash;7 ft, easily kept smaller</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun, needs good drainage</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Late-winter flowers feed hummingbirds</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#ffffff; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Cleveland sage</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>3&ndash;4 ft tidy dome</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Full sun</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Bees and hummingbirds</td>\n          </tr>\n          <tr><td colspan='4' style='padding:0.5rem 0.6rem; background:#8f4f45; color:#f8f9f0 !important; font-weight:700; border:1px solid #dde2d8;'>Perennials &amp; flowers (color &amp; pollinators)</td></tr>\n          <tr>\n            <td style='padding:0.6rem; background:#f8f9f0; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>California fuchsia</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, spreading</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Hummingbirds (late-summer/fall fuel)</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#ffffff; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sticky monkeyflower</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>2&ndash;3 ft subshrub</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun to part shade</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Hummingbirds</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#f8f9f0; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Douglas iris</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low evergreen clumps</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Part to full shade; takes clay</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Spring blooms; shade-garden value</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#ffffff; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>California buckwheat</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Compact</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Native bees and butterflies for months</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#f8f9f0; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Yarrow</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, spreading (lawn alt.)</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Beneficial insects</td>\n          </tr>\n          <tr><td colspan='4' style='padding:0.5rem 0.6rem; background:#8f4f45; color:#f8f9f0 !important; font-weight:700; border:1px solid #dde2d8;'>Grasses &amp; groundcovers (knit it together)</td></tr>\n          <tr>\n            <td style='padding:0.6rem; background:#ffffff; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Deer grass</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>3&ndash;4 ft fountain form</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Focal specimen; shelter</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#f8f9f0; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Carex (native sedges)</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low, fine-textured mat</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Shade to part sun</td>\n            <td style='padding:0.6rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low-mow lawn alternative</td>\n          </tr>\n          <tr>\n            <td style='padding:0.6rem; background:#ffffff; font-weight:700; color:#1a3b2a !important; border:1px solid #dde2d8;'>Beach strawberry</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Low glossy mat</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Sun to part shade; loves fog</td>\n            <td style='padding:0.6rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Fills between larger plants</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; margin:1rem 0 0; color:#1a3b2a !important;'>Source: California Native Plant Society Calscape. Choose naturally compact varieties rather than constantly pruning large ones.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-california-native-plants-small-garden-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Match Natives to Your Santa Cruz Microclimate</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>The wrong match, not the small space, is why most natives fail</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:1.1rem;'>\n        <p style='font-size:0.95rem; font-weight:700; margin:0 0 0.3rem; color:#2e6b46 !important;'>Coastal fog belt</p>\n        <p style='font-size:0.8rem; font-style:italic; margin:0 0 0.6rem; color:#8f4f45 !important;'>Santa Cruz, Capitola, Live Oak</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0 0 0.6rem; color:#1a3b2a !important;'>Cooler, damper summers and less intense sun.</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Best picks:</strong> Douglas iris, coffeeberry, monkeyflower, sedges, beach strawberry. Give manzanita and ceanothus the sunniest, best-drained spot you have.</p>\n      </div>\n\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #c9a84c; padding:1.1rem;'>\n        <p style='font-size:0.95rem; font-weight:700; margin:0 0 0.3rem; color:#8f4f45 !important;'>Sunny inland &amp; south slopes</p>\n        <p style='font-size:0.8rem; font-style:italic; margin:0 0 0.6rem; color:#8f4f45 !important;'>Watsonville, Scotts Valley ridges</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0 0 0.6rem; color:#1a3b2a !important;'>Hotter and drier.</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Best picks:</strong> Cleveland sage, buckwheat, California fuchsia, manzanita.</p>\n      </div>\n\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #1a3b2a; padding:1.1rem;'>\n        <p style='font-size:0.95rem; font-weight:700; margin:0 0 0.3rem; color:#1a3b2a !important;'>Shade zones</p>\n        <p style='font-size:0.8rem; font-style:italic; margin:0 0 0.6rem; color:#8f4f45 !important;'>Under oaks, north side of a house</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0 0 0.6rem; color:#1a3b2a !important;'>Lower light where sun-lovers stretch and fade.</p>\n        <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Best picks:</strong> Douglas iris, native sedges, coffeeberry.</p>\n      </div>\n\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #8f4f45; padding:0.85rem 1.1rem; margin-top:1.25rem;'>\n      <p style='font-size:0.85rem; font-weight:700; margin:0; color:#1a3b2a !important;'>Group plants with similar water needs together (hydrozoning) so you are not overwatering the drought-lovers to keep a thirstier plant happy.</p>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; margin:1rem 0 0; color:#1a3b2a !important;'>Source: California Native Plant Society (CNPS) guidance. Matching plants to your actual light, soil, and moisture is the single biggest predictor of success.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-low-light-houseplants-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>What Counts as Low Light?</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Roughly 50 to 250 foot-candles in a California home</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1.1rem 1.2rem; text-align:center;'>\n      <div style='font-family:Fraunces,serif; font-size:1.6rem; color:#8f4f45 !important;'>50 to 250 foot-candles</div>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>The low-light band for houseplants. For scale, a bright window is 2,000 to 5,000, a north window under 400, and ordinary room lighting 40 or less.</p>\n    </div>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; margin-top:1.2rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Where you find it</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>A north-facing window, an interior room set back from any window, a hallway, or a coastal living room under gray skies.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>The newspaper test</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>A spot just bright enough to read a newspaper comfortably at midday without a lamp. If you need a lamp to read there, it is too dark even for tough plants, and you will want a grow light.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>California note:</strong> Coastal fog and the low winter sun dim indoor light for weeks at a stretch, so a spot that reads as medium in July can drop to low by January. But low light does not mean no light. No houseplant grows in genuine darkness, so a windowless room needs a grow light.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Sources: University of Missouri Extension, Penn State Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-low-light-houseplants-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Nearly Impossible to Kill</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>The three toughest low-light houseplants</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Plant</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Light tolerance</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Watering</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Pet safety</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Snake plant</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Dracaena trifasciata</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Very low, measured as low as 25 foot-candles</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Every 2 to 3 weeks; let soil dry fully, less in winter</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#962d28 !important; font-weight:600;'>Toxic to pets (saponins)</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>ZZ plant</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Zamioculcas zamiifolia</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Fine even under a single fluorescent office bulb</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Only when soil dries fully; coasts through neglect</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#962d28 !important; font-weight:600;'>Toxic to pets (calcium oxalate)</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Pothos</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Epipremnum aureum</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Low to medium; endlessly adaptable</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Droops slightly when thirsty, perks up after a drink</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#962d28 !important; font-weight:600;'>Toxic to pets (calcium oxalate)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #8f4f45; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Pet owners, note:</strong> All three of the toughest low-light plants are toxic to cats and dogs, causing mouth and stomach irritation if chewed. Keep them out of reach, or choose cast iron plant or parlor palm instead.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Sources: Penn State Extension, ASPCA.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["best-low-light-houseplants-california-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Low-Light Plants With More Personality</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Four picks for shape, texture, and pet-safe options</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:580px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Plant</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Leaf look</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Difficulty</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Pet safety</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Cast iron plant</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Aspidistra elatior</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Broad, arching, dark green</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Very easy; survives deep shade and neglect</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#2e6b46 !important; font-weight:600;'>Pet-safe (non-toxic)</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Chinese evergreen</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Aglaonema</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Silver, cream, or pink patterning; darker types take least light</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Easy; not fussy about light or water</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#962d28 !important; font-weight:600;'>Toxic to pets (calcium oxalate)</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Peace lily</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Spathiphyllum</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Glossy green leaves, white flowers with a bit more light</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Easy; droops dramatically when thirsty, recovers in hours</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#962d28 !important; font-weight:600;'>Toxic to pets (calcium oxalate)</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'><strong>Parlor palm</strong><br><span style='font-size:0.8rem; color:#8f4f45 !important;'>Chamaedorea elegans</span></td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Soft, tropical, feathery fronds</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Easy; slow-growing, keep evenly moist not soggy</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#2e6b46 !important; font-weight:600;'>Pet-safe (non-toxic)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.88rem; line-height:1.5; margin:1.1rem 0 0; color:#1a3b2a !important;'>Cast iron plant and parlor palm are the two genuinely pet-safe picks here, a rare pairing of drama and low-light tolerance.</p>\n    <p style='font-size:0.78rem; margin:0.9rem 0 0; color:#1a3b2a !important;'>Sources: Penn State Extension, ASPCA.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["damping-off-seedlings-prevention-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>What Causes Damping-Off &mdash; and the Fix</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Nearly every risk factor comes down to too much moisture and too little air</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.85rem; min-width:480px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:0.7rem; background:#8f4f45; color:#f8f9f0 !important; border:1px solid #dde2d8; width:45%;'>Risk factor</th>\n            <th style='text-align:left; padding:0.7rem; background:#2e6b46; color:#f8f9f0 !important; border:1px solid #dde2d8;'>The fix</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:0.7rem; background:#ffffff; font-weight:700; color:#962d28 !important; border:1px solid #dde2d8;'>Overwatering &amp; soggy mix<br><span style='font-weight:400; font-size:0.8rem; color:#1a3b2a !important;'>The number-one cause; waterlogged mix holds no oxygen</span></td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Keep mix moist, never soggy. Water from the bottom and let the surface dry between waterings.</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#ffffff; font-weight:700; color:#962d28 !important; border:1px solid #dde2d8;'>Cool, wet soil<br><span style='font-weight:400; font-size:0.8rem; color:#1a3b2a !important;'>Slow germination gives pathogens more time</span></td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Use bottom heat to keep the mix in the seed's preferred range so seedlings grow up fast.</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#ffffff; font-weight:700; color:#962d28 !important; border:1px solid #dde2d8;'>Poor air circulation<br><span style='font-weight:400; font-size:0.8rem; color:#1a3b2a !important;'>Still, humid air keeps stems damp</span></td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Run a small fan a few hours a day. Take the humidity dome off once seedlings emerge.</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#ffffff; font-weight:700; color:#962d28 !important; border:1px solid #dde2d8;'>Dirty containers &amp; reused mix<br><span style='font-weight:400; font-size:0.8rem; color:#1a3b2a !important;'>Pathogens survive on old particles</span></td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Start with fresh sterile seed-starting mix. Soak reused pots in 10% bleach for 30 minutes.</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#ffffff; font-weight:700; color:#962d28 !important; border:1px solid #dde2d8;'>Sowing too thickly<br><span style='font-weight:400; font-size:0.8rem; color:#1a3b2a !important;'>Crowded seedlings trap moisture</span></td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#1a3b2a !important; border:1px solid #dde2d8;'>Thin seedlings so each has room for air. Snip extras at the soil line rather than pulling.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; margin:1rem 0 0; color:#1a3b2a !important;'>Source: UC Statewide Integrated Pest Management Program (UC IPM). There is no cure once a seedling collapses, so prevention is everything.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["damping-off-seedlings-prevention-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>The Damping-Off-Proof Seed-Starting Setup</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Five habits that keep surfaces and stems dry</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 150px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #c9a84c; padding:1rem; text-align:center;'>\n        <p style='font-size:0.85rem; font-weight:700; margin:0 0 0.4rem; color:#c9a84c !important;'>Light close overhead</p>\n        <p style='font-size:0.8rem; line-height:1.45; margin:0; color:#1a3b2a !important;'>Strong light just above the seedlings keeps them growing vigorously and stocky, so they outpace the disease.</p>\n      </div>\n      <div style='flex:1 1 150px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem; text-align:center;'>\n        <p style='font-size:0.85rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Small fan for airflow</p>\n        <p style='font-size:0.8rem; line-height:1.45; margin:0; color:#1a3b2a !important;'>A gentle fan on low, a few hours a day, keeps air moving and surfaces dry, and builds sturdier stems.</p>\n      </div>\n      <div style='flex:1 1 150px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem; text-align:center;'>\n        <p style='font-size:0.85rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Dome removed</p>\n        <p style='font-size:0.8rem; line-height:1.45; margin:0; color:#1a3b2a !important;'>Useful for germination only. Once seedlings emerge, prop it open, then take it off entirely so humid still air cannot build up.</p>\n      </div>\n      <div style='flex:1 1 150px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem; text-align:center;'>\n        <p style='font-size:0.85rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Adequate spacing</p>\n        <p style='font-size:0.8rem; line-height:1.45; margin:0; color:#1a3b2a !important;'>Give each seedling room for air to move around it. Thin crowded ones with scissors at the soil line.</p>\n      </div>\n      <div style='flex:1 1 150px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem; text-align:center;'>\n        <p style='font-size:0.85rem; font-weight:700; margin:0 0 0.4rem; color:#8f4f45 !important;'>Bottom watering</p>\n        <p style='font-size:0.8rem; line-height:1.45; margin:0; color:#1a3b2a !important;'>Set the tray in shallow water for a few minutes, then remove it. Keeps the surface and stem base dry, where the fungi attack.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #8f4f45; padding:0.85rem 1.1rem; margin-top:1.25rem;'>\n      <p style='font-size:0.85rem; font-weight:700; margin:0; color:#1a3b2a !important;'>The three that matter most: bottom-water into sterile mix, run a small fan, and never overwater. Growers who nail those rarely lose a seedling.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gopher-mole-vole-damage-identification-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Gopher vs. Mole vs. Vole</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>The signs differ, and so does the fix</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.85rem; min-width:560px;'>\n        <thead>\n          <tr>\n            <th style='text-align:left; padding:0.7rem; background:#1a3b2a; color:#f8f9f0 !important; border:1px solid #dde2d8;'>&nbsp;</th>\n            <th style='text-align:left; padding:0.7rem; background:#2e6b46; color:#f8f9f0 !important; border:1px solid #dde2d8;'>Pocket Gopher</th>\n            <th style='text-align:left; padding:0.7rem; background:#2e6b46; color:#f8f9f0 !important; border:1px solid #dde2d8;'>Mole</th>\n            <th style='text-align:left; padding:0.7rem; background:#2e6b46; color:#f8f9f0 !important; border:1px solid #dde2d8;'>Vole</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr>\n            <td style='padding:0.7rem; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #ffffff;'>Mound shape</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Crescent / fan-shaped, hole plugged off to one side</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Round, volcano-shaped, hole in the center</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>No mounds at all</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #ffffff;'>Diet</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Roots, bulbs, whole plants (herbivore)</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Earthworms, grubs, soil insects (insectivore)</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Plant crowns, roots, and bark (herbivore)</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #ffffff;'>Other signs</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Plants pulled down from below; chewed roots; no open holes</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Raised surface ridges snaking across the soil; plants heaved but not eaten</td>\n            <td style='padding:0.7rem; background:#ffffff; color:#1a3b2a !important; border:1px solid #dde2d8;'>Surface runways 1&ndash;2 in. wide; open moundless holes; gnawed bark at plant bases</td>\n          </tr>\n          <tr>\n            <td style='padding:0.7rem; background:#dde2d8; font-weight:700; color:#1a3b2a !important; border:1px solid #ffffff;'>Control</td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#8f4f45 !important; font-weight:700; border:1px solid #dde2d8;'>Trapping; hardware cloth barriers &amp; gopher baskets</td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#8f4f45 !important; font-weight:700; border:1px solid #dde2d8;'>Trap in main surface tunnels; often just tolerate</td>\n            <td style='padding:0.7rem; background:#f8f9f0; color:#8f4f45 !important; font-weight:700; border:1px solid #dde2d8;'>Remove ground cover / mulch; snap traps in runways</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; margin:1rem 0 0; color:#1a3b2a !important;'>Source: UC Statewide Integrated Pest Management Program (UC IPM). Gopher baits do not work on insect-eating moles.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["gopher-mole-vole-damage-identification-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Which Burrowing Pest Do I Have?</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Work through three questions in order</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem; margin-bottom:0.5rem;'>\n      <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Step 1: Is there a soil mound?</p>\n      <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>No mound</strong>, only surface runways in the grass and small open holes, plus gnawed bark at plant bases &rarr; <strong style='color:#8f4f45 !important;'>VOLE.</strong> If there is a mound, go to Step 2.</p>\n    </div>\n    <div style='text-align:center; font-size:1.1rem; line-height:1; margin:0 0 0.5rem; color:#8f4f45 !important;'>&darr;</div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem; margin-bottom:0.5rem;'>\n      <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Step 2: What shape is the mound?</p>\n      <p style='font-size:0.85rem; line-height:1.5; margin:0 0 0.4rem; color:#1a3b2a !important;'><strong>Crescent / fan-shaped</strong> with the hole plugged off to one side &rarr; <strong style='color:#8f4f45 !important;'>GOPHER.</strong></p>\n      <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Round volcano</strong> with the hole in the center, plus raised ridges across the surface &rarr; <strong style='color:#8f4f45 !important;'>MOLE.</strong></p>\n    </div>\n    <div style='text-align:center; font-size:1.1rem; line-height:1; margin:0 0 0.5rem; color:#8f4f45 !important;'>&darr;</div>\n\n    <div style='background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.25rem;'>\n      <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#2e6b46 !important;'>Step 3: Are your plants being eaten?</p>\n      <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Whole plants vanishing from below or roots chewed off &rarr; <strong style='color:#8f4f45 !important;'>GOPHER (deep)</strong> or <strong style='color:#8f4f45 !important;'>VOLE (shallow, plus bark damage).</strong> Soil merely heaved but plants untouched &rarr; <strong style='color:#8f4f45 !important;'>MOLE.</strong></p>\n    </div>\n\n    <p style='font-size:0.8rem; font-style:italic; text-align:center; margin:1.25rem 0 0; color:#1a3b2a !important;'>Gophers and voles eat plants; moles do not.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["houseplant-care-for-beginners-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>The Finger-Test Watering Method</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Water on the soil's schedule, not the calendar</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>1. Check the depth</div>\n        <p style='font-size:0.9rem; line-height:1.5; margin:0.5rem 0 0; color:#1a3b2a !important;'>Push a finger <strong>one to two inches</strong> into the soil. Damp soil clinging to your finger means wait. Dry at that depth means it is time to water.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>2. Soak and dry</div>\n        <p style='font-size:0.9rem; line-height:1.5; margin:0.5rem 0 0; color:#1a3b2a !important;'>Water thoroughly until it runs out the drainage hole. This wets the whole root ball and flushes out built-up salts, mimicking real rainfall.</p>\n      </div>\n      <div style='flex:1 1 220px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>3. Empty the saucer</div>\n        <p style='font-size:0.9rem; line-height:1.5; margin:0.5rem 0 0; color:#1a3b2a !important;'>Pour off any water so the pot is never sitting in standing water. Roots left in a wet saucer suffocate and rot.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.9rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>California note:</strong> In a foggy coastal winter, indoor light drops for weeks and plants nearly stop growing, so they need much less water from late fall through early spring. A warm inland summer can double how often the same plant drinks. Tough starters like snake plant, ZZ plant, and pothos usually need water every one to three weeks.</p>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["houseplant-care-for-beginners-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Home Light-Level Guide</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Match the plant to the light you actually have</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:520px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Light band</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Foot-candles</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Window direction</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Quick tests</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Low</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>50 to 250</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>North window or an interior wall</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Just bright enough to read a newspaper at midday. Almost no shadow under your hand.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Medium</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>250 to 1,000</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>East or west window</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>A soft, fuzzy shadow under your hand at noon.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>High</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Above 1,000</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>South window (brightest)</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>A crisp, dark shadow under your hand at noon.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem; margin-top:1.2rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:0.9rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1rem; color:#1a3b2a !important;'>The newspaper test</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>If you can comfortably read a newspaper there at midday without a lamp, it is low light. If you need a lamp, it is darker than that.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; padding:0.9rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1rem; color:#1a3b2a !important;'>The shadow test</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Hold your hand a foot above a white surface at noon. Crisp shadow means bright, fuzzy means medium, almost none means low.</p>\n      </div>\n    </div>\n    <p style='font-size:0.78rem; line-height:1.5; margin:1.1rem 0 0; color:#1a3b2a !important;'>For scale: outdoor sun is roughly 10,000 to 12,000 foot-candles, a bright window only 2,000 to 5,000, a north window under 400, and typical room lighting 40 or less. Sources: University of Missouri Extension, University of Illinois Extension, Penn State Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["houseplant-care-for-beginners-california-g3"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Yellow Leaves: Quick Diagnosis</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>The pattern of yellowing points to the cause</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:560px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>What you see</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Likely cause</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>The fix</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower leaves, uniform soft yellow, soil wet and sour</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Overwatering (most common)</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Stop watering, check for root rot, use a pot with drainage.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Crispy, papery tips and edges, soil bone dry</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Underwatering</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Soak thoroughly, then water when the top inch or two is dry.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower leaves drop, growth leggy and stretched</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Too little light</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Move to a brighter spot or add an inexpensive grow light.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Oldest lower leaves yellow first, pale and uniform</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Nitrogen shortage</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Light, balanced feeding in spring and summer.</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>New top leaves yellow between green veins (interveinal)</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Iron or zinc deficiency</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Balanced feeding or a micronutrient supplement.</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Fine pale stippling of dots, sometimes fine webbing</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Pests (spider mites)</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Isolate and rinse the plant with water; check leaf undersides.</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Reassuring note:</strong> A single old leaf yellowing at the bottom now and then is normal aging. Worry when several leaves yellow at once or new growth is affected.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Sources: UC Agriculture and Natural Resources, University of Illinois Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["houseplant-yellow-leaves-troubleshooting-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Yellow-Leaf Decision Tree</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Start with three questions, then branch to the cause</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:0.8rem; margin-bottom:1.3rem;'>\n      <div style='flex:1 1 160px; background:#1a3b2a; padding:0.9rem 1rem; text-align:center;'>\n        <div style='font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#d2a097 !important;'>Ask 1</div>\n        <div style='font-size:0.92rem; line-height:1.4; margin-top:0.3rem; color:#f8f9f0 !important;'>Where on the plant? Lower old leaves or new top growth?</div>\n      </div>\n      <div style='flex:1 1 160px; background:#1a3b2a; padding:0.9rem 1rem; text-align:center;'>\n        <div style='font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#d2a097 !important;'>Ask 2</div>\n        <div style='font-size:0.92rem; line-height:1.4; margin-top:0.3rem; color:#f8f9f0 !important;'>How does it spread? Uniform, interveinal, crispy edges, or speckled?</div>\n      </div>\n      <div style='flex:1 1 160px; background:#1a3b2a; padding:0.9rem 1rem; text-align:center;'>\n        <div style='font-size:0.78rem; text-transform:uppercase; letter-spacing:0.05em; color:#d2a097 !important;'>Ask 3</div>\n        <div style='font-size:0.92rem; line-height:1.4; margin-top:0.3rem; color:#f8f9f0 !important;'>What is the soil doing? Constantly wet, bone dry, or normal?</div>\n      </div>\n    </div>\n    <div style='text-align:center; font-size:1.3rem; margin-bottom:0.8rem; color:#8f4f45 !important;'>&#9660;</div>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.9rem; min-width:520px;'>\n        <thead>\n          <tr style='background:#8f4f45;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>The clue</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Points to</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower leaves yellow in wet, sour soil</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Overwatering (check first)</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Crispy brown edges in bone-dry soil</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Underwatering</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower leaves drop with leggy, stretched growth</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Low light</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Yellowing between green veins (old leaves = nitrogen, new leaves = iron)</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Nutrient deficiency</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Fine pale speckling with webbing on undersides</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Pests (spider mites)</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>One reassuring note:</strong> A single old bottom leaf yellowing now and then is normal aging. Worry when several leaves yellow at once, yellowing climbs the plant, or new growth is affected.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Sources: UC Agriculture and Natural Resources, University of Illinois Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["houseplant-yellow-leaves-troubleshooting-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Overwatering vs. Underwatering vs. Low Light</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Three lookalike causes of yellowing, told apart</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='overflow-x:auto;'>\n      <table style='width:100%; border-collapse:collapse; font-size:0.88rem; min-width:600px;'>\n        <thead>\n          <tr style='background:#1a3b2a;'>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Clue</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Overwatering</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Underwatering</th>\n            <th style='text-align:left; padding:0.7rem 0.9rem; color:#f8f9f0 !important; font-family:Fraunces,serif; font-weight:600;'>Low light</th>\n          </tr>\n        </thead>\n        <tbody>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Soil condition</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Constantly damp, sometimes sour or musty</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Bone dry, may pull from the pot's sides</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Normal moisture; not the culprit</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Where yellowing starts</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower, older leaves; uniform soft yellow</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Crispy brown tips and edges first</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Lower leaves yellow and drop</td>\n          </tr>\n          <tr style='background:#ffffff;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>Leaf feel</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Soft, limp; stems may be mushy at the base</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Dry, crispy, papery</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Normal, plus leggy stretched growth</td>\n          </tr>\n          <tr style='background:#f8f9f0;'>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#8f4f45 !important; font-weight:600;'>The fix</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Stop watering, check roots for rot, ensure drainage</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Soak thoroughly; it perks up within hours</td>\n            <td style='padding:0.7rem 0.9rem; border-bottom:1px solid #dde2d8; color:#1a3b2a !important;'>Move brighter or add an inexpensive grow light</td>\n          </tr>\n        </tbody>\n      </table>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>When in doubt, wait:</strong> Overwatering is both more common and more dangerous than underwatering, so it is safer to let a plant dry a little longer than to water again too soon. In coastal California, fog and low winter sun can tip a once-happy plant into low-light yellowing by midwinter.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Source: University of Illinois Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["how-to-repot-a-houseplant-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Six Signs a Houseplant Needs Repotting</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Read the plant, not the calendar</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>1. Roots out the drainage hole</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Roots escaping the bottom or circling on the soil surface mean the plant has run out of room.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>2. Circling roots</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Slide the plant out. A solid mass of tangled, circling roots with little soil visible means it is rootbound.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>3. Dries out fast</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Needing water far more often than before, or water pouring straight through, means roots have crowded out the soil.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>4. Salt crust</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>A white mineral crust on the soil surface or pot rim signals it is time to repot and replace old soil.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>5. Stalled growth</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Stalled growth or yellowing lower leaves despite good care can mean cramped roots or broken-down, compacted soil.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-left:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>6. Top-heavy pot</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>A plant that tips over or looks top-heavy for its pot has outgrown its container.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Do not rush it:</strong> Some plants bloom or grow better slightly rootbound. If you slide a plant out and still see plenty of soil, slip it back and wait. Most houseplants need repotting every one to two years.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Source: University of Arkansas Cooperative Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["how-to-repot-a-houseplant-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Pot-and-Soil Selector</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Get these three right and repotting rarely goes wrong</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>Move up one size</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Choose a pot about <strong>one-third wider and deeper</strong>, roughly one to two inches more in diameter. A 4-inch pot goes to a 6-inch, not a 10-inch. Too big holds more water than the roots can drink, and the soggy excess rots roots.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>Drainage hole, always</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Every pot needs a drainage hole, without exception. Love a decorative cachepot with no hole? Grow the plant in a plain nursery pot that lifts out for watering and draining.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.1rem; color:#8f4f45 !important;'>Add perlite when needed</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Use a quality bagged potting mix, never garden soil. For plants that like sharp drainage, such as snake plants, succulents, and cactus, add extra perlite or pumice, or use a cactus blend.</p>\n      </div>\n    </div>\n    <div style='background:#c9a84c; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Skip the old myth:</strong> Do not put gravel or pot shards in the bottom \"for drainage.\" It does the opposite, raising the waterlogged zone up into the root ball. Good potting mix and a drainage hole are all the drainage a houseplant needs.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Source: University of Arkansas Cooperative Extension.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
