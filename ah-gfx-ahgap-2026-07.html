to $1,000</p>\n        <p style='font-size:0.8rem; margin:0; color:#1a3b2a !important;'>rebate value</p>\n      </div>\n\n      <div style='flex:1 1 180px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:1.1rem; text-align:center;'>\n        <p style='font-size:1.1rem; font-weight:700; margin:0 0 0.75rem; color:#1a3b2a !important;'>1,000 sq ft</p>\n        <p style='font-size:1.5rem; font-family:Fraunces,serif; font-weight:700; margin:0; color:#2e6b46 !important;'>~44,000</p>\n        <p style='font-size:0.8rem; margin:0 0 0.75rem; color:#1a3b2a !important;'>gallons saved per year</p>\n        <p style='font-size:1.3rem; font-family:Fraunces,serif; font-weight:700; margin:0; color:#8f4f45 !important;'>up to $2,000</p>\n        <p style='font-size:0.8rem; margin:0; color:#1a3b2a !important;'>rebate value (annual cap)</p>\n      </div>\n\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #c9a84c; padding:0.85rem 1.1rem; margin-top:1.25rem;'>\n      <p style='font-size:0.82rem; font-weight:700; margin:0 0 0.3rem; color:#1a3b2a !important;'>Before you dig:</p>\n      <p style='font-size:0.82rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Soquel Creek Water District's Cash for Grass program pays up to $2 per square foot, capped at $2,000/year for single-family homes, and requires a pre-approval inspection before removing turf. Rebate amounts and eligibility vary by water district and change over time, so confirm current terms with your provider.</p>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; margin:1rem 0 0; color:#1a3b2a !important;'>Water estimate: Metropolitan Water District of Southern California (~44 gal/sq ft/yr). Actual savings vary with soil, exposure, and prior watering.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["replace-lawn-with-california-native-plants-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Sheet Mulching: Smother the Lawn in Place</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>No sod cutter, no chemicals, little digging</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n\n    <div style='display:flex; align-items:flex-start; gap:1rem; background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.1rem; margin-bottom:0.6rem;'>\n      <span style='flex:0 0 auto; font-family:Fraunces,serif; font-size:1.5rem; font-weight:700; color:#8f4f45 !important;'>1</span>\n      <div>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.25rem; color:#1a3b2a !important;'>Mow the lawn low</p>\n        <p style='font-size:0.83rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Cut the grass short so the cardboard lies flat against it.</p>\n      </div>\n    </div>\n\n    <div style='display:flex; align-items:flex-start; gap:1rem; background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.1rem; margin-bottom:0.6rem;'>\n      <span style='flex:0 0 auto; font-family:Fraunces,serif; font-size:1.5rem; font-weight:700; color:#8f4f45 !important;'>2</span>\n      <div>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.25rem; color:#1a3b2a !important;'>Overlap wet cardboard</p>\n        <p style='font-size:0.83rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Lay plain cardboard (tape and labels removed) over the grass, overlapping edges by six inches or more so no light gets through, then wet it thoroughly.</p>\n      </div>\n    </div>\n\n    <div style='display:flex; align-items:flex-start; gap:1rem; background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.1rem; margin-bottom:0.6rem;'>\n      <span style='flex:0 0 auto; font-family:Fraunces,serif; font-size:1.5rem; font-weight:700; color:#8f4f45 !important;'>3</span>\n      <div>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.25rem; color:#1a3b2a !important;'>Add 4 to 6 inches of mulch</p>\n        <p style='font-size:0.83rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Cover the cardboard with four to six inches of mulch or compost.</p>\n      </div>\n    </div>\n\n    <div style='display:flex; align-items:flex-start; gap:1rem; background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #2e6b46; padding:1rem 1.1rem; margin-bottom:0.6rem;'>\n      <span style='flex:0 0 auto; font-family:Fraunces,serif; font-size:1.5rem; font-weight:700; color:#8f4f45 !important;'>4</span>\n      <div>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.25rem; color:#1a3b2a !important;'>Wait through the wet season</p>\n        <p style='font-size:0.83rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>The grass dies from lack of light while the cardboard and mulch break down and feed the soil. Lay it in late summer or early fall; a September start is usually ready by late fall.</p>\n      </div>\n    </div>\n\n    <div style='display:flex; align-items:flex-start; gap:1rem; background:#ffffff; border:1px solid #dde2d8; border-left:5px solid #8f4f45; padding:1rem 1.1rem;'>\n      <span style='flex:0 0 auto; font-family:Fraunces,serif; font-size:1.5rem; font-weight:700; color:#8f4f45 !important;'>5</span>\n      <div>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.25rem; color:#8f4f45 !important;'>Plant natives in fall</p>\n        <p style='font-size:0.83rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Plant into the prepared beds as the winter rains begin, so roots establish before the first dry summer.</p>\n      </div>\n    </div>\n\n    <p style='font-size:0.8rem; font-style:italic; margin:1.1rem 0 0; color:#1a3b2a !important;'>Note: aggressive lawns like Bermuda grass may need a thicker cardboard layer, a longer smothering period, or spot removal of survivors.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["spider-mites-on-houseplants-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Is It Spider Mites?</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>The three signs, and how to rule out overwatering</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>1. Stippling</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>A fine mist of pale dots across the leaf, as if lightly sprayed. As feeding continues, leaves fade to bronze, pale green, or whitish patches.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>2. Underside webbing</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Fine silk webbing on leaf undersides and across leaf junctions. This is the one feature that sets spider mites apart from every other pest.</p>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #8f4f45; padding:1rem 1.1rem;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#8f4f45 !important;'>3. White paper test</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.4rem 0 0; color:#1a3b2a !important;'>Hold white paper under a leaf and tap sharply. Dislodged mites fall and crawl as slow-moving dots the size of ground pepper. If the dots move, you have mites.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>Not to be confused with overwatering:</strong> An overwatered plant shows solid, uniform yellowing with no speckling, no webbing, and no moving dots on the paper test. Spider mite damage is fine and patchy; overwatering damage is whole-leaf and even.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Source: UC Statewide Integrated Pest Management Program (UC IPM).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["spider-mites-on-houseplants-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif; box-sizing:border-box;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.35rem; margin:0; color:#f8f9f0 !important;'>Spider Mite Control Without Harsh Chemicals</h3>\n    <p style='font-size:0.85rem; margin:6px 0 0; color:#dde2d8 !important;'>Work through the steps in order, starting with plain water</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.9rem;'>\n      <div style='flex:0 0 auto; width:38px; height:38px; background:#8f4f45; border-radius:50%; text-align:center; line-height:38px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>1</div>\n      <div style='flex:1 1 auto;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Isolate the plant</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.2rem 0 0; color:#1a3b2a !important;'>Mites spread easily, so move the infested plant away from your others the moment you find them. Check neighbors for stippling too.</p>\n      </div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.9rem;'>\n      <div style='flex:0 0 auto; width:38px; height:38px; background:#8f4f45; border-radius:50%; text-align:center; line-height:38px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>2</div>\n      <div style='flex:1 1 auto;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Rinse the undersides</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.2rem 0 0; color:#1a3b2a !important;'>Forceful spraying with water often reduces mite numbers adequately. Take the plant to a sink, shower, or outdoors and spray thoroughly, top and bottom of every leaf.</p>\n      </div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.9rem;'>\n      <div style='flex:0 0 auto; width:38px; height:38px; background:#8f4f45; border-radius:50%; text-align:center; line-height:38px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>3</div>\n      <div style='flex:1 1 auto;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Wipe the leaves</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.2rem 0 0; color:#1a3b2a !important;'>For sturdy leaves, wipe each one with a damp cloth to remove mites, eggs, and the dust they love in one pass.</p>\n      </div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:1rem; margin-bottom:0.9rem;'>\n      <div style='flex:0 0 auto; width:38px; height:38px; background:#8f4f45; border-radius:50%; text-align:center; line-height:38px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>4</div>\n      <div style='flex:1 1 auto;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Raise the humidity</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.2rem 0 0; color:#1a3b2a !important;'>Mites hate humidity and love dust. Group plants, run a small humidifier, or move the plant to a more humid room like a bathroom.</p>\n      </div>\n    </div>\n    <div style='display:flex; align-items:flex-start; gap:1rem;'>\n      <div style='flex:0 0 auto; width:38px; height:38px; background:#8f4f45; border-radius:50%; text-align:center; line-height:38px; font-family:Fraunces,serif; font-size:1.1rem; color:#f8f9f0 !important;'>5</div>\n      <div style='flex:1 1 auto;'>\n        <div style='font-family:Fraunces,serif; font-size:1.05rem; color:#1a3b2a !important;'>Repeat for two to three weeks</div>\n        <p style='font-size:0.88rem; line-height:1.5; margin:0.2rem 0 0; color:#1a3b2a !important;'>Mites breed fast and eggs keep hatching, so a single treatment rarely finishes the job. Repeat every few days for two to three weeks to break the life cycle.</p>\n      </div>\n    </div>\n    <div style='background:#dde2d8; border-left:5px solid #1a3b2a; padding:0.9rem 1.1rem; margin-top:1.2rem;'>\n      <p style='font-size:0.88rem; line-height:1.5; margin:0; color:#1a3b2a !important;'><strong>If water is not keeping up:</strong> Insecticidal soap or horticultural oil is a gentle next step. Coat the leaf undersides, but do not apply to water-stressed plants or when temperatures exceed 90 degrees, which can burn the foliage.</p>\n    </div>\n    <p style='font-size:0.78rem; margin:1rem 0 0; color:#1a3b2a !important;'>Source: UC Statewide Integrated Pest Management Program (UC IPM).</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["tomato-hornworms-california-g1"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Tomato Hornworm: ID and Damage Signs</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Spot the caterpillar and the trail it leaves behind</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#dde2d8; border-left:5px solid #8f4f45; padding:1rem 1.25rem; margin-bottom:1.25rem;'>\n      <p style='font-size:0.95rem; font-weight:700; margin:0 0 0.5rem; color:#1a3b2a !important;'>What the caterpillar looks like</p>\n      <p style='font-size:0.9rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Up to <strong>4 inches long</strong> and half an inch thick, soft green body the same color as tomato foliage, with <strong>diagonal white stripes</strong> down each side and a single curved <strong>horn at the rear</strong>. The horn is soft and completely harmless. Hides on leaf undersides and stems by day.</p>\n    </div>\n    <p style='font-size:0.95rem; font-weight:700; margin:0 0 0.75rem; color:#1a3b2a !important;'>Three signs you have hornworms</p>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#8f4f45 !important;'>1. Missing leaves and bare stems</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Feeding starts at the top of the plant. Whole leaflets vanish, leaving bare midribs and stripped stems near the growing tips.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#8f4f45 !important;'>2. Dark droppings (frass)</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Large dark green or black pellet-shaped droppings collect on leaves and the ground. The fastest way to find one: look directly above the frass.</p>\n      </div>\n      <div style='flex:1 1 200px; background:#ffffff; border:1px solid #dde2d8; border-top:4px solid #2e6b46; padding:1rem;'>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.4rem; color:#8f4f45 !important;'>3. Chewed green fruit</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0; color:#1a3b2a !important;'>Shallow gouged holes in green tomatoes, which then rot or ripen unevenly.</p>\n      </div>\n    </div>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
window.AH_GRAPHICS["tomato-hornworms-california-g2"] = "<div style='width:100%; margin:2rem 0; font-family:Montserrat,sans-serif;'>\n  <div style='background:#1a3b2a; padding:20px 25px; text-align:center;'>\n    <h3 style='font-family:Fraunces,serif; font-size:1.3rem; margin:0; color:#f8f9f0 !important;'>Should You Remove This Hornworm?</h3>\n    <p style='font-size:0.85rem; margin:8px 0 0; color:#d2a097 !important;'>Check its back before you act</p>\n  </div>\n  <div style='background:#f8f9f0; padding:1.5rem;'>\n    <div style='background:#dde2d8; padding:0.75rem 1rem; text-align:center; margin-bottom:1rem;'>\n      <p style='font-size:0.95rem; font-weight:700; margin:0; color:#1a3b2a !important;'>Look at the caterpillar's back</p>\n    </div>\n    <div style='display:flex; flex-wrap:wrap; gap:1rem;'>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #8f4f45; padding:1.25rem;'>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.5rem; color:#8f4f45 !important;'>Plain green, no cocoons</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0 0 0.75rem; color:#1a3b2a !important;'>A smooth green hornworm with no white capsules is actively feeding on your plants.</p>\n        <div style='background:#f8f9f0; border-left:4px solid #8f4f45; padding:0.6rem 0.85rem;'>\n          <p style='font-size:0.85rem; font-weight:700; margin:0; color:#962d28 !important;'>Remove it. Handpick into soapy water (or feed it to the flock), or spray Bt on small larvae.</p>\n        </div>\n      </div>\n      <div style='flex:1 1 240px; background:#ffffff; border:1px solid #dde2d8; border-top:5px solid #2e6b46; padding:1.25rem;'>\n        <p style='font-size:0.9rem; font-weight:700; margin:0 0 0.5rem; color:#2e6b46 !important;'>Covered in white, rice-like cocoons</p>\n        <p style='font-size:0.85rem; line-height:1.5; margin:0 0 0.75rem; color:#1a3b2a !important;'>Those are the cocoons of braconid parasitic wasps (<em>Cotesia congregata</em>). The hornworm has stopped feeding and will die.</p>\n        <div style='background:#f8f9f0; border-left:4px solid #2e6b46; padding:0.6rem 0.85rem;'>\n          <p style='font-size:0.85rem; font-weight:700; margin:0; color:#2e6b46 !important;'>Leave it alone. The wasps are working. A new generation will emerge to hunt more hornworms for you.</p>\n        </div>\n      </div>\n    </div>\n    <p style='font-size:0.8rem; font-style:italic; text-align:center; margin:1.25rem 0 0; color:#1a3b2a !important;'>To keep the wasps around, skip broad-spectrum insecticides and grow small-flowered plants like sweet alyssum, yarrow, and dill.</p>\n  </div>\n  <p style='text-align:center; font-size:0.75rem; margin:12px 0 0; color:#dde2d8 !important;'>ambitiousharvest.com</p>\n</div>\n";
</script>
