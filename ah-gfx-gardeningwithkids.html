: 600; color: #1a3b2a !important;\">Sage and Thyme</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Common Sage, English Thyme</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Perennial</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Year-round</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Cooking herbs from the Jemima story</td>\n                </tr>\n            </tbody>\n        </table>\n        <div style=\"padding: 12px 15px; font-size: 0.75rem; color: #657665 !important; border-top: 1px solid #dde2d8;\">Source: UC Cooperative Extension, UC Davis lettuce trials. Note: Foxglove appears in Potter's illustrations but is toxic if ingested. Plant as a backdrop only.</div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";
window.AH_GRAPHICS["kids-peter-rabbit-storybook-garden-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Peter Rabbit Garden Activities by Age</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Connecting reading, gardening, and cooking</p>\n    </div>\n    <div style=\"padding: 25px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 3+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Read the Story, Then Plant</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Read \"The Tale of Peter Rabbit\" before planting day. Point out every plant mentioned, then go plant those same plants.</p>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 3+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Harvest Like Peter</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">\"Sneak\" into the garden to pick lettuce and radishes for a fresh salad. Kids who grow it will eat it.</p>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 4+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Chamomile Tea Party</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Harvest and dry chamomile flowers, brew tea with honey. \"This is what Peter's mother gave him.\"</p>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 4+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Radish Racing</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Plant 3-5 radish varieties. Which sprouts first? Which is biggest? A 3-4 week science experiment.</p>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 5+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Mr. McGregor's Garden Map</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Draw a bird's-eye map using story clues. Where was the gate? The cucumber frame? Compare to your real garden.</p>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #1a3b2a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Ages 6+</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 8px;\">Write a New Adventure</div>\n                <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">What if Peter snuck into YOUR garden? What would he eat? Where would he hide? Creative writing from the garden.</p>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; overflow: hidden;\">\n                <div style=\"background-color: #b8694a !important; padding: 14px 18px;\">\n                    <h3 style=\"font-weight: 600; font-size: 1rem; margin: 0; color: #f8f9f0 !important;\">Ages 8 to 12</h3>\n                    <p style=\"font-size: 0.8rem; margin: 4px 0 0 0; color: #f8f9f0 !important; opacity: 0.9;\">Older Kids</p>\n                </div>\n                <div style=\"padding: 18px;\">\n                    <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                        <li style=\"padding: 6px 0; font-size: 0.85rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Plan the layout on paper</li>\n                        <li style=\"padding: 6px 0; font-size: 0.85rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Start seeds indoors</li>\n                        <li style=\"padding: 6px 0; font-size: 0.85rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Measure and space plants</li>\n                        <li style=\"padding: 6px 0; font-size: 0.85rem; color: #1a3b2a !important;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Track pollinators by color</li>\n                    </ul>\n                </div>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";
window.AH_GRAPHICS["kids-rainbow-garden-california-g3"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Rainbow Garden Planting Timeline</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Santa Cruz and central coastal California (USDA 9b/10a)</p>\n    </div>\n    <div style=\"padding: 25px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #fff !important; border-left: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Fall (Oct to Nov)</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 10px;\">Sow cool-season seeds</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">California poppies (orange)</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Larkspur (indigo)</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Calendula (yellow)</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Lavender starts (violet)</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Late Winter (Feb to Mar)</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 10px;\">Start seeds indoors</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Zinnias, marigolds indoors</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Basil indoors</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Cornflower, borage direct</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Strawberry starts</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Spring (Apr to May)</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 10px;\">Transplant warm crops</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Tomatoes, beans outdoors</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Petunias, salvia starts</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Sunflowers direct-sow</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Nasturtiums direct-sow</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-left: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.7rem; color: #657665 !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;\">Summer (Jun to Aug)</div>\n                <div style=\"font-size: 0.95rem; font-weight: 600; color: #1a3b2a !important; margin-bottom: 10px;\">Peak bloom and harvest</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Full rainbow display</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Deadhead spent flowers</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Succession-plant zinnias</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1c3c2c !important;\">Succession-plant sunflowers</li>\n                </ul>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com | Santa Cruz & Bay Area Gardening</div>\n</div>";
window.AH_GRAPHICS["kids-sunflower-fort-living-playhouse-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Living Garden Structures at a Glance</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Four projects from easiest to most ambitious</p>\n    </div>\n    <div style=\"padding: 25px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;\">\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; overflow: hidden;\">\n                <div style=\"background-color: #1a3b2a !important; padding: 14px 18px;\">\n                    <h3 style=\"font-weight: 600; font-size: 1rem; margin: 0; color: #f8f9f0 !important;\">Sunflower Fort</h3>\n                </div>\n                <div style=\"padding: 18px;\">\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;\">\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Time to Ready</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">8-10 weeks</div>\n                        </div>\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Cost</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">$10-25</div>\n                        </div>\n                    </div>\n                    <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Plant 'Mammoth' seeds in a 6-8 ft circle. Grows 10-14 ft tall. Add morning glories between for walls.</p>\n                </div>\n            </div>\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; overflow: hidden;\">\n                <div style=\"background-color: #1a3b2a !important; padding: 14px 18px;\">\n                    <h3 style=\"font-weight: 600; font-size: 1rem; margin: 0; color: #f8f9f0 !important;\">Bean Teepee</h3>\n                </div>\n                <div style=\"padding: 18px;\">\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;\">\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Time to Ready</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">6-8 weeks</div>\n                        </div>\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Cost</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">$18-28</div>\n                        </div>\n                    </div>\n                    <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">6-8 bamboo poles tied at top, 'Scarlet Runner' beans. Red flowers attract hummingbirds. Produces food.</p>\n                </div>\n            </div>\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; overflow: hidden;\">\n                <div style=\"background-color: #1a3b2a !important; padding: 14px 18px;\">\n                    <h3 style=\"font-weight: 600; font-size: 1rem; margin: 0; color: #f8f9f0 !important;\">Gourd Tunnel</h3>\n                </div>\n                <div style=\"padding: 18px;\">\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;\">\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Time to Ready</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">8-10 weeks</div>\n                        </div>\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Cost</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">$38-60</div>\n                        </div>\n                    </div>\n                    <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">Cattle panel arch with gourds growing over it. Walk-through tunnel with gourds dangling overhead. Harvest for fall crafts.</p>\n                </div>\n            </div>\n            <div style=\"background-color: #fff !important; border: 1px solid #dde2d8; overflow: hidden;\">\n                <div style=\"background-color: #1a3b2a !important; padding: 14px 18px;\">\n                    <h3 style=\"font-weight: 600; font-size: 1rem; margin: 0; color: #f8f9f0 !important;\">Mini Corn Maze</h3>\n                </div>\n                <div style=\"padding: 18px;\">\n                    <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px;\">\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Time to Ready</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">10-14 weeks</div>\n                        </div>\n                        <div style=\"background-color: #f8f9f0 !important; padding: 8px; text-align: center;\">\n                            <div style=\"font-size: 0.65rem; color: #657665 !important; text-transform: uppercase; margin-bottom: 3px;\">Cost</div>\n                            <div style=\"font-size: 0.9rem; font-weight: 600; color: #1a3b2a !important;\">$11-20</div>\n                        </div>\n                    </div>\n                    <p style=\"font-size: 0.8rem; color: #1c3c2c !important; margin: 0; line-height: 1.5;\">10x10 ft minimum. Plant corn in blocks with a path left unplanted. 'Glass Gem' for colorful ears. Add surprises along the path.</p>\n                </div>\n            </div>\n        </div>\n        <div style=\"padding: 12px 0 0 0; font-size: 0.75rem; color: #657665 !important;\">Source: UC ANR sunflower/corn guidelines, UC Cooperative Extension runner bean recommendations. All timing for coastal California.</div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";
window.AH_GRAPHICS["kids-sunflower-fort-living-playhouse-g2"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Living Structures: Seasonal Timeline</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Coastal California planting schedule (inland: start 2-3 weeks earlier)</p>\n    </div>\n    <div style=\"padding: 25px; background-color: #f8f9f0 !important;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;\">\n            <div style=\"background-color: #fff !important; border-top: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.75rem; color: #b8694a !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600;\">April</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Direct-sow sunflower seeds</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Direct-sow corn in blocks</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Set up bean teepee, sow beans</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-top: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.75rem; color: #b8694a !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600;\">May</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Sow gourds (soil 65+ degrees)</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Add morning glories to sunflowers</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Plant flowers inside fort circle</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-top: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.75rem; color: #b8694a !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600;\">June to August</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Measure sunflower heights weekly</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Harvest beans from teepee</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Walk through corn maze (5+ ft stalks)</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-top: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.75rem; color: #b8694a !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600;\">September to October</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Harvest sunflower seeds</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important; border-bottom: 1px solid #f0f2ec;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Harvest decorative gourds</li>\n                    <li style=\"padding: 5px 0; font-size: 0.8rem; color: #1a3b2a !important;\"><span style=\"color: #2a5a3e !important; margin-right: 6px;\">&#10003;</span> Compost spent plants, plan next year</li>\n                </ul>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com | Santa Cruz & Bay Area Gardening</div>\n</div>";
window.AH_GRAPHICS["sensory-garden-for-babies-and-toddlers-engaging-little-ones-in-the-garden-g1"] = "<div style=\"width: 100%; margin: 30px 0; font-family: 'Montserrat', system-ui, sans-serif;\">\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 20px 25px; text-align: center;\">\n        <h2 style=\"font-size: 1.3rem; font-weight: 700; margin: 0 0 5px 0; color: #f8f9f0 !important;\">Sensory Garden: Top Plant Picks by Sense</h2>\n        <p style=\"font-size: 0.85rem; margin: 0; opacity: 0.9; color: #f8f9f0 !important;\">Engage all five senses with California-adapted plants</p>\n    </div>\n    <div style=\"padding: 0; background-color: #f8f9f0 !important; overflow-x: auto;\">\n        <table style=\"width: 100%; border-collapse: collapse; min-width: 550px;\">\n            <thead>\n                <tr>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 15px; text-align: left; font-weight: 600; font-size: 0.85rem;\">Sense</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 15px; text-align: left; font-weight: 600; font-size: 0.85rem;\">Star Plant</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 15px; text-align: left; font-weight: 600; font-size: 0.85rem;\">Why Kids Love It</th>\n                    <th style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; padding: 12px 15px; text-align: left; font-weight: 600; font-size: 0.85rem;\">Sun / Water</th>\n                </tr>\n            </thead>\n            <tbody>\n                <tr style=\"background-color: #fff !important; border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 15px; font-weight: 600; color: #1a3b2a !important;\">Touch</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Lamb's Ear</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Softest leaves in the garden; velvet texture</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Full sun / Low</td>\n                </tr>\n                <tr style=\"background-color: #f8f9f0 !important; border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 15px; font-weight: 600; color: #1a3b2a !important;\">Smell</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Chocolate Mint</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Smells like chocolate and mint combined</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Part shade / Moderate</td>\n                </tr>\n                <tr style=\"background-color: #fff !important; border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 15px; font-weight: 600; color: #1a3b2a !important;\">Taste</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">'Sungold' Cherry Tomatoes</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Sweetest snacking tomato; kids eat them like candy</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Full sun / Moderate</td>\n                </tr>\n                <tr style=\"background-color: #f8f9f0 !important; border-bottom: 1px solid #dde2d8;\">\n                    <td style=\"padding: 10px 15px; font-weight: 600; color: #1a3b2a !important;\">Sight</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Rainbow Chard ('Bright Lights')</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Neon stems in 5+ colors; edible too</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Full sun / Moderate</td>\n                </tr>\n                <tr style=\"background-color: #fff !important;\">\n                    <td style=\"padding: 10px 15px; font-weight: 600; color: #1a3b2a !important;\">Sound</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Ornamental Grasses</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Rustling in the breeze; calming natural sound</td>\n                    <td style=\"padding: 10px 15px; color: #1c3c2c !important;\">Full sun / Low</td>\n                </tr>\n            </tbody>\n        </table>\n        <div style=\"padding: 12px 15px; font-size: 0.75rem; color: #657665 !important; border-top: 1px solid #dde2d8;\">Sources: American Horticultural Therapy Association, UC Davis neuroscience, UC Cooperative Extension</div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com</div>\n</div>";

n-bottom: 10px; font-weight: 600;\">Sight</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Rainbow Chard</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Ornamental Kale</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Sunflowers</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Glass Gem Corn</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Coleus</li>\n                </ul>\n            </div>\n            <div style=\"background-color: #fff !important; border-top: 4px solid #b8694a; padding: 18px;\">\n                <div style=\"font-size: 0.75rem; color: #b8694a !important; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; font-weight: 600;\">Sound</div>\n                <ul style=\"list-style: none; padding: 0; margin: 0;\">\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Ornamental Grasses</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Clumping Bamboo</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Love-in-a-Puff (pods)</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Small water feature</li>\n                    <li style=\"padding: 4px 0; font-size: 0.8rem; color: #1a3b2a !important;\">Natural wind chimes</li>\n                </ul>\n            </div>\n        </div>\n    </div>\n    <div style=\"background-color: #1a3b2a !important; color: #f8f9f0 !important; text-align: center; padding: 12px; font-size: 0.75rem;\">ambitiousharvest.com | Santa Cruz & Bay Area Gardening</div>\n</div>";

window.AH_GRAPHICS["5-easy-crops-kids-can-grow-in-santa-cruz-g1"] = "<style>.ah-kids-crops{width:100%;box-sizing:border-box;border:1px solid #dde2d8;border-radius:12px;overflow:hidden;background:#f8f9f0;font-family:Montserrat,sans-serif;margin:24px 0 12px;color:#1a3b2a!important}.ah-kids-crops .ah-table-title{padding:18px 20px;background:#1a3b2a;color:#f8f9f0!important;font:600 22px/1.3 Fraunces,serif}.ah-kids-crops table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}.ah-kids-crops th,.ah-kids-crops td{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid #dde2d8;color:#1a3b2a!important}.ah-kids-crops thead{background:#dde2d8}.ah-kids-crops tbody tr:last-child>*{border-bottom:0}.ah-kids-crops+.ah-graphic-source{font-size:12px;line-height:1.6;color:#1a3b2a!important}@media(max-width:600px){.ah-kids-crops table,.ah-kids-crops tbody,.ah-kids-crops tr,.ah-kids-crops td,.ah-kids-crops tbody th{display:block;width:auto}.ah-kids-crops thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.ah-kids-crops tbody tr{padding:14px 18px;border-bottom:1px solid #dde2d8}.ah-kids-crops tbody tr:last-child{border-bottom:0}.ah-kids-crops tbody th{font-size:19px;padding:0 0 8px;border:0}.ah-kids-crops td{padding:5px 0;border:0}.ah-kids-crops td:before{content:attr(data-label) ': ';font-weight:600}.ah-kids-crops .ah-table-title{font-size:21px}}</style><div class=\"ah-table-wrap ah-kids-crops\">\n<div class=\"ah-table-title\">Kid-Friendly Crops to Grow in Santa Cruz County</div>\n<table class=\"ah-table\">\n<thead>\n<tr>\n<th scope=\"col\">Crop</th>\n<th scope=\"col\">Why kids love it</th>\n<th scope=\"col\">Time to harvest (approx.)</th>\n<th scope=\"col\">Best planting window (Santa Cruz)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<th scope=\"row\">Sunflowers</th>\n<td data-label=\"Why kids love it\">Big seeds, huge flowers, and fast, visible growth</td>\n<td data-label=\"Time to harvest (approx.)\">Variety dependent; check the packet</td>\n<td data-label=\"Best planting window (Santa Cruz)\">Spring, after frost danger and soil warming</td>\n</tr>\n<tr>\n<th scope=\"row\">Cherry tomatoes</th>\n<td data-label=\"Why kids love it\">Small fruit children can pick with help</td>\n<td data-label=\"Time to harvest (approx.)\">Variety dependent; check the transplant label</td>\n<td data-label=\"Best planting window (Santa Cruz)\">After frost danger, once soil warms</td>\n</tr>\n<tr>\n<th scope=\"row\">Snap peas</th>\n<td data-label=\"Why kids love it\">Sweet pods and climbing vines to follow</td>\n<td data-label=\"Time to harvest (approx.)\">Variety dependent; check the packet</td>\n<td data-label=\"Best planting window (Santa Cruz)\">Cool weather in fall or early spring</td>\n</tr>\n<tr>\n<th scope=\"row\">Radishes</th>\n<td data-label=\"Why kids love it\">Ready in about a month; feel like \u201cburied treasure\u201d when pulled</td>\n<td data-label=\"Time to harvest (approx.)\">Roughly 3 to 6 weeks for small salad types</td>\n<td data-label=\"Best planting window (Santa Cruz)\">Cool weather; longer coastal windows where conditions suit</td>\n</tr>\n<tr>\n<th scope=\"row\">Strawberries</th>\n<td data-label=\"Why kids love it\">Daily \u201ctreasure hunt\u201d for ripe berries</td>\n<td data-label=\"Time to harvest (approx.)\">Variety and planting date determine the first crop</td>\n<td data-label=\"Best planting window (Santa Cruz)\">Match variety and nursery stock to Central Coast guidance</td>\n</tr>\n</tbody>\n</table>\n</div><p class=\"ah-graphic-source\">Timing varies with the variety and garden. Sources: <a href=\"https://ipm.ucanr.edu/home-and-landscape/cultural-tips-for-growing-radish/\">UC IPM radishes</a> and <a href=\"https://ipm.ucanr.edu/home-and-landscape/cultural-tips-for-growing-strawberry/\">strawberries</a>. ambitiousharvest.com</p>";

window.AH_GRAPHICS["how-gardening-shapes-kids-eating-habits-what-the-research-shows-and-how-to-make-it-work-g1"] = "<div class=\"ah-table-wrap\">\n <div class=\"ah-table-title\">\n Garden Activities That Support Healthy Eating\n </div>\n\n <table class=\"ah-table\">\n <thead>\n <tr>\n <th scope=\"col\">Garden activity</th>\n <th scope=\"col\">What kids do</th>\n <th scope=\"col\">How it supports healthy eating</th>\n </tr>\n </thead>\n <tbody>\n <tr>\n <th scope=\"row\">Planting and labeling</th>\n <td>\n Choose varieties, sow seeds,\n and create simple plant markers\n </td>\n <td>\n Builds familiarity with vegetable names\n and how foods look at different growth stages\n </td>\n </tr>\n <tr>\n <th scope=\"row\">Daily care and observation</th>\n <td>\n Water, weed, and watch for changes\n </td>\n <td>\n Increases curiosity and a sense of ownership\n over the food they help grow\n </td>\n </tr>\n <tr>\n <th scope=\"row\">Harvesting</th>\n <td>\n Pick ripe produce directly from plants\n </td>\n <td>\n Makes tasting feel natural and celebratory\n rather than obligatory\n </td>\n </tr>\n <tr>\n <th scope=\"row\">Garden-to-table preparation</th>\n <td>\n Wash, prep, and eat simple snacks\n from the harvest\n </td>\n <td>\n Creates a direct link between\n \u201cI grew this\u201d and \u201cI eat this\u201d\n </td>\n </tr>\n </tbody>\n </table>\n</div>";

window.AH_GRAPHICS["how-gardening-supports-kids-mental-health-building-emotional-resilience-in-the-garden-g1"] = "<div class=\"ah-table-wrap\"> <div class=\"ah-table-title\"> Garden Activities and Emotional Benefits </div> <table class=\"ah-table\"> <thead> <tr> <th scope=\"col\">Activity</th> <th scope=\"col\">Emotional benefit</th> <th scope=\"col\">Why it works</th> </tr> </thead> <tbody> <tr> <th scope=\"row\">Watering</th> <td>Calming, grounding</td> <td> Repetitive motion with sensory feedback (sound of water, cool mist) and an immediate visible effect </td> </tr> <tr> <th scope=\"row\">Weeding</th> <td>Stress release, focus</td> <td> Physical outlet for tension; requires attention that can quiet rumination; satisfying visible progress </td> </tr> <tr> <th scope=\"row\">Planting seeds</th> <td>Hope, anticipation</td> <td> Future-focused activity that counters hopelessness; tangible investment in tomorrow </td> </tr> <tr> <th scope=\"row\">Observing (pollinators, new growth)</th> <td>Mindfulness, presence</td> <td> Encourages slowing down and noticing; a natural mindfulness practice </td> </tr> <tr> <th scope=\"row\">Harvesting</th> <td>Accomplishment, pride</td> <td> Concrete evidence of success; celebratory feeling; tangible reward for patience </td> </tr> <tr> <th scope=\"row\">Sensory exploration (smelling herbs, touching textures)</th> <td>Grounding, regulation</td> <td> Activates the parasympathetic nervous system and shifts attention from internal worry to external sensation </td> </tr> </tbody> </table>\n</div>";

window.AH_GRAPHICS["physical-and-developmental-benefits-of-gardening-with-kids-building-bodies-and-brains-in-the-garden-g1"] = "<div class=\"ah-table-wrap\">\n  <div class=\"ah-table-title\">\n    Activity Intensity and Developmental Benefits\n  </div>\n\n  <table class=\"ah-table\">\n    <thead>\n      <tr>\n        <th scope=\"col\">Activity</th>\n        <th scope=\"col\">Intensity level</th>\n        <th scope=\"col\">Movement type</th>\n        <th scope=\"col\">Developmental benefits</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <th scope=\"row\">Gardening (active tasks: digging, hauling)</th>\n        <td>Moderate</td>\n        <td>Bending, lifting, carrying, squatting</td>\n        <td>Strength, balance, coordination, endurance</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Walking</th>\n        <td>Light to moderate</td>\n        <td>Repetitive forward motion</td>\n        <td>Cardiovascular health, leg strength</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Cycling</th>\n        <td>Moderate</td>\n        <td>Repetitive circular leg motion</td>\n        <td>Cardiovascular fitness, leg strength</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Swimming</th>\n        <td>Moderate to vigorous</td>\n        <td>Varied, water-supported movement</td>\n        <td>Cardiovascular fitness, full-body strength</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Organized sports</th>\n        <td>Varies by sport</td>\n        <td>Sport-specific movements</td>\n        <td>Sport skills, teamwork, cardiovascular endurance</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Free play (playground)</th>\n        <td>Varies</td>\n        <td>Varied depending on equipment</td>\n        <td>Balance, climbing ability, social skills</td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Gardening (lighter tasks: watering, observing)</th>\n        <td>Light</td>\n        <td>Walking, bending, fine-motor movements</td>\n        <td>Fine motor skills, sensory engagement, cognitive focus</td>\n      </tr>\n    </tbody>\n  </table>\n</div>";
window.AH_GRAPHICS["physical-and-developmental-benefits-of-gardening-with-kids-building-bodies-and-brains-in-the-garden-g2"] = "<div class=\"ah-table-wrap\">\n  <div class=\"ah-table-title\">\n    Age-Based Gardening Skills and Motor Development\n  </div>\n\n  <table class=\"ah-table\">\n    <thead>\n      <tr>\n        <th scope=\"col\">Age group</th>\n        <th scope=\"col\">Gross motor focus</th>\n        <th scope=\"col\">Fine motor focus</th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <th scope=\"row\">Toddlers (1 to 3)</th>\n        <td>\n          Carry small watering cans, stomp in soil,\n          push toy wheelbarrows, squat and stand repeatedly\n        </td>\n        <td>\n          Sprinkle seeds, pinch soil, pick leaves or petals,\n          poke holes with fingers\n        </td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Early elementary (4 to 7)</th>\n        <td>\n          Dig beds, rake leaves, carry buckets,\n          move soil in small loads\n        </td>\n        <td>\n          Transplant seedlings, use hand tools,\n          tie soft stems to stakes\n        </td>\n      </tr>\n      <tr>\n        <th scope=\"row\">Older kids (8+)</th>\n        <td>\n          Build beds, move wheelbarrow loads of mulch,\n          set up trellises, turn compost\n        </td>\n        <td>\n          Measure and mark spacing, prune small stems,\n          make detailed plant labels, start seeds in cells\n        </td>\n      </tr>\n    </tbody>\n  </table>\n</div>";

window.AH_GRAPHICS["toxic-plants-kids-pets-santa-cruz-g1"] = "<div class=\"ah-toxicity-glance\" style=\"font-family: 'Montserrat', system-ui, sans-serif; width: 100%; margin: 0; background-color: #ffffff !important; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden;\">\n  <div class=\"ah-glance-header\" style=\"background-color: #1a3b2a !important; padding: 16px 20px; text-align: center;\">\n    <h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1.2rem; margin: 0; color: #f8f9f0 !important;\">Plant Risk Depends on the Exposure</h3>\n    <p style=\"font-size: 0.82rem; line-height: 1.5; margin: 6px 0 0; color: #dde2d8 !important;\">A single severity rank cannot describe risk for every child, dog, cat, horse, dose, or plant part.</p>\n  </div>\n  <div class=\"ah-glance-content\" style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background-color: #dde2d8 !important;\">\n    <div class=\"ah-glance-column\" style=\"background-color: #f8f9f0 !important; padding: 18px;\"><p style=\"font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 8px; color: #1a3b2a !important;\">1. Identify the plant</p><p style=\"font-size: 0.82rem; line-height: 1.5; margin: 0; color: #1a3b2a !important;\">Confirm the exact species and the plant part involved. Leaves, seeds, bulbs, sap, flowers, and fruit can differ.</p></div>\n    <div class=\"ah-glance-column\" style=\"background-color: #ffffff !important; padding: 18px;\"><p style=\"font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 8px; color: #1a3b2a !important;\">2. Match the exposed species</p><p style=\"font-size: 0.82rem; line-height: 1.5; margin: 0; color: #1a3b2a !important;\">Human and animal guidance is not interchangeable. Check advice for the person or animal that was exposed.</p></div>\n    <div class=\"ah-glance-column\" style=\"background-color: #f8f9f0 !important; padding: 18px;\"><p style=\"font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; margin: 0 0 8px; color: #1a3b2a !important;\">3. Treat suspected ingestion promptly</p><p style=\"font-size: 0.82rem; line-height: 1.5; margin: 0; color: #1a3b2a !important;\">Do not wait for symptoms or induce vomiting unless a poison-control or veterinary professional instructs you to.</p></div>\n  </div>\n  <div class=\"ah-glance-footer\" style=\"padding: 10px 14px; text-align: center; background-color: #dde2d8 !important;\"><span style=\"font-size: 0.72rem; color: #1a3b2a !important;\">Verify the exact species with California Poison Control, ASPCA Animal Poison Control, or your veterinarian.</span><br><span style=\"font-size: 0.7rem; letter-spacing: 1px; color: #1a3b2a !important;\">ambitiousharvest.com</span></div>\n</div>";
window.AH_GRAPHICS["toxic-plants-kids-pets-santa-cruz-g2"] = "<div class=\"ah-toxic-table-wrapper\" style=\"font-family: 'Montserrat', system-ui, sans-serif; width: 100%; margin: 0; background-color: #f8f9f0 !important; border-radius: 8px; overflow: hidden;\">\n  <div class=\"ah-toxic-header\" style=\"background-color: #1a3b2a !important; padding: 20px 24px;\"><h2 style=\"font-family: Fraunces, Georgia, serif; font-size: 1.35rem; margin: 0 0 6px; color: #f8f9f0 !important;\">Toxic Plant Quick Reference</h2><p style=\"font-size: 0.84rem; line-height: 1.5; margin: 0; color: #dde2d8 !important;\">Use this list to identify a plant, then get advice for the exposed person or animal.</p></div>\n  <div class=\"ah-toxic-table-container\" style=\"overflow-x: auto; background-color: #ffffff !important;\"><table class=\"ah-toxic-table\" style=\"width: 100%; min-width: 720px; border-collapse: collapse; font-size: 0.82rem;\"><thead><tr><th style=\"background-color: #1a3b2a !important; padding: 11px; text-align: left; color: #f8f9f0 !important;\">Plant</th><th style=\"background-color: #1a3b2a !important; padding: 11px; text-align: left; color: #f8f9f0 !important;\">Exposure guidance</th></tr></thead><tbody>\n    <tr style=\"background-color: #ffffff !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Oleander</strong><br><em>Nerium oleander</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">All parts are hazardous. Keep people and animals away, never burn trimmings, and treat suspected ingestion as urgent.</td></tr>\n    <tr style=\"background-color: #f8f9f0 !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Foxglove</strong><br><em>Digitalis purpurea</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">Contains cardiac glycosides. Keep inaccessible and contact poison control or a veterinarian after suspected ingestion.</td></tr>\n    <tr style=\"background-color: #ffffff !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Angel's trumpet</strong><br><em>Brugmansia spp.</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">All parts contain tropane alkaloids. Prevent access and consider removal where children or animals can reach it.</td></tr>\n    <tr style=\"background-color: #f8f9f0 !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Castor bean</strong><br><em>Ricinus communis</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">Seeds contain ricin. Remove plants and seed pods from accessible areas and treat suspected ingestion as an emergency.</td></tr>\n    <tr style=\"background-color: #ffffff !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Sago palm</strong><br><em>Cycas revoluta</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">ASPCA says the entire plant is toxic to pets and studies found up to 50% of animal ingestion cases fatal. Early treatment improves survival.</td></tr>\n    <tr style=\"background-color: #f8f9f0 !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Lily of the valley</strong><br><em>Convallaria majalis</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">All parts contain cardiac glycosides. Prevent access and get immediate advice after suspected ingestion.</td></tr>\n    <tr style=\"background-color: #ffffff !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Yesterday-today-and-tomorrow</strong><br><em>Brunfelsia spp.</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">Dogs are especially vulnerable and poisoning can cause seizures. Keep the whole plant, including berries, inaccessible.</td></tr>\n    <tr style=\"background-color: #f8f9f0 !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Daffodils</strong><br><em>Narcissus spp.</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">Bulbs contain the highest toxin concentration. Store bulbs away from food and prevent animals from digging them up.</td></tr>\n    <tr style=\"background-color: #ffffff !important;\"><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\"><strong>Azaleas and rhododendrons</strong><br><em>Rhododendron spp.</em></td><td style=\"padding: 11px; border-bottom: 1px solid #dde2d8; color: #1a3b2a !important;\">ASPCA lists these as toxic to dogs, cats, and horses. A few leaves can cause serious problems, including cardiovascular collapse and death.</td></tr>\n    <tr style=\"background-color: #f8f9f0 !important;\"><td style=\"padding: 11px; color: #1a3b2a !important;\"><strong>English ivy</strong><br><em>Hedera helix</em></td><td style=\"padding: 11px; color: #1a3b2a !important;\">ASPCA lists it as toxic to dogs, cats, and horses and says foliage is more toxic than berries. Sap can irritate human skin.</td></tr>\n  </tbody></table></div>\n  <div class=\"ah-toxic-source-note\" style=\"padding: 12px 20px; background-color: #dde2d8 !important;\"><p style=\"font-size: 0.74rem; line-height: 1.5; margin: 0; color: #1a3b2a !important;\">Sources: ASPCA Animal Poison Control, North Carolina Extension Gardener Plant Toolbox, UC Davis Toxic Plant Garden, and California Poison Control. No alternative is safe for every person and animal. Verify the exact species before planting.</p></div>\n  <div class=\"ah-toxic-footer\" style=\"padding: 12px; text-align: center; background-color: #1a3b2a !important;\"><span style=\"font-size: 0.72rem; letter-spacing: 1px; color: #f8f9f0 !important;\">ambitiousharvest.com | Santa Cruz County</span></div>\n</div>";
window.AH_GRAPHICS["toxic-plants-kids-pets-santa-cruz-g3"] = "<div class=\"ah-safety-wrapper\" style=\"font-family: 'Montserrat', system-ui, sans-serif; width: 100%; margin: 0; background-color: #f8f9f0 !important; border-radius: 8px; overflow: hidden;\">\n  <div class=\"ah-safety-header\" style=\"background-color: #1a3b2a !important; padding: 22px; text-align: center;\"><h2 style=\"font-family: Fraunces, Georgia, serif; font-size: 1.35rem; margin: 0 0 6px; color: #f8f9f0 !important;\">Family Garden Safety Checklist</h2><p style=\"font-size: 0.84rem; margin: 0; color: #dde2d8 !important;\">Match every decision to the exact plant and the people and animals who use the garden.</p></div>\n  <div class=\"ah-safety-content\" style=\"background-color: #ffffff !important; padding: 22px;\">\n    <div class=\"ah-safety-section\" style=\"margin-bottom: 20px;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 8px; color: #1a3b2a !important;\">Identify and limit access</h3><ul style=\"margin: 0; padding-left: 20px;\"><li style=\"font-size: 0.86rem; line-height: 1.5; margin-bottom: 7px; color: #1a3b2a !important;\">Identify every plant in play areas, pet runs, and grazing areas.</li><li style=\"font-size: 0.86rem; line-height: 1.5; margin-bottom: 7px; color: #1a3b2a !important;\">Check the exact species in an authoritative human or animal poison database.</li><li style=\"font-size: 0.86rem; line-height: 1.5; color: #1a3b2a !important;\">Fence, relocate, or remove plants that create an unacceptable exposure risk.</li></ul></div>\n    <div class=\"ah-safety-section\" style=\"margin-bottom: 20px;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 8px; color: #1a3b2a !important;\">Use plant-specific precautions</h3><ul style=\"margin: 0; padding-left: 20px;\"><li style=\"font-size: 0.86rem; line-height: 1.5; margin-bottom: 7px; color: #1a3b2a !important;\">Never burn oleander trimmings.</li><li style=\"font-size: 0.86rem; line-height: 1.5; margin-bottom: 7px; color: #1a3b2a !important;\">Do not keep sago palms where pets can reach them. ASPCA reports that up to 50% of animal ingestion cases are fatal.</li><li style=\"font-size: 0.86rem; line-height: 1.5; margin-bottom: 7px; color: #1a3b2a !important;\">Store Narcissus bulbs away from food and prevent digging animals from reaching them.</li><li style=\"font-size: 0.86rem; line-height: 1.5; color: #1a3b2a !important;\">Do not assume berries are always the most toxic part. Follow the guidance for that plant.</li></ul></div>\n    <div class=\"ah-emergency-box\" style=\"background-color: #dde2d8 !important; border-radius: 8px; padding: 18px;\"><h3 style=\"font-family: Fraunces, Georgia, serif; font-size: 1rem; margin: 0 0 10px; color: #1a3b2a !important;\">Suspected exposure</h3><p style=\"font-size: 0.84rem; line-height: 1.5; margin: 0 0 10px; color: #1a3b2a !important;\">Do not wait for symptoms or induce vomiting unless a professional instructs you to.</p><p style=\"font-size: 0.84rem; line-height: 1.55; margin: 0; color: #1a3b2a !important;\"><strong>ASPCA Animal Poison Control:</strong> 888-426-4435<br><strong>California Poison Control:</strong> 800-222-1222</p></div>\n  </div>\n  <div class=\"ah-safety-footer\" style=\"background-color: #1a3b2a !important; padding: 12px; text-align: center;\"><span style=\"font-size: 0.72rem; letter-spacing: 1px; color: #f8f9f0 !important;\">ambitiousharvest.com | Santa Cruz County</span></div>\n</div>";
