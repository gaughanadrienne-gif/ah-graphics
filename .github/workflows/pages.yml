name: Verify public assets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify public assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify canonical tool runtimes
        run: python scripts/build_tool_runtimes.py --check
      - name: Check public download inventory
        run: python scripts/check_public_downloads.py
