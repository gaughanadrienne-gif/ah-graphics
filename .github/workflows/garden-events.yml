name: Garden Events refresh

on:
  schedule:
    # Four times daily keeps recurring cards current without hammering sources.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-events-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test event validation
        run: node --test scripts/validate-garden-events.test.mjs
      - name: Refresh and validate against the committed event feed
        run: |
          git show HEAD:garden-events-data.json > "$RUNNER_TEMP/garden-events-baseline.json"
          GARDEN_EVENTS_BASELINE="$RUNNER_TEMP/garden-events-baseline.json" node scripts/refresh-garden-events.mjs
      - name: Commit changes
        run: |
          git config user.name "ah-events-bot"
          git config user.email "actions@github.com"
          git add garden-events-data.json garden-events-source-yield.json
          if git diff --staged --quiet; then
            echo "No event changes."
          else
            git commit -m "data: refresh garden events"
            git push
          fi
