name: Refresh related article recommendations

on:
  push:
    branches: [main]
    paths:
      - build_related_manifest.py
      - .github/workflows/related-articles.yml
  schedule:
    - cron: "43 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: related-articles-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - name: Rebuild from the complete public inventory
        run: python build_related_manifest.py
      - name: Commit validated manifest
        id: commit
        run: |
          git config user.name "ah-related-bot"
          git config user.email "actions@github.com"
          git add related-manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "data: refresh related article recommendations"
            git pull --rebase origin main
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A feed commit may need an explicit build through the configured branch-based Pages publisher.
      - name: Publish refreshed static assets
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" \
            --jq '[.commit, .status] | @tsv' | grep -Eq "^$(git rev-parse HEAD)[[:space:]]+(built|building|queued)$"; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
