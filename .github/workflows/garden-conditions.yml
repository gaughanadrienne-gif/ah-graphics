name: Garden Conditions refresh

on:
  schedule:
    # Hourly snapshots keep the dashboard fast without browser-to-API delays.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: garden-conditions-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build garden conditions snapshot
        run: node scripts/refresh-garden-conditions.mjs
      - name: Validate snapshot
        run: node -e "const d=require('./garden-conditions-data.json'); const z=Object.keys(d.zones||{}); if(z.length!==3) process.exit(1); console.log(z.join(', ')+' validated')"
      - name: Commit snapshot
        run: |
          git config user.name "ah-conditions-bot"
          git config user.email "actions@github.com"
          git add garden-conditions-data.json
          git commit -m "data: refresh garden conditions" || exit 0
          git push
